# A página linux, português do Brasil. Mesmas chaves de "text" do en/linux.yml.
text:
  title: "Pomodoro para Linux: timer grátis e cozy | Pixeldoro"
  description: "Pixeldoro para Linux: um timer pomodoro grátis num mundo cozy em pixel art, onde você estuda com gente real. Build nativa x86_64 com rádio lofi e estatísticas."
  crumb: "linux"
  eyebrow: "pixeldoro para linux"
  h1: "um timer pomodoro cozy que roda no linux"
  lead: "o pixeldoro é um timer pomodoro grátis dentro de um mundo em pixel art, onde você foca ao lado de gente de verdade que está estudando agora. a versão para linux é uma build nativa: extraia, execute, e o timer e a rádio lofi continuam rolando numa janela só deles."
  button: "baixar para linux"
  note: "grátis · 64 bits x86_64 · .tar.gz"
  others: "ou jogue <a href=\"https://play.pixeldoro.io/web-beta\">no navegador</a>, ou baixe para <a href=\"{windows}\">windows</a> · <a href=\"https://play.pixeldoro.io/macos\">mac</a>"
  on_computer: "tem um computador com linux? abra esta página nele pra baixar"
  facts:
    - "grátis · sem anúncios"
    - "build nativa x86_64"
    - "uma conta em todos os dispositivos"
  shot_alt: "Uma casa decorada com três gatos de estimação e dois amigos de visita, cada um mostrando seu número de pomodoros e o que está estudando"
  shot_caption: "chame os amigos pra sua casa. os gatos moram aqui."
  cards_title: "por que baixar o app para linux"
  cards:
    - title: "uma build nativa"
      text: "uma build de linux de verdade, não uma página web dentro de um wrapper. nada é instalado no sistema: fica tudo numa pasta só."
    - title: "rádio lofi integrada"
      text: "seis estações lofi + chill, então não precisa de outra aba tocando música. chuva e neblina chegam enquanto você foca."
    - title: "gente de verdade, agora mesmo"
      text: "cada personagem na sala é uma pessoa real numa sessão de foco, com o timer e a tarefa em cima da cabeça."
    - title: "seu progresso em todo lugar"
      text: "entre com seu e-mail e seu quarto, suas moedas e suas estatísticas te acompanham no celular, no notebook e no navegador."
  steps_title: "como instalar o pixeldoro no linux"
  steps:
    - title: "baixe"
      text: "clique no botão de download pra baixar o pixeldoro como um arquivo .tar.gz."
    - title: "extraia"
      text: "extraia onde quiser, pelo gerenciador de arquivos ou com <code>tar -xzf pixeldoro-*.tar.gz</code>. vai aparecer uma pasta <code>pixeldoro</code>."
    - title: "execute"
      text: "abra a pasta e execute o <code>pixeldoro.x86_64</code>: dê dois cliques nele, ou rode <code>./pixeldoro.x86_64</code> no terminal. entre com seu e-mail se você joga em outros dispositivos também."
  prose_title: "app ou navegador?"
  prose:
    - "o pixeldoro também roda em qualquer navegador, sem instalar nada. o app para linux é pra quem foca no computador todo dia: ele tem janela própria, não fecha junto com as outras abas, e os navegadores deixam lentas as abas que você não está olhando."
    - "novo na técnica? leia o <a href=\"{pomodoro-timer}\">guia do timer pomodoro</a>, ou veja como <a href=\"{study-with-me}\">estudar ao lado de outras pessoas</a> te ajuda a começar."
  faq:
    - q: "o pixeldoro é grátis no linux?"
      a: "sim. o timer, o mundo, os outros jogadores, os amigos e a rádio são todos grátis, sem anúncios e sem assinatura. um pacote de apoiador opcional, com pagamento único, dá moedas bônus e itens premium."
    - q: "em quais distros ele roda?"
      a: "linux desktop 64 bits x86_64 com gráficos opengl 3.2 ou vulkan. o pixeldoro é feito em unity, que suporta oficialmente o ubuntu 20.04 e 22.04. se ele não abrir na sua distro, mande um e-mail para <a href=\"mailto:hello@pixeldoro.io\">hello@pixeldoro.io</a>."
    - q: "tem flatpak, snap ou appimage?"
      a: "ainda não. é uma build simples em .tar.gz: extraia e execute."
    - q: "roda em arm?"
      a: "não, a build de linux é só x86_64. numa máquina arm, jogue <a href=\"https://play.pixeldoro.io/web-beta\">no navegador</a>."
    - q: "como atualizar o pixeldoro?"
      a: "baixe a build mais recente nesta página e substitua a pasta antiga."
    - q: "dá pra usar a mesma conta no celular?"
      a: "sim. entre com o mesmo e-mail no iphone, android, mac ou no navegador e seu progresso, seu quarto e suas moedas vão junto."
    - q: "tem versão para windows ou mac?"
      a: "sim. tem um <a href=\"{windows}\">app para windows</a>, e o mac está na <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>."
  more: "mais: <a href=\"{windows}\">pixeldoro para windows</a> · <a href=\"{pomodoro-timer}\">timer pomodoro</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">página inicial do pixeldoro</a>"
