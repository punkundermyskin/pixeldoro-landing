# La page pomodoro-timer, en français. Mêmes clés que le "text" de en/pomodoro-timer.yml.
text:
  title: "Minuteur pomodoro esthétique, pixel art et lofi | Pixeldoro"
  description: "Minuteur pomodoro gratuit et esthétique dans un monde pixel art cosy: 25/5, 45/15 ou perso, chrono, radio lofi, tags de focus et stats. Sur tous tes appareils."
  crumb: "minuteur pomodoro"
  eyebrow: "guide pixeldoro"
  h1: "un minuteur pomodoro esthétique dans un monde en pixel art"
  lead: "pixeldoro est un minuteur pomodoro gratuit dans une petite ville pixel cosy. choisis un préréglage ou règle le tien, mets la radio lofi et regarde la pluie tomber pendant que tu bosses. chaque pomodoro rapporte des pièces, et tes heures s'accumulent dans des stats réparties selon ce sur quoi tu as bossé."
  facts:
    - "gratuit · sans pub"
    - "sans abonnement"
    - "iphone · mac · android · windows · linux · navigateur · discord"
  shot_alt: "Écran du minuteur de focus: préréglages 25/5, 45/15, 15/3, chrono et perso, un minuteur à 25:00 et des tags de focus colorés comme examens de maths, anglais et physique"
  shot_caption: "choisis sur quoi tu bosses et lance un pomodoro."
  cards_title: "tout ce qu'il faut à un minuteur pomodoro"
  cards:
    - title: "préréglages ou réglages perso"
      text: "25/5, 45/15, 15/3 ou la durée que tu veux. un chrono jusqu'à 8 heures pour les longues sessions de travail en profondeur."
    - title: "radio lofi intégrée"
      text: "six stations lofi et chill, aucune playlist à gérer. la pluie et le brouillard s'installent pendant que tu te concentres."
    - title: "tags de focus"
      text: "étiquette chaque session: examens, code, lecture. une vraie alarme sonne à la fin, et un petit rappel quand la pause est finie."
    - title: "des stats qui s'accumulent"
      text: "vois où passent tes heures, tag par tag, semaine après semaine. chaque session rapporte aussi des pièces pour ta chambre."
  steps_title: "comment utiliser le minuteur pomodoro"
  steps:
    - title: "choisis une durée"
      text: "25/5, c'est le classique. 45/15 convient aux longs blocs de révision, et 15/3 est parfait pour se mettre en route un jour où ça traîne."
    - title: "tague et lance"
      text: "choisis sur quoi tu bosses et appuie sur démarrer. tout le monde autour voit ton minuteur et ta tâche."
    - title: "fais ta pause"
      text: "quand l'alarme sonne, lève-toi, étire-toi, fais un tour en ville. pixeldoro te prévient quand il est temps de t'y remettre."
  prose_title: "c'est quoi, la technique pomodoro?"
  prose:
    - "la technique pomodoro découpe le travail en blocs courts et concentrés, avec des pauses entre les deux. la version classique, c'est 25 minutes de focus et 5 minutes de pause, avec une pause plus longue après quatre tours. elle doit son nom à un minuteur de cuisine en forme de tomate, d'où la mascotte tomate de pixeldoro."
    - "ça marche parce qu'un bloc court, c'est facile à commencer, et une pause qui arrive toujours aide à tenir. si 25 minutes te paraissent longues, commence plus court. si t'es dans ta bulle, passe au chrono et continue."
    - "tu veux juste le minuteur? <a href=\"{mini}\">pixeldoro mini</a> en est la version minimaliste: un minuteur, des fonds en pixel art, de la musique lofi et des stats. envie de compagnie pendant que tu te concentres? va voir <a href=\"{study-with-me}\">study with me</a>."
  faq:
    - q: "quelle est la meilleure durée pour un pomodoro?"
      a: "25 minutes de focus et 5 minutes de pause, c'est le classique. beaucoup préfèrent 45/15 ou 50/10 pour le travail en profondeur, et 15/3 les jours sans énergie. essaie-en quelques-uns et garde ce qui marche."
    - q: "je peux choisir la durée du minuteur?"
      a: "oui. en plus des préréglages 25/5, 45/15 et 15/3, tu peux choisir une durée perso, ou utiliser le chrono jusqu'à 8 heures."
    - q: "ça me prévient quand la session est finie?"
      a: "oui. pixeldoro fait sonner une vraie alarme à la fin de ta session de focus et te prévient quand ta pause est terminée."
    - q: "le minuteur pomodoro est gratuit?"
      a: "oui. le minuteur, la radio, les stats et tout l'univers du jeu sont gratuits, sans pub et sans abonnement."
    - q: "il existe une version plus simple?"
      a: "pixeldoro mini, c'est juste le minuteur: des fonds en pixel art, de la musique lofi et des stats, sur iphone et android."
  more: "plus de guides: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{adhd-focus-app}\">appli de concentration tdah</a> · <a href=\"{home}\">accueil pixeldoro</a>"
