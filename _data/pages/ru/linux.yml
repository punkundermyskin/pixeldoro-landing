# Страница linux, русский. Ключи повторяют text из en/linux.yml.
text:
  title: "Помодоро таймер для Linux, бесплатный и уютный | Pixeldoro"
  description: "Pixeldoro для Linux: бесплатный помодоро таймер в уютном пиксельном мире, где ты учишься рядом с реальными людьми. Нативная сборка x86_64, лофи и статистика."
  crumb: "linux"
  eyebrow: "pixeldoro для linux"
  h1: "уютный помодоро-таймер, который работает на linux"
  lead: "pixeldoro — бесплатный помодоро-таймер внутри пиксельного мира, где ты фокусируешься рядом с реальными людьми, которые учатся прямо сейчас. версия для linux — нативная сборка: распакуй, запусти, и таймер с лофи-радио работают в своем окне."
  button: "скачать для linux"
  note: "бесплатно · 64-бит x86_64 · .tar.gz"
  others: "или играй <a href=\"https://play.pixeldoro.io/web-beta\">в браузере</a>, или скачай для <a href=\"{windows}\">windows</a> · <a href=\"https://play.pixeldoro.io/macos\">mac</a>"
  on_computer: "скачать можно на компьютере с linux: открой эту страницу там"
  facts:
    - "бесплатно · без рекламы"
    - "нативная сборка x86_64"
    - "один аккаунт на всех устройствах"
  shot_alt: "Обставленный дом с тремя котами и двумя друзьями в гостях; у каждого видно число помодоро и что он сейчас учит"
  shot_caption: "зови друзей в гости. коты живут тут."
  cards_title: "зачем ставить приложение для linux"
  cards:
    - title: "нативная сборка"
      text: "настоящая сборка для linux, а не веб-страница в обертке. в систему ничего не ставится: все лежит в одной папке."
    - title: "встроенное лофи-радио"
      text: "шесть станций с лофи и спокойной музыкой, так что не нужна еще одна вкладка с музыкой. пока ты в фокусе, накатывают дождь и туман."
    - title: "реальные люди, прямо сейчас"
      text: "каждый персонаж в комнате — реальный человек в сессии фокуса, с таймером и задачей над головой."
    - title: "прогресс везде с тобой"
      text: "войди через email, и твоя комната, монеты и статистика будут с тобой на телефоне, на ноутбуке и в браузере."
  steps_title: "как установить pixeldoro на linux"
  steps:
    - title: "скачай"
      text: "нажми кнопку загрузки, чтобы скачать pixeldoro в виде файла .tar.gz."
    - title: "распакуй"
      text: "распакуй куда угодно, в файловом менеджере или командой <code>tar -xzf pixeldoro-*.tar.gz</code>. получится папка <code>pixeldoro</code>."
    - title: "запусти"
      text: "открой папку и запусти <code>pixeldoro.x86_64</code>: двойным кликом или командой <code>./pixeldoro.x86_64</code> в терминале. войди через email, если играешь и на других устройствах."
  prose_title: "приложение или браузер?"
  prose:
    - "pixeldoro работает и в любом браузере, ничего не нужно устанавливать. приложение для linux — для тех, кто фокусируется за компьютером каждый день: у него свое окно, его не закроешь вместе с другими вкладками, а еще браузеры притормаживают вкладки, на которые ты не смотришь."
    - "техника помодоро для тебя в новинку? почитай <a href=\"{pomodoro-timer}\">гайд по помодоро таймеру</a> или узнай, как <a href=\"{study-with-me}\">учеба рядом с другими людьми</a> помогает начать."
  faq:
    - q: "pixeldoro на linux бесплатный?"
      a: "да. таймер, мир, другие игроки, друзья и радио — все бесплатно, без рекламы и без подписки. необязательный набор поддержки с разовой оплатой дает бонусные монеты и премиум-предметы."
    - q: "на каких дистрибутивах он работает?"
      a: "на 64-битном десктопном linux на x86_64 с графикой opengl 3.2 или vulkan. pixeldoro сделан на unity, а unity официально поддерживает ubuntu 20.04 и 22.04. если на твоем дистрибутиве он не запускается, напиши на <a href=\"mailto:hello@pixeldoro.io\">hello@pixeldoro.io</a>."
    - q: "есть ли flatpak, snap или appimage?"
      a: "пока нет. это обычная сборка в .tar.gz: распакуй и запусти."
    - q: "работает ли он на arm?"
      a: "нет, сборка для linux только под x86_64. на arm-устройстве играй <a href=\"https://play.pixeldoro.io/web-beta\">в браузере</a>."
    - q: "как обновить pixeldoro?"
      a: "скачай свежую сборку с этой страницы и замени ей старую папку."
    - q: "можно ли зайти в тот же аккаунт с телефона?"
      a: "да. войди с тем же email на iphone, android, mac или в браузере, и твой прогресс, комната и монеты будут с тобой."
    - q: "есть версия для windows или mac?"
      a: "да. есть <a href=\"{windows}\">приложение для windows</a>, а версия для mac есть в <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>."
  more: "еще: <a href=\"{windows}\">pixeldoro для windows</a> · <a href=\"{pomodoro-timer}\">помодоро таймер</a> · <a href=\"{study-with-me}\">учись со мной</a> · <a href=\"{home}\">главная pixeldoro</a>"
