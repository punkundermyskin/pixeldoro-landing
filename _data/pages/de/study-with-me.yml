# Die study-with-me-Seite, Deutsch. Spiegelt die Schlüssel unter "text" aus en/study-with-me.yml.
text:
  title: "Study with me online, live mit echten Menschen | Pixeldoro"
  description: "Virtueller Lernraum, live: Lerne neben echten Menschen, die sich gerade konzentrieren. Body Doubling ohne Kamera und Mikro, mit Pomodoro Timer und Lofi-Radio."
  crumb: "study with me"
  eyebrow: "pixeldoro-ratgeber"
  h1: "study with me, live, mit echten menschen"
  lead: "pixeldoro ist ein kostenloser virtueller lernraum in form einer gemütlichen pixel-stadt. mach es auf, und du lernst neben echten menschen, die sich genau jetzt fokussieren, jeder mit timer und aufgabe über dem kopf. keine kamera, kein mikro, kein termin."
  facts:
    - "kostenlos · ohne werbung"
    - "ohne kamera und mikro"
    - "iphone · mac · android · windows · linux · browser · discord"
  shot_alt: "Ein Pomodoro läuft nachts im Regen, neben einer Gruppe von Nutzern, die unter warmen Lampen lernen, jeweils mit ihrem Timer und ihrer Aufgabe"
  shot_caption: "alle hier lernen gerade. regen an, lofi an."
  cards_title: "ein lernraum, der nie zumacht"
  cards:
    - title: "echte menschen, genau jetzt"
      text: "jede figur, die du siehst, ist ein echter mensch in einer fokus-session. du siehst den timer, die pomodoro-zahl und woran die person gerade sitzt."
    - title: "keine kamera, kein call"
      text: "niemand schaut dir durch die webcam zu. es ist die ruhige gesellschaft einer bibliothek, ohne dass du deinen schreibtisch verlässt."
    - title: "mit freunden lernen"
      text: "füg freunde hinzu, sieh, wer online ist und woran sie arbeiten, und besucht euch gegenseitig zu hause, um seite an seite zu lernen."
    - title: "ein raum für jede stimmung"
      text: "das land, das zentrum, eine bar, der shop und das hq, jeder ort mit seinen eigenen leuten. wechsle den server, um andere zu finden."
  steps_title: "so lernst du in pixeldoro mit anderen"
  steps:
    - title: "such dir einen raum aus"
      text: "mach pixeldoro im browser oder in der app auf und geh in einen beliebigen raum. überall sind leute im fokus."
    - title: "zeig, woran du arbeitest"
      text: "gib deiner session einen tag (prüfungen, coding, lesen) und starte einen pomodoro. alle in der nähe sehen ihn, und du siehst ihre."
    - title: "fokussier dich mit allen"
      text: "wenn der timer klingelt, macht ihr zusammen pause: lauf herum, schau bei freunden vorbei, gib die verdienten münzen aus."
  prose_title: "warum lernen mit anderen funktioniert"
  prose:
    - "study-with-me-videos sind aus einem einfachen grund so beliebt: es fällt leichter, anzufangen und dranzubleiben, wenn jemand anderes auch arbeitet. deshalb hilft auch die bibliothek oder das café. psychologen nennen das soziale erleichterung, viele menschen mit adhs sagen <a href=\"{adhd-focus-app}\">body doubling</a>."
    - "ein video läuft nur in eine richtung und ist vorher aufgenommen. in pixeldoro fokussieren sich die leute um dich herum genau jetzt, und sie sehen dich auch. dieses kleine bisschen verbindlichkeit reicht oft schon, um mit dem scrollen aufzuhören und den nächsten <a href=\"{pomodoro-timer}\">pomodoro</a> zu starten."
  faq:
    - q: "was ist study with me?"
      a: "ein study with me ist ein video oder stream, in dem jemand lernt, damit du mitlernen kannst. pixeldoro macht das live und in beide richtungen: die leute um dich herum lernen genau jetzt, und sie sehen dich auch."
    - q: "brauche ich eine kamera oder ein mikrofon?"
      a: "nein. du bist eine pixel-figur mit timer und aufgabe über dem kopf. niemand sieht oder hört dich."
    - q: "kann ich mit freunden zusammen lernen?"
      a: "ja. füg freunde hinzu, sieh, wo sie sind und worauf sie sich fokussieren, und besucht euch gegenseitig zu hause, um zusammen zu lernen. über lobbys kannst du auch den server wechseln."
    - q: "ist immer jemand online?"
      a: "leute aus der ganzen welt fokussieren sich rund um die uhr in pixeldoro, die räume sind also selten leer."
    - q: "ist pixeldoro kostenlos?"
      a: "ja. timer, welt, andere spieler, freunde und radio sind komplett kostenlos, ohne werbung und ohne abo. ein optionales supporter-paket als einmalkauf bringt extra-münzen und premium-items."
  more: "mehr ratgeber: <a href=\"{pomodoro-timer}\">pomodoro-timer</a> · <a href=\"{adhd-focus-app}\">adhs-fokus-app</a> · <a href=\"{home}\">pixeldoro-startseite</a>"
