# Página study-with-me, español de Latinoamérica. Refleja las claves "text" de en/study-with-me.yml.
text:
  title: "Estudia conmigo en vivo con personas reales | Pixeldoro"
  description: "Una sala de estudio virtual en vivo: estudia junto a personas reales que se concentran ahora. Body doubling sin cámara ni micro, con pomodoro y radio lofi."
  crumb: "estudia conmigo"
  eyebrow: "guía de pixeldoro"
  h1: "estudia conmigo, en vivo, con personas reales"
  lead: "pixeldoro es una sala de estudio virtual gratis con forma de ciudad acogedora en pixel art. lo abres y ya estás estudiando junto a personas reales que se están concentrando ahora mismo, cada una con su temporizador y lo que está haciendo sobre la cabeza. sin cámara, sin micrófono, sin horarios."
  facts:
    - "gratis · sin anuncios"
    - "sin cámara ni micrófono"
    - "iphone · mac · android · windows · linux · navegador · discord"
  shot_alt: "Un pomodoro en marcha de noche bajo la lluvia, junto a un grupo de usuarios que estudian bajo lámparas cálidas, cada uno con su temporizador y su tarea"
  shot_caption: "todos aquí están estudiando ahora mismo. lluvia de fondo, lofi sonando."
  cards_title: "una sala de estudio que nunca cierra"
  cards:
    - title: "personas reales, ahora mismo"
      text: "cada personaje que ves es una persona real en una sesión de enfoque. ves su temporizador, cuántos pomodoros lleva y en qué anda."
    - title: "sin cámara, sin llamada"
      text: "nadie te mira por una webcam. es la compañía silenciosa de una biblioteca, sin pararte de tu escritorio."
    - title: "estudia con amigos"
      text: "agrega amigos, mira quién está en línea y en qué está trabajando, y visítense en sus casas para concentrarse lado a lado."
    - title: "una sala para cada mood"
      text: "el campo, el centro, un bar, la tienda y la sede, cada uno con su propia gente. cambia de servidor para encontrar a otra gente."
  steps_title: "cómo estudiar con otras personas en pixeldoro"
  steps:
    - title: "elige una sala"
      text: "abre pixeldoro en tu navegador o en la app y entra a cualquier sala. en todas hay gente concentrada."
    - title: "di en qué estás trabajando"
      text: "etiqueta tu sesión (exámenes, programación, lectura) y empieza un pomodoro. todos los que están cerca la ven, y tú ves las suyas."
    - title: "concéntrate con todos"
      text: "cuando suena el temporizador, todos toman el descanso juntos: date una vuelta, mira cómo van tus amigos, gasta las monedas que ganaste."
  prose_title: "por qué funciona estudiar con otras personas"
  prose:
    - "los videos de “estudia conmigo” se volvieron populares por una razón simple: es más fácil empezar y seguir cuando alguien más también está trabajando. es la misma razón por la que ayuda una biblioteca o una cafetería. los psicólogos lo llaman facilitación social; mucha gente con tdah lo llama <a href=\"{adhd-focus-app}\">body doubling</a>."
    - "un video va en un solo sentido y está pregrabado. en pixeldoro, la gente a tu alrededor se está concentrando ahora mismo, y también te puede ver. ese poquito de compromiso muchas veces basta para dejar de scrollear y empezar el siguiente <a href=\"{pomodoro-timer}\">pomodoro</a>."
  faq:
    - q: "¿qué es un study with me?"
      a: "un study with me (o “estudia conmigo”) es un video o transmisión de alguien estudiando, para que estudies junto con esa persona. pixeldoro lo hace en vivo y en ambos sentidos: la gente a tu alrededor está estudiando ahora mismo, y también te ve a ti."
    - q: "¿necesito cámara o micrófono?"
      a: "no. eres un personaje en pixel art con un temporizador y una tarea sobre la cabeza. nadie te ve ni te escucha."
    - q: "¿puedo estudiar con mis amigos?"
      a: "sí. agrega amigos, mira dónde están y en qué se están enfocando, y visítense en sus casas para estudiar juntos. con los lobbies también puedes cambiar de servidor."
    - q: "¿siempre hay alguien en línea?"
      a: "gente de todo el mundo se concentra en pixeldoro a toda hora, así que las salas casi nunca están vacías."
    - q: "¿es gratis?"
      a: "sí. el temporizador, el mundo, los demás jugadores, los amigos y la radio son gratis, sin anuncios y sin suscripción. un paquete de patrocinador opcional de pago único agrega monedas extra y objetos premium."
  more: "más guías: <a href=\"{pomodoro-timer}\">temporizador pomodoro</a> · <a href=\"{adhd-focus-app}\">app de enfoque para tdah</a> · <a href=\"{home}\">inicio de pixeldoro</a>"
