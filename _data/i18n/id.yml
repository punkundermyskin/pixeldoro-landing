faq:
  title: "pertanyaan yang sering diajukan"
  items:
    - q: "apa itu pixeldoro?"
      a: "pixeldoro adalah timer pomodoro gratis di dalam dunia pixel art yang cozy. kamu pilih tempat, mulai sesi fokus, lalu kerja di samping orang sungguhan yang melakukan hal yang sama. tiap sesi memberimu koin untuk kamarmu, memajukan cerita, dan menambah statistikmu. ada radio lofi bawaan, dan bisa dipakai di iphone, ipad, mac, android, windows, linux, browser, dan discord."
    - q: "apakah pixeldoro gratis?"
      a: "iya. timer, dunianya, pemain lain, teman, misi, hewan peliharaan, dan radio semuanya gratis, tanpa iklan dan tanpa langganan. ada paket supporter opsional yang cukup dibeli sekali: koin 25% lebih banyak tiap sesi, lencana profil, skin premium, perabot, latar, dan ruangan, plus misi bonus."
    - q: "ini game atau aplikasi produktivitas?"
      a: "dua-duanya, tapi timer tetap nomor satu. game-nya cuma jalan saat kamu fokus: menyelesaikan pomodoro memberimu koin, menuntaskan misi, dan membuka tempat baru. di sela sesi ada cukup hal untuk dilakukan supaya terasa memuaskan, tanpa bikin kamu lupa sama tugasmu."
    - q: "apakah pemain lainnya orang sungguhan?"
      a: "iya. setiap karakter yang berjalan-jalan atau duduk di meja adalah pemain sungguhan yang sedang fokus saat ini. kamu bisa lihat timer mereka, berapa pomodoro yang sudah mereka selesaikan, dan apa yang sedang mereka kerjakan."
    - q: "apa itu body doubling?"
      a: "body doubling artinya bekerja di samping orang lain supaya lebih gampang untuk mulai dan terus jalan. itulah kenapa belajar di perpustakaan atau kafe terasa ampuh. pixeldoro memberimu rasa itu tanpa kamera atau jadwal: buka kapan saja, dan selalu ada orang yang lagi fokus di sekitarmu."
    - q: "bisa belajar bareng teman?"
      a: "bisa. tambah teman, lihat siapa yang online dan apa yang sedang mereka kerjakan, lalu saling main ke rumah untuk fokus berdampingan. lewat lobi, kamu bisa ganti server dan menemukan keramaian yang lain."
    - q: "apakah cocok untuk adhd?"
      a: "pixeldoro dibuat untuk otak yang gampang cuek sama timer biasa. kamu dapat hadiah cukup dengan muncul, orang lain yang fokus di sekitarmu membantumu mulai, dan ceritanya memberimu alasan untuk kembali. ini bukan alat medis, cuma cara yang lebih cozy untuk mulai bergerak."
    - q: "ada to-do list atau pemblokir aplikasi?"
      a: "belum. tag fokus bisa dipakai untuk memberi label tiap sesi (ujian, coding, membaca), dan statistikmu membagi waktumu per tag. dua-duanya sudah masuk daftar rencana."
    - q: "bisa dimainkan di mana, dan apakah progresku tersinkron?"
      a: "iphone, ipad, dan mac di app store, android di google play, windows dan linux di pixeldoro.io, browser apa pun di play.pixeldoro.io, dan sebagai aktivitas di dalam discord. masuk dengan emailmu, dan progres, kamar, serta koinmu akan ikut ke semua perangkat. tersedia dalam 9 bahasa."

outro:
  title: "siap mulai fokus?"
  lead: "gratis di semua perangkat. orang-orang lagi fokus sekarang juga."

