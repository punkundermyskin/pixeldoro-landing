# Halaman linux, bahasa Indonesia. Key mengikuti text di en/linux.yml.
text:
  title: "Timer pomodoro untuk Linux, gratis dan cozy | Pixeldoro"
  description: "Pixeldoro untuk Linux: timer pomodoro gratis di dunia pixel yang cozy, tempat kamu belajar bareng orang sungguhan. Build native x86_64, radio lofi, statistik."
  crumb: "linux"
  eyebrow: "pixeldoro untuk linux"
  h1: "timer pomodoro cozy yang jalan di linux"
  lead: "pixeldoro adalah timer pomodoro gratis di dalam dunia pixel art, tempat kamu fokus di samping orang sungguhan yang lagi belajar saat ini. versi linux-nya adalah build native: ekstrak, jalankan, dan timer serta radio lofi tetap jalan di jendelanya sendiri."
  button: "download untuk linux"
  note: "gratis · 64-bit x86_64 · .tar.gz"
  others: "atau main <a href=\"https://play.pixeldoro.io/web-beta\">di browser</a>, atau download untuk <a href=\"{windows}\">windows</a> · <a href=\"https://play.pixeldoro.io/macos\">mac</a>"
  on_computer: "pakai komputer linux? buka halaman ini di sana untuk download"
  facts:
    - "gratis · tanpa iklan"
    - "build native x86_64"
    - "satu akun di semua perangkat"
  shot_alt: "Rumah yang sudah dihias dengan tiga kucing peliharaan dan dua teman yang sedang berkunjung, masing-masing menampilkan jumlah pomodoro dan apa yang sedang mereka pelajari"
  shot_caption: "ajak teman main ke rumah. kucing-kucingnya tinggal di sini."
  cards_title: "kenapa pakai aplikasi linux"
  cards:
    - title: "build native"
      text: "build linux beneran, bukan halaman web yang dibungkus. tidak ada yang di-install ke seluruh sistem: semuanya ada di satu folder."
    - title: "radio lofi bawaan"
      text: "enam stasiun lofi + chill, jadi tidak perlu tab lain buat putar musik. hujan dan kabut datang saat kamu fokus."
    - title: "orang sungguhan, saat ini juga"
      text: "setiap karakter di ruangan adalah orang sungguhan yang sedang dalam sesi fokus, dengan timer dan tugasnya di atas kepala."
    - title: "progresmu ikut ke mana-mana"
      text: "masuk dengan emailmu, dan kamar, koin, serta statistikmu ikut ke hp-mu, laptopmu, dan browser."
  steps_title: "cara install pixeldoro di linux"
  steps:
    - title: "download"
      text: "klik tombol download untuk mendapatkan pixeldoro dalam bentuk file .tar.gz."
    - title: "ekstrak"
      text: "ekstrak di mana saja, lewat file manager atau dengan <code>tar -xzf pixeldoro-*.tar.gz</code>. kamu akan dapat folder <code>pixeldoro</code>."
    - title: "jalankan"
      text: "buka folder-nya dan jalankan <code>pixeldoro.x86_64</code>: klik dua kali, atau ketik <code>./pixeldoro.x86_64</code> di terminal. masuk dengan emailmu kalau kamu juga main di perangkat lain."
  prose_title: "aplikasi atau browser?"
  prose:
    - "pixeldoro juga bisa jalan di browser apa pun, tanpa perlu install. aplikasi linux cocok kalau kamu fokus di depan komputer setiap hari: punya jendela sendiri, tidak ikut tertutup bareng tab-tab lain, dan browser suka memperlambat tab yang sedang tidak kamu lihat."
    - "baru kenal tekniknya? baca <a href=\"{pomodoro-timer}\">panduan timer pomodoro</a>, atau lihat bagaimana <a href=\"{study-with-me}\">belajar bareng orang lain</a> membantumu mulai."
  faq:
    - q: "apakah pixeldoro gratis di linux?"
      a: "iya. timer, dunianya, pemain lain, teman, dan radio semuanya gratis, tanpa iklan dan tanpa langganan. ada paket supporter opsional yang cukup dibeli sekali untuk bonus koin dan item premium."
    - q: "pixeldoro bisa jalan di distro apa saja?"
      a: "linux desktop 64-bit x86_64 dengan grafis opengl 3.2 atau vulkan. pixeldoro dibuat dengan unity, yang secara resmi mendukung ubuntu 20.04 dan 22.04. kalau tidak mau jalan di distro-mu, kirim email ke <a href=\"mailto:hello@pixeldoro.io\">hello@pixeldoro.io</a>."
    - q: "ada versi flatpak, snap, atau appimage?"
      a: "belum. ini build .tar.gz biasa: ekstrak, lalu jalankan."
    - q: "bisa jalan di arm?"
      a: "tidak, build linux hanya untuk x86_64. di perangkat arm, main <a href=\"https://play.pixeldoro.io/web-beta\">di browser</a> saja."
    - q: "cara update pixeldoro gimana?"
      a: "download build terbaru dari halaman ini, lalu ganti folder yang lama."
    - q: "bisa pakai akun yang sama di hp?"
      a: "bisa. masuk dengan email yang sama di iphone, android, mac, atau browser, dan progres, kamar, serta koinmu akan ikut."
    - q: "ada versi windows atau mac?"
      a: "ada. ada <a href=\"{windows}\">aplikasi windows</a>, dan versi mac tersedia di <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>."
  more: "lainnya: <a href=\"{windows}\">pixeldoro untuk windows</a> · <a href=\"{pomodoro-timer}\">timer pomodoro</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">beranda pixeldoro</a>"
