# Página pomodoro-timer, español de Latinoamérica. Refleja las claves "text" de en/pomodoro-timer.yml.
text:
  title: "Temporizador pomodoro aesthetic, pixel art y lofi | Pixeldoro"
  description: "Temporizador pomodoro aesthetic gratis en un mundo pixel cozy: 25/5, 45/15 o a tu medida, cronómetro, lofi, etiquetas y estadísticas. En cualquier dispositivo."
  crumb: "temporizador pomodoro"
  eyebrow: "guía de pixeldoro"
  h1: "un temporizador pomodoro aesthetic en un mundo de pixel art"
  lead: "pixeldoro es un temporizador pomodoro gratis dentro de una ciudad acogedora en pixel art. elige un ajuste o arma el tuyo, pon la radio lofi y mira la lluvia mientras trabajas. cada pomodoro te da monedas, y tus horas se suman en estadísticas divididas por lo que hiciste."
  facts:
    - "gratis · sin anuncios"
    - "sin suscripción"
    - "iphone · mac · android · windows · linux · navegador · discord"
  shot_alt: "Pantalla del temporizador de enfoque: ajustes de 25/5, 45/15, 15/3, cronómetro y personalizado, un temporizador en 25:00 y etiquetas de enfoque de colores como exámenes de matemáticas, inglés y física"
  shot_caption: "elige en qué vas a trabajar y empieza un pomodoro."
  cards_title: "todo lo que necesita un temporizador pomodoro"
  cards:
    - title: "predefinidos o a tu medida"
      text: "25/5, 45/15, 15/3 o la duración que quieras. un cronómetro de hasta 8 horas para sesiones largas de trabajo profundo."
    - title: "radio lofi integrada"
      text: "seis estaciones de lofi y chill, sin playlists que armar. mientras te concentras, llegan la lluvia y la neblina."
    - title: "etiquetas de enfoque"
      text: "ponle nombre a cada sesión: exámenes, programación, lectura. suena una alarma de verdad cuando termina, y un aviso cuando se acaba el descanso."
    - title: "estadísticas que suman"
      text: "mira en qué se te van las horas, divididas por etiqueta, semana tras semana. cada sesión también te da monedas para tu cuarto."
  steps_title: "cómo usar el temporizador pomodoro"
  steps:
    - title: "elige una duración"
      text: "25/5 es el clásico. 45/15 va bien para bloques largos de estudio, y 15/3 sirve para calentar motores en un día lento."
    - title: "etiquétalo y empieza"
      text: "elige en qué vas a trabajar y dale a empezar. todos los que están cerca ven tu temporizador y tu tarea."
    - title: "toma el descanso"
      text: "cuando suene la alarma, párate, estírate, date una vuelta por la ciudad. pixeldoro te avisa cuando es hora de volver."
  prose_title: "¿qué es la técnica pomodoro?"
  prose:
    - "la técnica pomodoro divide el trabajo en bloques cortos de concentración con descansos entre ellos. la versión clásica son 25 minutos de enfoque y 5 de descanso, con un descanso más largo después de cuatro rondas. se llama así por un temporizador de cocina con forma de tomate, y por eso la mascota de pixeldoro es un tomate."
    - "funciona porque un bloque corto es fácil de empezar, y saber que siempre viene un descanso hace más fácil seguir. si 25 minutos se te hacen mucho, empieza con menos. si ya agarraste ritmo, usa el cronómetro y sigue de largo."
    - "¿solo quieres el temporizador? <a href=\"{mini}\">pixeldoro mini</a> es la versión minimalista: temporizador, fondos en pixel art, música lofi y estadísticas. ¿quieres compañía mientras te concentras? mira <a href=\"{study-with-me}\">estudia conmigo</a>."
  faq:
    - q: "¿cuál es la mejor duración para un pomodoro?"
      a: "25 minutos de enfoque y 5 de descanso es lo clásico. mucha gente prefiere 45/15 o 50/10 para trabajo profundo, y 15/3 en días con poca energía. prueba varios y quédate con el que te funcione."
    - q: "¿puedo poner mi propia duración?"
      a: "sí. además de los ajustes de 25/5, 45/15 y 15/3, puedes poner una duración personalizada o usar el cronómetro hasta por 8 horas."
    - q: "¿me avisa cuando termina la sesión?"
      a: "sí. pixeldoro hace sonar una alarma de verdad cuando termina tu sesión de enfoque y te avisa cuando se acaba el descanso."
    - q: "¿el temporizador pomodoro es gratis?"
      a: "sí. el temporizador, la radio, las estadísticas y todo el mundo son gratis, sin anuncios y sin suscripción."
    - q: "¿hay una versión más simple?"
      a: "pixeldoro mini es solo el temporizador: fondos en pixel art, música lofi y estadísticas, en iphone y android."
  more: "más guías: <a href=\"{study-with-me}\">estudia conmigo</a> · <a href=\"{adhd-focus-app}\">app de enfoque para tdah</a> · <a href=\"{home}\">inicio de pixeldoro</a>"
