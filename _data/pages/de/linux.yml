# Die linux-Seite, Deutsch. Spiegelt die Schlüssel unter "text" aus en/linux.yml.
text:
  title: "Pomodoro Timer für Linux, kostenlos und cozy | Pixeldoro"
  description: "Pixeldoro für Linux: kostenloser Pomodoro Timer in einer cozy Pixel-Welt, in der du neben echten Menschen lernst. Nativer x86_64-Build, Lofi-Radio, Statistik."
  crumb: "linux"
  eyebrow: "pixeldoro für linux"
  h1: "ein gemütlicher pomodoro-timer, der unter linux läuft"
  lead: "pixeldoro ist ein kostenloser pomodoro-timer in einer pixel-art-welt, in der du dich neben echten menschen fokussierst, die genau jetzt lernen. die linux-version ist ein nativer build: entpacken, starten, und timer und lofi-radio laufen in ihrem eigenen fenster."
  button: "für linux herunterladen"
  note: "kostenlos · 64-bit x86_64 · .tar.gz"
  others: "oder spiel <a href=\"https://play.pixeldoro.io/web-beta\">im browser</a>, oder hol es dir für <a href=\"{windows}\">windows</a> · <a href=\"https://play.pixeldoro.io/macos\">mac</a>"
  on_computer: "du hast einen linux-computer? mach diese seite dort auf, um es herunterzuladen"
  facts:
    - "kostenlos · ohne werbung"
    - "nativer x86_64-build"
    - "ein konto auf jedem gerät"
  shot_alt: "Ein eingerichtetes Zuhause mit drei Hauskatzen und zwei Freunden zu Besuch, jeweils mit ihrer Pomodoro-Zahl und dem, was sie gerade lernen"
  shot_caption: "lad freunde zu dir ein. die katzen wohnen hier."
  cards_title: "warum die linux-app"
  cards:
    - title: "ein nativer build"
      text: "ein echter linux-build, keine webseite in einem wrapper. nichts wird systemweit installiert: alles liegt in einem ordner."
    - title: "lofi-radio eingebaut"
      text: "sechs lofi- und chill-sender, du brauchst also keinen extra tab für musik. regen und nebel ziehen auf, während du dich fokussierst."
    - title: "echte menschen, genau jetzt"
      text: "jede figur im raum ist ein echter mensch in einer fokus-session, mit timer und aufgabe über dem kopf."
    - title: "dein fortschritt überall"
      text: "melde dich mit deiner e-mail an, und dein zimmer, deine münzen und deine statistik begleiten dich aufs handy, auf den laptop und in den browser."
  steps_title: "so installierst du pixeldoro unter linux"
  steps:
    - title: "lad es herunter"
      text: "klick auf den download-button, um pixeldoro als .tar.gz-datei zu bekommen."
    - title: "entpack es"
      text: "entpack es, wo du willst, im dateimanager oder mit <code>tar -xzf pixeldoro-*.tar.gz</code>. dann hast du einen ordner <code>pixeldoro</code>."
    - title: "starte es"
      text: "öffne den ordner und starte <code>pixeldoro.x86_64</code>: per doppelklick oder mit <code>./pixeldoro.x86_64</code> im terminal. melde dich mit deiner e-mail an, falls du auch auf anderen geräten spielst."
  prose_title: "app oder browser?"
  prose:
    - "pixeldoro läuft auch in jedem browser, ohne installation. die linux-app ist für dich, wenn du jeden tag am computer lernst oder arbeitest: sie hat ihr eigenes fenster, wird nicht mit deinen anderen tabs zugemacht, und browser bremsen tabs aus, die du gerade nicht anschaust."
    - "neu bei der technik? lies den <a href=\"{pomodoro-timer}\">ratgeber zum pomodoro-timer</a>, oder schau, wie dir <a href=\"{study-with-me}\">lernen neben anderen</a> beim anfangen hilft."
  faq:
    - q: "ist pixeldoro für linux kostenlos?"
      a: "ja. timer, welt, andere spieler, freunde und radio sind komplett kostenlos, ohne werbung und ohne abo. ein optionales supporter-paket als einmalkauf bringt extra-münzen und premium-items."
    - q: "auf welchen distros läuft pixeldoro?"
      a: "auf 64-bit-desktop-linux (x86_64) mit opengl-3.2- oder vulkan-grafik. pixeldoro ist mit unity gebaut, das offiziell ubuntu 20.04 und 22.04 unterstützt. wenn es auf deiner distro nicht startet, schreib an <a href=\"mailto:hello@pixeldoro.io\">hello@pixeldoro.io</a>."
    - q: "gibt es pixeldoro als flatpak, snap oder appimage?"
      a: "noch nicht. es ist ein einfacher .tar.gz-build: entpacken und starten."
    - q: "läuft pixeldoro auf arm?"
      a: "nein, den linux-build gibt es nur für x86_64. auf einem arm-gerät spielst du stattdessen <a href=\"https://play.pixeldoro.io/web-beta\">im browser</a>."
    - q: "wie aktualisiere ich pixeldoro?"
      a: "lad den neuesten build von dieser seite herunter und ersetz den alten ordner."
    - q: "kann ich dasselbe konto auf dem handy nutzen?"
      a: "ja. melde dich mit derselben e-mail auf iphone, android, mac oder im browser an, und dein fortschritt, dein zimmer und deine münzen kommen mit."
    - q: "gibt es eine version für windows oder mac?"
      a: "ja. es gibt eine <a href=\"{windows}\">windows-app</a>, und für mac gibt es pixeldoro im <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>."
  more: "mehr: <a href=\"{windows}\">pixeldoro für windows</a> · <a href=\"{pomodoro-timer}\">pomodoro-timer</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">pixeldoro-startseite</a>"
