# La page windows, en français. Mêmes clés que le "text" de en/windows.yml.
text:
  title: "Minuteur pomodoro gratuit pour PC Windows | Pixeldoro"
  description: "Télécharge Pixeldoro pour Windows 10 et 11: minuteur pomodoro gratuit dans un monde pixel cosy où tu étudies avec de vrais gens. Radio lofi, stats, sans pub."
  crumb: "windows"
  eyebrow: "pixeldoro pour windows"
  h1: "un minuteur pomodoro cosy pour ton pc windows"
  lead: "pixeldoro est un minuteur pomodoro gratuit dans un monde en pixel art, où tu te concentres à côté de vraies personnes qui étudient en ce moment même. sur windows, il a sa propre fenêtre, donc le minuteur et la radio lofi continuent pendant que tu bosses dans d'autres applis."
  button: "télécharger pour windows"
  note: "gratuit · windows 10 et 11 · 64 bits"
  others: "ou joue <a href=\"https://play.pixeldoro.io/web-beta\">dans ton navigateur</a>, ou installe-le sur <a href=\"https://play.pixeldoro.io/macos\">mac</a> · <a href=\"{linux}\">linux</a>"
  on_computer: "sur un ordi windows? ouvre cette page dessus pour le télécharger"
  facts:
    - "gratuit · sans pub"
    - "windows 10 + 11"
    - "un seul compte sur tous tes appareils"
  shot_alt: "Liste d'amis de l'espace communauté: l'avatar de chaque ami, ce sur quoi il se concentre, la salle où il se trouve et son nombre de pomodoros, à côté d'un café plein de gens qui étudient"
  shot_caption: "vois sur quoi tes amis se concentrent, et où."
  cards_title: "pourquoi prendre l'appli windows"
  cards:
    - title: "tourne en arrière-plan"
      text: "réduis-la ou passe à ton travail. le minuteur et la radio continuent, et l'appli n'est qu'à un alt+tab."
    - title: "radio lofi intégrée"
      text: "six stations lofi + chill, donc pas besoin d'un autre onglet pour la musique. la pluie et le brouillard s'installent pendant que tu te concentres."
    - title: "de vraies personnes, en ce moment"
      text: "chaque personnage de la salle est une vraie personne en pleine session de focus, avec son minuteur et sa tâche au-dessus de la tête."
    - title: "ta progression partout"
      text: "connecte-toi avec ton email, et ta chambre, tes pièces et tes stats te suivent sur ton téléphone, ton mac et dans le navigateur."
  steps_title: "comment installer pixeldoro sur windows"
  steps:
    - title: "télécharge l'installateur"
      text: "clique sur le bouton de téléchargement pour récupérer le fichier d'installation de pixeldoro."
    - title: "lance-le"
      text: "ouvre le fichier et suis l'installateur. si windows affiche « Windows a protégé votre ordinateur », clique sur <b>informations complémentaires</b>, puis sur <b>exécuter quand même</b>."
    - title: "connecte-toi et concentre-toi"
      text: "ouvre pixeldoro, connecte-toi avec ton email si tu joues aussi sur d'autres appareils, choisis une salle et lance un pomodoro."
  prose_title: "l'appli ou le navigateur?"
  prose:
    - "pixeldoro tourne aussi dans n'importe quel navigateur, rien à installer. l'appli windows, c'est pour quand tu te concentres sur ton pc tous les jours: elle a sa propre fenêtre et son icône dans la barre des tâches, elle ne se ferme pas avec tes autres onglets, et les navigateurs ralentissent les onglets que tu ne regardes pas."
    - "tu découvres la technique? lis le <a href=\"{pomodoro-timer}\">guide du minuteur pomodoro</a>, ou vois comment <a href=\"{study-with-me}\">étudier à côté d'autres personnes</a> t'aide à te lancer."
  faq:
    - q: "pixeldoro est gratuit sur windows?"
      a: "oui. le minuteur, le monde, les autres joueurs, les amis et la radio sont gratuits, sans pub et sans abonnement. un pack de soutien optionnel, en achat unique, ajoute des pièces bonus et des objets premium."
    - q: "pixeldoro marche sur quelles versions de windows?"
      a: "windows 10 et windows 11 en 64 bits."
    - q: "pourquoi windows dit qu'il a protégé mon ordinateur?"
      a: "c'est smartscreen. il s'affiche pour les applis de petits développeurs qui n'ont pas de certificat de signature de code payant. clique sur <b>informations complémentaires</b>, puis sur <b>exécuter quand même</b>."
    - q: "le minuteur continue quand je réduis la fenêtre?"
      a: "oui. le minuteur et la radio continuent pendant que la fenêtre est réduite ou derrière d'autres applis."
    - q: "comment mettre à jour pixeldoro?"
      a: "télécharge le dernier installateur depuis cette page et lance-le."
    - q: "je peux utiliser le même compte sur mon téléphone?"
      a: "oui. connecte-toi avec le même email sur iphone, android, mac ou dans le navigateur, et ta progression, ta chambre et tes pièces te suivent."
    - q: "il y a une version mac ou linux?"
      a: "oui. la version mac est sur le <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>, et il y a aussi une <a href=\"{linux}\">version linux</a>."
  more: "à voir aussi: <a href=\"{linux}\">pixeldoro pour linux</a> · <a href=\"{pomodoro-timer}\">minuteur pomodoro</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">accueil pixeldoro</a>"
