# La pagina study-with-me, italiano. Rispecchia le chiavi "text" di en/study-with-me.yml.
text:
  title: "Study with me: studia online con persone vere | Pixeldoro"
  description: "Aula studio virtuale dal vivo: studia accanto a persone vere che si concentrano adesso. Body doubling senza webcam né microfono, timer pomodoro e radio lofi."
  crumb: "study with me"
  eyebrow: "guida pixeldoro"
  h1: "study with me, dal vivo, con persone vere"
  lead: "pixeldoro è un'aula studio virtuale gratuita, a forma di cittadina cozy in pixel art. la apri e stai già studiando accanto a persone vere che si stanno concentrando proprio ora, ognuna con il suo timer e quello su cui sta lavorando sopra la testa. niente webcam, niente microfono, niente orari."
  facts:
    - "gratis · senza pubblicità"
    - "niente webcam né microfono"
    - "iphone · mac · android · windows · linux · browser · discord"
  shot_alt: "Un pomodoro in corso di notte sotto la pioggia, accanto a un gruppo di utenti che studiano sotto lampade calde, ognuno con il proprio timer e l'attività"
  shot_caption: "qui stanno studiando tutti, proprio ora. pioggia e lofi in sottofondo."
  cards_title: "un'aula studio che non chiude mai"
  cards:
    - title: "persone vere, proprio ora"
      text: "ogni personaggio che vedi è una persona vera in una sessione di focus. vedi il suo timer, quanti pomodori ha fatto e su cosa sta lavorando."
    - title: "niente webcam, niente call"
      text: "nessuno ti guarda da una webcam. è la compagnia silenziosa di una biblioteca, senza alzarti dalla scrivania."
    - title: "studia con gli amici"
      text: "aggiungi amici, guarda chi è online e su cosa sta lavorando, e venitevi a trovare a casa per concentrarvi fianco a fianco."
    - title: "una stanza per ogni mood"
      text: "la campagna, il centro, il bar, il negozio e il qg, ognuno con la sua gente. cambia server per trovare gente diversa."
  steps_title: "come studiare con gli altri su pixeldoro"
  steps:
    - title: "scegli una stanza"
      text: "apri pixeldoro nel browser o nell'app ed entra in una stanza qualsiasi. in ognuna c'è gente che si sta concentrando."
    - title: "di' su cosa lavori"
      text: "dai un tag alla sessione (esami, coding, lettura) e avvia un pomodoro. chi ti sta vicino lo vede, e tu vedi il loro."
    - title: "concentrati insieme agli altri"
      text: "quando suona il timer, fate la pausa insieme: fai un giro, passa a vedere come stanno gli amici, spendi le monete che hai guadagnato."
  prose_title: "perché studiare con altre persone funziona"
  prose:
    - "i video study with me sono esplosi per un motivo semplice: è più facile iniziare e andare avanti quando c'è qualcun altro che lavora. è lo stesso motivo per cui la biblioteca o il bar aiutano. gli psicologi la chiamano facilitazione sociale; chi ha l'adhd spesso lo chiama <a href=\"{adhd-focus-app}\">body doubling</a>."
    - "un video va in una sola direzione ed è registrato. su pixeldoro le persone intorno a te si stanno concentrando adesso, e vedono anche te. quel pizzico di responsabilità spesso basta per smettere di scrollare e iniziare il prossimo <a href=\"{pomodoro-timer}\">pomodoro</a>."
  faq:
    - q: "cos'è uno study with me?"
      a: "uno study with me è un video o una diretta di qualcuno che studia, così puoi studiare insieme a lui. pixeldoro lo rende dal vivo e a doppio senso: le persone intorno a te stanno studiando adesso, e vedono anche te."
    - q: "serve una webcam o un microfono?"
      a: "no. sei un personaggio in pixel art con un timer e un'attività sopra la testa. nessuno ti vede né ti sente."
    - q: "posso studiare con i miei amici?"
      a: "sì. aggiungi amici, guarda dove sono e su cosa si stanno concentrando, e venitevi a trovare a casa per studiare insieme. con le lobby puoi anche cambiare server."
    - q: "c'è sempre qualcuno online?"
      a: "su pixeldoro si concentrano persone da tutto il mondo, giorno e notte, quindi le stanze non sono quasi mai vuote."
    - q: "è gratis?"
      a: "sì. il timer, il mondo, gli altri giocatori, gli amici e la radio sono tutti gratis, senza pubblicità e senza abbonamento. un pacchetto supporter facoltativo, a pagamento unico, aggiunge monete bonus e oggetti premium."
  more: "altre guide: <a href=\"{pomodoro-timer}\">timer pomodoro</a> · <a href=\"{adhd-focus-app}\">app per l'adhd</a> · <a href=\"{home}\">home di pixeldoro</a>"
