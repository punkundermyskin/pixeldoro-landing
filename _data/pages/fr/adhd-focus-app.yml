# La page adhd-focus-app, en français. Mêmes clés que le "text" de en/adhd-focus-app.yml.
text:
  title: "Application de concentration TDAH: body doubling | Pixeldoro"
  description: "Appli de concentration gratuite pour le TDAH: body doubling avec de vraies personnes, des pièces à chaque session, des minuteurs courts. Sans caméra, sans pub."
  crumb: "appli de concentration tdah"
  eyebrow: "guide pixeldoro"
  h1: "une appli de concentration pour les cerveaux tdah"
  lead: "un minuteur classique, c'est facile à ignorer. pixeldoro transforme la concentration en un jeu à partager avec d'autres: les vraies personnes qui se concentrent autour de toi t'aident à te lancer, chaque session rapporte tout de suite, et une histoire te donne une raison de revenir demain."
  facts:
    - "gratuit · sans pub"
    - "sans abonnement"
    - "iphone · mac · android · windows · linux · navigateur · discord"
  shot_alt: "Écran de récompense après une session de focus terminée: ton focus a rapporté du butin, 30 pièces, récupérer"
  shot_caption: "chaque pomodoro rapporte, tout de suite."
  cards_title: "pensé pour les cerveaux qui décrochent devant un minuteur"
  cards:
    - title: "body doubling intégré"
      text: "les vraies personnes qui se concentrent autour de toi t'aident à démarrer. pas de caméra, pas d'appel, pas de session à réserver."
    - title: "une récompense tout de suite"
      text: "chaque pomodoro rapporte des pièces. dépense-les en meubles, salles, tenues et animaux."
    - title: "les sessions courtes comptent"
      text: "un préréglage 15/3 pour les jours où 25 minutes, c'est trop, et un chrono pour quand l'hyperfocus débarque."
    - title: "une raison de revenir"
      text: "quêtes d'histoire, du jour et de la semaine, un défi communautaire chaque semaine et des stats qui s'empilent."
  steps_title: "comment s'y mettre quand le plus dur, c'est de commencer"
  steps:
    - title: "ouvre-le, c'est tout"
      text: "pas besoin de plan. ouvre pixeldoro et installe-toi dans une salle où des gens bossent déjà."
    - title: "choisis un seul petit truc"
      text: "tague-le et lance une session courte. 15 minutes, c'est aussi un vrai pomodoro."
    - title: "ramasse tes pièces"
      text: "récupère ta récompense, fais ta pause, et vois si t'as envie d'un tour de plus."
  prose_title: "c'est quoi, le body doubling?"
  prose:
    - "le body doubling, c'est travailler pendant que quelqu'un d'autre est là. beaucoup de personnes avec un tdah trouvent qu'il est bien plus facile de commencer et de rester concentrées quand une autre personne est présente, même si elle est occupée par son propre travail."
    - "pixeldoro te donne ça dès que t'en as besoin. les gens dans chaque salle sont bien réels et se concentrent en ce moment, avec leur minuteur et leur tâche affichés. t'as la compagnie sans caméra, sans horaire et sans inconnu qui te regarde. plus de détails dans <a href=\"{study-with-me}\">study with me</a>."
    - "pixeldoro n'est ni un outil médical ni un traitement du tdah. c'est une façon plus cosy de t'y mettre."
  quotes_title: "extraits des avis"
  faq:
    - q: "pixeldoro, c'est bien pour le tdah?"
      a: "c'est pensé pour les cerveaux qui décrochent devant un minuteur classique. le simple fait de venir est récompensé, les autres qui se concentrent autour de toi t'aident à te lancer, et l'histoire te donne une raison de revenir. ce n'est pas un outil médical, juste une façon plus cosy de t'y mettre."
    - q: "c'est quoi, le body doubling?"
      a: "travailler à côté de quelqu'un pour avoir plus de facilité à commencer et à continuer. dans pixeldoro, les gens autour de toi sont réels et se concentrent en ce moment, sans caméra ni appel."
    - q: "et si je n'arrive pas à me concentrer 25 minutes?"
      a: "utilise le préréglage 15/3 ou choisis ta propre durée. une session courte rapporte quand même des pièces et compte pour les quêtes."
    - q: "est-ce que ça bloque les applis qui distraient?"
      a: "pas encore. les tags de focus te permettent d'étiqueter chaque session et tes stats répartissent ton temps par tag. le blocage d'applis est prévu."
    - q: "c'est gratuit?"
      a: "oui. sans pub, sans abonnement. un pack de soutien optionnel, en achat unique, ajoute des pièces bonus et des objets premium."
  more: "plus de guides: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{pomodoro-timer}\">minuteur pomodoro</a> · <a href=\"{home}\">accueil pixeldoro</a>"
