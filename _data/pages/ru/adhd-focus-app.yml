# Страница adhd-focus-app, русский. Ключи повторяют text из en/adhd-focus-app.yml.
text:
  title: "Приложение для концентрации при СДВГ с наградами | Pixeldoro"
  description: "Бесплатное приложение для концентрации при СДВГ: body doubling с реальными людьми, монеты за каждую сессию, короткие таймеры и сюжет. Без камеры и рекламы."
  crumb: "приложение для фокуса при сдвг"
  eyebrow: "гайд pixeldoro"
  h1: "приложение для фокуса, когда у тебя сдвг"
  lead: "обычный таймер легко игнорировать. pixeldoro превращает фокус в игру, в которую ты играешь вместе с другими: реальные люди, которые фокусируются рядом, помогают начать, каждая сессия сразу приносит награду, а сюжет дает повод вернуться завтра."
  facts:
    - "бесплатно · без рекламы"
    - "без подписки"
    - "iphone · mac · android · windows · linux · браузер · discord"
  shot_alt: "Экран награды после завершенной сессии фокуса: фокус принес добычу, 30 монет, забрать"
  shot_caption: "каждый помодоро приносит награду, и сразу."
  cards_title: "для мозга, который перестает замечать таймер"
  cards:
    - title: "body doubling из коробки"
      text: "реальные люди, которые фокусируются вокруг, помогают начать. без камеры, без звонков, без записи на сессию."
    - title: "награда сразу"
      text: "каждый помодоро приносит монеты. трать их на мебель, комнаты, наряды и питомцев."
    - title: "короткие сессии тоже считаются"
      text: "пресет 15/3 для дней, когда 25 минут — это слишком, и секундомер на случай, когда накрывает гиперфокус."
    - title: "повод вернуться"
      text: "сюжетные, ежедневные и еженедельные задания, испытание недели для всего сообщества и статистика, которая все растет."
  steps_title: "как начать, когда начать — самое сложное"
  steps:
    - title: "просто открой"
      text: "план не нужен. открой pixeldoro и сядь в комнате, где люди уже работают."
    - title: "выбери одно маленькое дело"
      text: "поставь тег и запусти короткую сессию. 15 минут — это тоже настоящий помодоро."
    - title: "собери монеты"
      text: "забери награду, отдохни и посмотри, хочется ли еще один круг."
  prose_title: "что такое body doubling?"
  prose:
    - "body doubling — это работа, когда рядом кто-то есть. многим людям с сдвг гораздо проще начать и не отвлекаться, когда рядом другой человек, даже если он занят своими делами."
    - "pixeldoro дает это в любой момент. люди в каждой комнате настоящие и фокусируются прямо сейчас, у всех видно таймер и задачу. ты получаешь компанию без камеры, без расписания и без незнакомца, который на тебя смотрит. подробнее об этом — в гайде <a href=\"{study-with-me}\">учись со мной</a>."
    - "pixeldoro — не медицинский инструмент и не лечение сдвг. это просто более уютный способ раскачаться."
  quotes_title: "из отзывов"
  faq:
    - q: "подходит ли pixeldoro при сдвг?"
      a: "он сделан для тех, чей мозг перестает замечать обычный таймер. он награждает уже за то, что ты берешься за дело, люди, которые фокусируются вокруг, помогают начать, а сюжет дает повод возвращаться. это не медицинский инструмент, просто более уютный способ раскачаться."
    - q: "что такое body doubling?"
      a: "это работа рядом с кем-то другим, чтобы было легче начать и не бросить. в pixeldoro люди вокруг настоящие и фокусируются прямо сейчас, без камеры и звонков."
    - q: "что делать, если не получается сосредоточиться на 25 минут?"
      a: "включи пресет 15/3 или задай свою длину. короткая сессия тоже приносит монеты и засчитывается в задания."
    - q: "есть ли блокировка отвлекающих приложений?"
      a: "пока нет. теги фокуса позволяют подписать каждую сессию, а статистика делит твое время по тегам. блокировка приложений уже в планах."
    - q: "это бесплатно?"
      a: "да. без рекламы и без подписки. необязательный набор поддержки с разовой оплатой дает бонусные монеты и премиум-предметы."
  more: "еще гайды: <a href=\"{study-with-me}\">учись со мной</a> · <a href=\"{pomodoro-timer}\">помодоро таймер</a> · <a href=\"{home}\">главная pixeldoro</a>"
