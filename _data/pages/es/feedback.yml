# Página feedback, español de Latinoamérica.
text:
  title: "una nota del dev — pixeldoro"
  hello: "holaaa 👋"
  intro: "soy punk — la persona que está haciendo pixeldoro."
  sorry: "bueno. se me acabaron las tarjetas de regalo jaja. culpa mía."
  offer: "pero tengo algo mejor — <b>premium de por vida</b> en pixeldoro. para siempre. es tuyo si hacemos una llamada rapidita, o si nada más me mandas un email con lo que de verdad piensas. cualquiera de las dos sirve."
  reads: "tus comentarios deciden literal qué hago después. leo todo."
  thanks: "gracias 🙏"
  call: "→ agendar una llamada"
  email: "→ mandar comentarios"
