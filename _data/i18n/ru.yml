faq:
  title: "частые вопросы"
  items:
    - q: "что такое pixeldoro?"
      a: "pixeldoro — это бесплатный помодоро-таймер внутри уютного пиксельного мира. выбираешь место, запускаешь сессию фокуса и работаешь рядом с реальными людьми, которые делают то же самое. каждая сессия приносит монеты для твоей комнаты, двигает сюжет вперед и пополняет статистику. в нем есть встроенное лофи-радио, а работает он на iphone, ipad, mac, android, windows, linux, в браузере и в discord."
    - q: "pixeldoro бесплатный?"
      a: "да. таймер, мир, другие игроки, друзья, задания, питомцы и радио — все бесплатно, без рекламы и без подписки. есть необязательный набор поддержки с разовой оплатой: на 25% больше монет за каждую сессию, значок в профиле, премиум-скины, мебель, фоны и комнаты, а еще бонусное задание."
    - q: "это игра или приложение для продуктивности?"
      a: "и то и другое, но таймер на первом месте. игра движется, только когда ты фокусируешься: завершенные помодоро приносят монеты, закрывают задания и открывают новые места. между сессиями есть чем заняться ровно настолько, чтобы это радовало, но не отвлекало от дел."
    - q: "другие люди настоящие?"
      a: "да. каждый персонаж, который гуляет или сидит за столом, — это реальный игрок, который фокусируется прямо сейчас. видно его таймер, сколько помодоро он уже сделал и над чем работает."
    - q: "что такое body doubling?"
      a: "body doubling — это работа рядом с кем-то другим, чтобы было легче начать и не бросить. поэтому так хорошо учиться в библиотеке или в кофейне. pixeldoro дает это ощущение без камеры и расписания: открывай в любое время, и вокруг будут люди, погруженные в дела."
    - q: "можно учиться с друзьями?"
      a: "да. добавляй друзей, смотри, кто онлайн и над чем работает, и ходите друг к другу в гости, чтобы фокусироваться бок о бок. а если сменить сервер, можно найти другую компанию."
    - q: "подходит ли он при сдвг?"
      a: "он сделан для тех, чей мозг перестает замечать обычный таймер. он награждает уже за то, что ты берешься за дело, люди, которые фокусируются вокруг, помогают начать, а сюжет дает повод возвращаться. это не медицинский инструмент, просто более уютный способ раскачаться."
    - q: "есть список дел или блокировка приложений?"
      a: "пока нет. теги фокуса позволяют подписать каждую сессию (экзамены, код, чтение), а статистика делит твое время по тегам. и то и другое уже в планах."
    - q: "на чем можно играть и синхронизируется ли прогресс?"
      a: "iphone, ipad и mac — в app store, android — в google play, windows и linux — на pixeldoro.io, любой браузер — на play.pixeldoro.io, а еще как активность внутри discord. войди через email, и твой прогресс, комната и монеты будут с тобой на каждом устройстве. pixeldoro говорит на 9 языках."

outro:
  title: "ну что, за дело?"
