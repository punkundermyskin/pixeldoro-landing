# La pagina adhd-focus-app, italiano. Rispecchia le chiavi "text" di en/adhd-focus-app.yml.
text:
  title: "App per la concentrazione ADHD con body doubling | Pixeldoro"
  description: "App gratuita per concentrarsi con l'ADHD: body doubling con persone vere, monete a ogni sessione, timer brevi e una storia. Niente webcam, zero pubblicità."
  crumb: "app per l'adhd"
  eyebrow: "guida pixeldoro"
  h1: "un'app per concentrarsi, pensata per i cervelli adhd"
  lead: "i timer normali si ignorano facilmente. pixeldoro trasforma la concentrazione in un gioco che condividi con altre persone: le persone vere che si concentrano intorno a te ti aiutano a iniziare, ogni sessione ti premia subito e una storia ti dà un motivo per tornare domani."
  facts:
    - "gratis · senza pubblicità"
    - "senza abbonamento"
    - "iphone · mac · android · windows · linux · browser · discord"
  shot_alt: "Schermata dei premi dopo una sessione di focus completata: il focus ha sbloccato un bottino, 30 monete e il pulsante per riscuoterle"
  shot_caption: "ogni pomodoro ti premia, subito."
  cards_title: "fatta per i cervelli che ignorano un timer"
  cards:
    - title: "body doubling integrato"
      text: "le persone vere che si concentrano intorno a te ti aiutano a iniziare. niente webcam, niente call, niente sessioni da prenotare."
    - title: "un premio subito"
      text: "ogni pomodoro ti fa guadagnare monete. spendile in mobili, stanze, outfit e animali."
    - title: "anche le sessioni brevi contano"
      text: "un preset 15/3 per i giorni in cui 25 minuti sono troppi, e un cronometro per quando parte l'iperfocus."
    - title: "un motivo per tornare"
      text: "missioni della storia, giornaliere e settimanali, una sfida settimanale della community e statistiche che continuano a crescere."
  steps_title: "come iniziare quando il difficile è proprio iniziare"
  steps:
    - title: "aprilo e basta"
      text: "non ti serve un piano. apri pixeldoro e siediti in una stanza dove la gente sta già lavorando."
    - title: "scegli una cosa piccola"
      text: "dalle un tag e avvia una sessione breve. anche 15 minuti sono un pomodoro vero."
    - title: "riscuoti le monete"
      text: "prendi il tuo premio, fai la pausa e vedi se ti va di fare un altro giro."
  prose_title: "cos'è il body doubling?"
  prose:
    - "body doubling vuol dire lavorare mentre c'è qualcun altro intorno. tante persone con l'adhd trovano molto più facile iniziare e restare concentrate quando c'è un'altra persona, anche se è presa dal suo lavoro."
    - "pixeldoro te lo dà ogni volta che ti serve. le persone in ogni stanza sono vere e si stanno concentrando adesso, con il loro timer e la loro attività in vista. hai la compagnia senza webcam, senza orari e senza uno sconosciuto che ti guarda. ne parliamo meglio in <a href=\"{study-with-me}\">study with me</a>."
    - "pixeldoro non è uno strumento medico né una cura per l'adhd. è solo un modo più cozy per partire."
  quotes_title: "dalle recensioni"
  faq:
    - q: "pixeldoro va bene per l'adhd?"
      a: "è pensato per i cervelli che ignorano un timer normale. ti premia anche solo per esserci, le altre persone concentrate intorno a te ti aiutano a iniziare e la storia ti dà un motivo per tornare. non è uno strumento medico, solo un modo più cozy per partire."
    - q: "cos'è il body doubling?"
      a: "lavorare accanto a qualcun altro, così è più facile iniziare e andare avanti. su pixeldoro le persone intorno a te sono vere e si stanno concentrando adesso, senza webcam né call."
    - q: "e se non riesco a concentrarmi per 25 minuti?"
      a: "usa il preset 15/3 o imposta una durata tua. anche una sessione breve ti fa guadagnare monete e conta per le missioni."
    - q: "blocca le app che distraggono?"
      a: "non ancora. con i tag di focus puoi etichettare ogni sessione e le statistiche dividono il tuo tempo per tag. il blocco delle app è in programma."
    - q: "è gratis?"
      a: "sì. niente pubblicità, niente abbonamento. un pacchetto supporter facoltativo, a pagamento unico, aggiunge monete bonus e oggetti premium."
  more: "altre guide: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{pomodoro-timer}\">timer pomodoro</a> · <a href=\"{home}\">home di pixeldoro</a>"
