faq:
  title: "preguntas frecuentes"
  items:
    - q: "¿qué es pixeldoro?"
      a: "pixeldoro es un temporizador pomodoro gratis dentro de un mundo acogedor de pixel art. eliges un lugar, empiezas una sesión de enfoque y trabajas junto a personas reales que están haciendo lo mismo. cada sesión te da monedas para tu cuarto, hace avanzar la historia y suma a tus estadísticas. trae radio lofi integrada y funciona en iphone, ipad, mac, android, windows, linux, el navegador y discord."
    - q: "¿pixeldoro es gratis?"
      a: "sí. el temporizador, el mundo, los demás jugadores, los amigos, las misiones, las mascotas y la radio son gratis, sin anuncios y sin suscripción. hay un paquete de patrocinador opcional de pago único: 25% más monedas en cada sesión, una insignia en tu perfil, skins premium, muebles, fondos y salas, y una misión extra."
    - q: "¿es un juego o una app de productividad?"
      a: "las dos cosas, pero el temporizador va primero. el juego solo avanza cuando te concentras: terminar pomodoros te da monedas, completa misiones y desbloquea lugares nuevos. entre sesiones hay lo justo para que se sienta gratificante sin sacarte de lo que estás haciendo."
    - q: "¿las otras personas son reales?"
      a: "sí. cada personaje que camina por ahí o está sentado en un escritorio es un jugador real que se está concentrando ahora mismo. puedes ver su temporizador, cuántos pomodoros lleva y en qué está trabajando."
    - q: "¿qué es el body doubling?"
      a: "body doubling significa trabajar junto a otra persona para que sea más fácil empezar y seguir. por eso funciona estudiar en una biblioteca o en una cafetería. pixeldoro te da esa sensación sin cámara ni horarios: ábrelo cuando quieras y vas a encontrar gente concentrada a tu alrededor."
    - q: "¿puedo estudiar con amigos?"
      a: "sí. agrega amigos, mira quién está en línea y en qué está trabajando, y visítense en sus casas para concentrarse lado a lado. con los lobbies puedes cambiar de servidor y encontrar a otra gente."
    - q: "¿sirve para el tdah?"
      a: "está hecho para cerebros que se desconectan con un temporizador común. te recompensa solo por aparecer, ver a otras personas concentradas a tu alrededor te ayuda a empezar y la historia te da una razón para volver. no es una herramienta médica, solo una forma más acogedora de arrancar."
    - q: "¿tiene lista de pendientes o bloqueo de apps?"
      a: "todavía no. las etiquetas de enfoque te dejan nombrar cada sesión (exámenes, programación, lectura) y tus estadísticas dividen tu tiempo por etiqueta. las dos cosas están en la lista."
    - q: "¿en qué puedo jugarlo y se sincroniza mi progreso?"
      a: "iphone, ipad y mac en el app store, android en google play, windows y linux en pixeldoro.io, cualquier navegador en play.pixeldoro.io y como actividad dentro de discord. inicia sesión con tu email y tu progreso, tu cuarto y tus monedas te siguen a todos tus dispositivos. está en 9 idiomas."

outro:
  title: "¿te pones en modo enfoque?"
  lead: "gratis en todos tus dispositivos. hay gente concentrándose ahora mismo."

