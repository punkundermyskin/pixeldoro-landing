# study-with-me sayfası, Türkçe. Anahtarlar en/study-with-me.yml'deki "text" ile aynı.
text:
  title: "Benimle ders çalış, canlı ve gerçek insanlarla | Pixeldoro"
  description: "Online study with me, canlı ve sanal bir çalışma odasında: şu an odaklanan gerçek insanlarla ders çalış. Kamera, mikrofon yok; pomodoro sayacı ve lofi var."
  crumb: "study with me"
  eyebrow: "pixeldoro rehberi"
  h1: "benimle ders çalış: canlı, gerçek insanlarla"
  lead: "pixeldoro, sıcacık bir piksel kasaba şeklinde ücretsiz bir sanal çalışma odası. aç, kendini şu an odaklanan gerçek insanların yanında ders çalışırken bul; herkesin başının üstünde bir zamanlayıcı ve ne üzerinde çalıştığı yazıyor. kamera yok, mikrofon yok, program yok."
  facts:
    - "ücretsiz · reklam yok"
    - "kamera ya da mikrofon yok"
    - "iphone · mac · android · windows · linux · tarayıcı · discord"
  shot_alt: "Yağmurlu bir gecede çalışan bir pomodoro; yanında sıcak lambaların altında ders çalışan bir grup kullanıcı, her birinin zamanlayıcısı ve görevi görünüyor"
  shot_caption: "buradaki herkes şu an ders çalışıyor. yağmur açık, lofi açık."
  cards_title: "hiç kapanmayan bir çalışma odası"
  cards:
    - title: "gerçek insanlar, şu an"
      text: "gördüğün her karakter, odak seansındaki gerçek bir insan. zamanlayıcısını, pomodoro sayısını ve neyle uğraştığını görürsün."
    - title: "kamera yok, görüntülü arama yok"
      text: "kimse seni kameradan izlemiyor. kütüphanedeki o sessiz arkadaşlık, masandan kalkmadan."
    - title: "arkadaşlarınla ders çalış"
      text: "arkadaş ekle, kimin çevrimiçi olduğunu ve ne üzerinde çalıştığını gör, yan yana odaklanmak için birbirinizin evine uğrayın."
    - title: "her moda göre bir oda"
      text: "kırsal, şehir merkezi, bar, mağaza ve hq; her birinin kendi kalabalığı var. başka bir kalabalık bulmak için sunucu değiştir."
  steps_title: "pixeldoro'da başkalarıyla nasıl ders çalışılır"
  steps:
    - title: "bir oda seç"
      text: "pixeldoro'yu tarayıcında ya da uygulamada aç ve istediğin odaya gir. her birinde odaklanan insanlar var."
    - title: "ne üzerinde çalıştığını söyle"
      text: "seansını etiketle (sınavlar, kodlama, okuma) ve bir pomodoro başlat. yakındaki herkes seninkini görür, sen de onlarınkini."
    - title: "kalabalıkla odaklan"
      text: "zamanlayıcı çalınca molayı birlikte ver: etrafta dolaş, arkadaşlarına bir uğra, kazandığın jetonları harca."
  prose_title: "başkalarıyla ders çalışmak neden işe yarıyor"
  prose:
    - "study with me videoları basit bir sebeple patladı: başka biri de çalışırken başlamak ve devam etmek daha kolay. kütüphanenin ya da kafenin işe yaramasının sebebi de bu. psikologlar buna sosyal kolaylaştırma diyor; dehb'si olanlar genelde <a href=\"{adhd-focus-app}\">body doubling</a> diyor."
    - "video tek yönlü ve önceden kaydedilmiş. pixeldoro'da etrafındaki insanlar şu an odaklanıyor ve onlar da seni görüyor. bu küçük hesap verme hissi, çoğu zaman telefonda gezinmeyi bırakıp bir sonraki <a href=\"{pomodoro-timer}\">pomodoroyu</a> başlatmana yetiyor."
  faq:
    - q: "study with me nedir?"
      a: "study with me, birinin ders çalışırken çekilmiş videosu ya da yayını; sen de onunla birlikte çalışırsın. pixeldoro bunu canlı ve iki yönlü yapıyor: etrafındaki insanlar şu an ders çalışıyor ve onlar da seni görüyor."
    - q: "kamera ya da mikrofon gerekiyor mu?"
      a: "hayır. sen başının üstünde bir zamanlayıcı ve görev olan piksel bir karaktersin. kimse seni görmez, duymaz."
    - q: "arkadaşlarımla ders çalışabilir miyim?"
      a: "evet. arkadaş ekle, nerede olduklarını ve neye odaklandıklarını gör, birlikte çalışmak için birbirinizin evine uğrayın. lobilerle sunucu da değiştirebilirsin."
    - q: "her zaman çevrimiçi biri oluyor mu?"
      a: "dünyanın her yerinden insanlar günün her saati pixeldoro'da odaklanıyor, o yüzden odalar nadiren boş kalır."
    - q: "ücretsiz mi?"
      a: "evet. zamanlayıcı, dünya, diğer oyuncular, arkadaşlar ve radyo tamamen ücretsiz; reklam yok, abonelik yok. istersen tek seferlik bir destekçi paketi bonus jeton ve premium eşyalar ekler."
  more: "diğer rehberler: <a href=\"{pomodoro-timer}\">pomodoro zamanlayıcı</a> · <a href=\"{adhd-focus-app}\">dehb odak uygulaması</a> · <a href=\"{home}\">pixeldoro ana sayfa</a>"
