# Página windows, español de Latinoamérica. Refleja las claves "text" de en/windows.yml.
text:
  title: "Temporizador pomodoro gratis para PC con Windows | Pixeldoro"
  description: "Descarga Pixeldoro para Windows 10 y 11: pomodoro gratis en un mundo pixel acogedor para estudiar con gente real. Radio lofi, estadísticas y sin anuncios."
  crumb: "windows"
  eyebrow: "pixeldoro para windows"
  h1: "un temporizador pomodoro acogedor para tu pc con windows"
  lead: "pixeldoro es un temporizador pomodoro gratis dentro de un mundo de pixel art, donde te concentras junto a personas reales que están estudiando ahora mismo. en windows tiene su propia ventana, así que el temporizador y la radio lofi siguen sonando mientras trabajas en otras apps."
  button: "descargar para windows"
  note: "gratis · windows 10 y 11 · 64 bits"
  others: "o juega <a href=\"https://play.pixeldoro.io/web-beta\">en tu navegador</a>, o descárgalo para <a href=\"https://play.pixeldoro.io/macos\">mac</a> · <a href=\"{linux}\">linux</a>"
  on_computer: "¿estás en una computadora con windows? abre esta página ahí para descargarlo"
  facts:
    - "gratis · sin anuncios"
    - "windows 10 + 11"
    - "una cuenta en todos tus dispositivos"
  shot_alt: "Lista de amigos en la comunidad: el avatar de cada amigo, en qué se está enfocando, en qué sala está y su número de pomodoros, junto a un café lleno de gente estudiando"
  shot_caption: "mira en qué se están enfocando tus amigos, y dónde."
  cards_title: "por qué usar la app de windows"
  cards:
    - title: "sigue funcionando en segundo plano"
      text: "minimízala o cámbiate a lo tuyo. el temporizador y la radio siguen, y la app está a un alt+tab de distancia."
    - title: "radio lofi integrada"
      text: "seis estaciones de lofi + chill, así que no necesitas otra pestaña con música. mientras te concentras, llegan la lluvia y la neblina."
    - title: "personas reales, ahora mismo"
      text: "cada personaje en la sala es una persona real en una sesión de enfoque, con su temporizador y su tarea sobre la cabeza."
    - title: "tu progreso en todas partes"
      text: "inicia sesión con tu email y tu cuarto, tus monedas y tus estadísticas te siguen a tu celular, tu mac y el navegador."
  steps_title: "cómo instalar pixeldoro en windows"
  steps:
    - title: "descarga el instalador"
      text: "haz clic en el botón de descarga para bajar el instalador de pixeldoro."
    - title: "ejecútalo"
      text: "abre el archivo y sigue los pasos del instalador. si windows dice “windows protegió su pc”, haz clic en <b>más información</b> y luego en <b>ejecutar de todas formas</b>."
    - title: "inicia sesión y concéntrate"
      text: "abre pixeldoro, inicia sesión con tu email si también juegas en otros dispositivos, elige una sala y empieza un pomodoro."
  prose_title: "¿la app o el navegador?"
  prose:
    - "pixeldoro también funciona en cualquier navegador, sin instalar nada. la app de windows es para cuando te concentras en tu pc todos los días: tiene su propia ventana y su ícono en la barra de tareas, no se cierra junto con tus otras pestañas, y los navegadores frenan las pestañas que no estás viendo."
    - "¿no conoces la técnica? lee la <a href=\"{pomodoro-timer}\">guía del temporizador pomodoro</a>, o mira cómo <a href=\"{study-with-me}\">estudiar junto a otras personas</a> te ayuda a empezar."
  faq:
    - q: "¿pixeldoro es gratis en windows?"
      a: "sí. el temporizador, el mundo, los demás jugadores, los amigos y la radio son gratis, sin anuncios y sin suscripción. un paquete de patrocinador opcional de pago único agrega monedas extra y objetos premium."
    - q: "¿en qué versiones de windows funciona?"
      a: "windows 10 y windows 11 de 64 bits."
    - q: "¿por qué windows dice que protegió mi pc?"
      a: "es smartscreen. aparece con apps de desarrolladores pequeños que no tienen un certificado de firma de código pagado. haz clic en <b>más información</b> y luego en <b>ejecutar de todas formas</b>."
    - q: "¿el temporizador sigue corriendo si lo minimizo?"
      a: "sí. el temporizador y la radio siguen mientras la ventana está minimizada o detrás de otras apps."
    - q: "¿cómo lo actualizo?"
      a: "descarga el instalador más reciente desde esta página y ejecútalo."
    - q: "¿puedo usar la misma cuenta en mi celular?"
      a: "sí. inicia sesión con el mismo email en iphone, android, mac o el navegador, y tu progreso, tu cuarto y tus monedas te acompañan."
    - q: "¿hay versión para mac o linux?"
      a: "sí. la de mac está en el <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>, y también hay una <a href=\"{linux}\">versión para linux</a>."
  more: "más: <a href=\"{linux}\">pixeldoro para linux</a> · <a href=\"{pomodoro-timer}\">temporizador pomodoro</a> · <a href=\"{study-with-me}\">estudia conmigo</a> · <a href=\"{home}\">inicio de pixeldoro</a>"
