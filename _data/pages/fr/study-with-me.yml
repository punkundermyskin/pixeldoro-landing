# La page study-with-me, en français. Mêmes clés que le "text" de en/study-with-me.yml.
text:
  title: "Study with me en direct: étudier ensemble en ligne | Pixeldoro"
  description: "Salle d'étude virtuelle en direct: étudie avec de vraies personnes concentrées en ce moment. Body doubling sans caméra ni micro, minuteur pomodoro, radio lofi."
  crumb: "study with me"
  eyebrow: "guide pixeldoro"
  h1: "study with me, en direct, avec de vraies personnes"
  lead: "pixeldoro est une salle d'étude virtuelle gratuite en forme de petite ville pixel cosy. ouvre-le et tu étudies à côté de vraies personnes qui se concentrent en ce moment même, chacune avec son minuteur et sa tâche au-dessus de la tête. pas de caméra, pas de micro, pas d'horaire."
  facts:
    - "gratuit · sans pub"
    - "sans caméra ni micro"
    - "iphone · mac · android · windows · linux · navigateur · discord"
  shot_alt: "Un pomodoro en cours la nuit sous la pluie, à côté d'un groupe d'utilisateurs qui étudient sous des lampes chaleureuses, chacun affichant son minuteur et sa tâche"
  shot_caption: "ici, tout le monde étudie en ce moment. pluie et lofi en fond."
  cards_title: "une salle d'étude qui ne ferme jamais"
  cards:
    - title: "de vraies personnes, en ce moment"
      text: "chaque personnage que tu vois est une vraie personne en pleine session de focus. tu vois son minuteur, son nombre de pomodoros et sur quoi elle bosse."
    - title: "pas de caméra, pas d'appel"
      text: "personne ne te regarde par webcam. c'est la compagnie silencieuse d'une bibliothèque, sans quitter ton bureau."
    - title: "étudie avec tes amis"
      text: "ajoute des amis, vois qui est en ligne et sur quoi ils bossent, et allez les uns chez les autres pour vous concentrer côte à côte."
    - title: "une salle pour chaque humeur"
      text: "la campagne, le centre-ville, le bar, la boutique et le qg, chacun avec ses habitués. change de serveur pour tomber sur d'autres têtes."
  steps_title: "comment étudier avec d'autres sur pixeldoro"
  steps:
    - title: "choisis une salle"
      text: "ouvre pixeldoro dans ton navigateur ou dans l'appli et entre dans n'importe quelle salle. il y a des gens concentrés dans chacune."
    - title: "dis sur quoi tu bosses"
      text: "tague ta session (examens, code, lecture) et lance un pomodoro. tout le monde autour voit la tienne, et tu vois les leurs."
    - title: "concentre-toi avec les autres"
      text: "quand le minuteur sonne, pause pour tout le monde: balade-toi, passe voir tes amis, dépense les pièces que tu as gagnées."
  prose_title: "pourquoi étudier avec d'autres, ça marche"
  prose:
    - "les vidéos study with me ont cartonné pour une raison simple: c'est plus facile de commencer et de tenir quand quelqu'un d'autre bosse aussi. c'est pour ça qu'une bibliothèque ou un café aident. les psychologues appellent ça la facilitation sociale, et les personnes avec un tdah parlent souvent de <a href=\"{adhd-focus-app}\">body doubling</a>."
    - "une vidéo, c'est à sens unique et préenregistré. dans pixeldoro, les gens autour de toi se concentrent en ce moment même, et ils te voient aussi. ce petit regard extérieur suffit souvent pour arrêter de scroller et lancer le prochain <a href=\"{pomodoro-timer}\">pomodoro</a>."
  faq:
    - q: "c'est quoi, un study with me?"
      a: "un study with me, c'est une vidéo ou un live de quelqu'un qui étudie, pour que tu étudies en même temps que lui. pixeldoro le rend en direct et dans les deux sens: les gens autour de toi étudient en ce moment, et ils te voient aussi."
    - q: "il faut une caméra ou un micro?"
      a: "non. tu es un personnage en pixel avec un minuteur et une tâche au-dessus de la tête. personne ne te voit ni ne t'entend."
    - q: "je peux étudier avec mes amis?"
      a: "oui. ajoute des amis, vois où ils sont et sur quoi ils se concentrent, et allez les uns chez les autres pour étudier ensemble. les lobbies te permettent aussi de changer de serveur."
    - q: "il y a toujours quelqu'un en ligne?"
      a: "des gens du monde entier se concentrent sur pixeldoro jour et nuit, donc les salles sont rarement vides."
    - q: "c'est gratuit?"
      a: "oui. le minuteur, le monde, les autres joueurs, les amis et la radio sont gratuits, sans pub et sans abonnement. un pack de soutien optionnel, en achat unique, ajoute des pièces bonus et des objets premium."
  more: "plus de guides: <a href=\"{pomodoro-timer}\">minuteur pomodoro</a> · <a href=\"{adhd-focus-app}\">appli de concentration tdah</a> · <a href=\"{home}\">accueil pixeldoro</a>"
