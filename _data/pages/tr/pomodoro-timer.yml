# pomodoro-timer sayfası, Türkçe. Anahtarlar en/pomodoro-timer.yml'deki "text" ile aynı.
text:
  title: "Estetik pomodoro sayacı: piksel art ve lofi | Pixeldoro"
  description: "Cozy piksel art dünyada ücretsiz, estetik pomodoro sayacı: 25/5, 45/15 ya da özel süre, kronometre, lofi radyo, odak etiketleri ve istatistikler. Her cihazda."
  crumb: "pomodoro zamanlayıcı"
  eyebrow: "pixeldoro rehberi"
  h1: "piksel art bir dünyada estetik bir pomodoro zamanlayıcı"
  lead: "pixeldoro, sıcacık bir piksel kasabanın içinde ücretsiz bir pomodoro zamanlayıcı. hazır bir süre seç ya da kendin ayarla, lofi radyoyu aç ve çalışırken yağmuru izle. her pomodoro jeton kazandırır, saatlerin de neyle uğraştığına göre ayrılmış istatistiklerde birikir."
  facts:
    - "ücretsiz · reklam yok"
    - "abonelik yok"
    - "iphone · mac · android · windows · linux · tarayıcı · discord"
  shot_alt: "Odak zamanlayıcısı ekranı: 25/5, 45/15, 15/3, kronometre ve özel süre seçenekleri, 25:00'da bekleyen bir zamanlayıcı ve matematik sınavları, ingilizce, fizik gibi renkli odak etiketleri"
  shot_caption: "ne üzerinde çalışacağını seç ve bir pomodoro başlat."
  cards_title: "bir pomodoro zamanlayıcıda olması gereken her şey"
  cards:
    - title: "hazır ayar ya da kendi süren"
      text: "25/5, 45/15, 15/3 ya da istediğin herhangi bir süre. uzun ve derin çalışmalar için 8 saate kadar kronometre."
    - title: "içinde lofi radyo"
      text: "altı lofi ve chill istasyon, uğraşacak çalma listesi yok. sen odaklanırken yağmur yağar, sis çöker."
    - title: "odak etiketleri"
      text: "her seansı etiketle: sınavlar, kodlama, okuma. süre bitince gerçek bir alarm çalar, mola bitince de seni dürter."
    - title: "biriken istatistikler"
      text: "saatlerinin nereye gittiğini etiket etiket, hafta hafta gör. her seans odan için jeton da kazandırır."
  steps_title: "pomodoro zamanlayıcı nasıl kullanılır"
  steps:
    - title: "bir süre seç"
      text: "25/5 klasik olanı. 45/15 uzun ders blokları için birebir, 15/3 de ağır geçen bir günde ısınmak için iyi."
    - title: "etiketle ve başlat"
      text: "ne üzerinde çalıştığını seç ve başlat'a bas. yakındaki herkes zamanlayıcını ve görevini görür."
    - title: "molanı ver"
      text: "alarm çalınca kalk, gerin, kasabada bir tur at. işe dönme vakti gelince pixeldoro sana hatırlatır."
  prose_title: "pomodoro tekniği nedir?"
  prose:
    - "pomodoro tekniği, işi aralarında mola olan kısa ve odaklı bloklara böler. klasik versiyonu 25 dakika odak ve 5 dakika mola, dört turdan sonra da daha uzun bir mola. adını domates şeklindeki bir mutfak zamanlayıcısından alıyor; pixeldoro'nun maskotunun domates olmasının sebebi de bu."
    - "işe yarıyor çünkü kısa bir bloğa başlamak kolay, her an yaklaşan bir mola da devam etmeyi kolaylaştırıyor. 25 dakika uzun geliyorsa daha kısa başla. akışa girdiysen kronometreyi aç ve devam et."
    - "sadece zamanlayıcı mı lazım? <a href=\"{mini}\">pixeldoro mini</a> işin sade hali: bir zamanlayıcı, piksel art arka planlar, lofi müzik ve istatistikler. odaklanırken yanında birileri olsun mu istiyorsun? <a href=\"{study-with-me}\">study with me</a> sayfasına bak."
  faq:
    - q: "en iyi pomodoro süresi kaç dakika?"
      a: "klasik olanı 25 dakika odak, 5 dakika mola. derin çalışma için birçok kişi 45/15 ya da 50/10'u, enerjinin düşük olduğu günlerde de 15/3'ü tercih ediyor. birkaçını dene, sana uyanla devam et."
    - q: "pomodoro süresini kendim ayarlayabilir miyim?"
      a: "evet. 25/5, 45/15 ve 15/3 hazır ayarlarının yanında özel bir süre belirleyebilir ya da 8 saate kadar kronometre kullanabilirsin."
    - q: "seans bitince haber veriyor mu?"
      a: "evet. odak seansın bitince pixeldoro gerçek bir alarm çalar, molan bitince de sana hatırlatır."
    - q: "pomodoro zamanlayıcı ücretsiz mi?"
      a: "evet. zamanlayıcı, radyo, istatistikler ve bütün dünya ücretsiz; reklam yok, abonelik yok."
    - q: "daha sade bir versiyonu var mı?"
      a: "pixeldoro mini sadece zamanlayıcıdan ibaret: piksel art arka planlar, lofi müzik ve istatistikler, iphone ve android'de."
  more: "diğer rehberler: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{adhd-focus-app}\">dehb odak uygulaması</a> · <a href=\"{home}\">pixeldoro ana sayfa</a>"
