faq:
  title: "perguntas frequentes"
  items:
    - q: "o que é o pixeldoro?"
      a: "o pixeldoro é um timer pomodoro grátis dentro de um mundo aconchegante em pixel art. você escolhe um lugar, começa uma sessão de foco e trabalha ao lado de pessoas reais fazendo o mesmo. cada sessão rende moedas para o seu quarto, faz a história avançar e soma nas suas estatísticas. tem rádio lofi integrada e roda no iphone, ipad, mac, android, windows, linux, no navegador e no discord."
    - q: "o pixeldoro é grátis?"
      a: "sim. o timer, o mundo, os outros jogadores, os amigos, as missões, os pets e a rádio são todos grátis, sem anúncios e sem assinatura. existe um pacote de apoiador opcional, com pagamento único: 25% a mais de moedas em cada sessão, um selo no perfil, skins premium, móveis, fundos e cômodos, e uma missão bônus."
    - q: "é um jogo ou um app de produtividade?"
      a: "os dois, mas o timer vem primeiro. o jogo só anda quando você foca: completar pomodoros rende moedas, cumpre missões e desbloqueia novos lugares. entre as sessões tem o suficiente pra fazer e se sentir recompensado, sem te tirar do foco."
    - q: "as outras pessoas são reais?"
      a: "sim. cada personagem andando por aí ou sentado numa mesa é um jogador real focando agora. dá pra ver o timer, quantos pomodoros a pessoa já fez e no que ela está trabalhando."
    - q: "o que é body doubling?"
      a: "body doubling é trabalhar ao lado de outra pessoa para ficar mais fácil começar e continuar. é por isso que estudar numa biblioteca ou numa cafeteria funciona. o pixeldoro te dá essa sensação sem câmera e sem horário marcado: abra quando quiser e vai ter gente focada ao seu redor."
    - q: "dá pra estudar com amigos?"
      a: "sim. adicione amigos, veja quem está online e no que estão trabalhando, e visitem a casa um do outro para focar lado a lado. dá pra trocar de servidor e encontrar outra galera."
    - q: "é bom para tdah?"
      a: "ele foi feito para cérebros que ignoram um timer comum. ele te recompensa só por marcar presença, outras pessoas focando ao seu redor ajudam você a começar e a história te dá um motivo para voltar. não é uma ferramenta médica, só um jeito mais aconchegante de começar."
    - q: "tem lista de tarefas ou bloqueio de apps?"
      a: "ainda não. as tags de foco deixam você marcar cada sessão (provas, programação, leitura) e suas estatísticas dividem seu tempo por tag. as duas coisas estão nos planos."
    - q: "onde dá pra jogar, e meu progresso sincroniza?"
      a: "iphone, ipad e mac na app store, android no google play, windows e linux no pixeldoro.io, qualquer navegador em play.pixeldoro.io e como atividade dentro do discord. entre com seu e-mail e seu progresso, seu quarto e suas moedas te acompanham em todos os dispositivos. ele fala 9 idiomas."

outro:
  title: "bora entrar no modo foco?"
  lead: "grátis em todos os dispositivos. tem gente focando agora mesmo."

