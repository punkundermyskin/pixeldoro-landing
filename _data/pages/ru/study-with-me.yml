# Страница study-with-me, русский. Ключи повторяют text из en/study-with-me.yml.
text:
  title: "Учись со мной онлайн вместе с реальными людьми | Pixeldoro"
  description: "Онлайн-комната для учебы: занимайся рядом с реальными людьми, которые в фокусе прямо сейчас. Body doubling без камеры и микрофона, помодоро таймер и лофи."
  crumb: "учись со мной"
  eyebrow: "гайд pixeldoro"
  h1: "учись со мной вживую, с реальными людьми"
  lead: "pixeldoro — бесплатная виртуальная комната для учебы в виде уютного пиксельного городка. открываешь его — и ты уже учишься рядом с реальными людьми, которые в фокусе прямо сейчас, а над головой у каждого таймер и то, чем он занят. без камеры, без микрофона, без расписания."
  facts:
    - "бесплатно · без рекламы"
    - "без камеры и микрофона"
    - "iphone · mac · android · windows · linux · браузер · discord"
  shot_alt: "Помодоро ночью под дождем рядом с группой пользователей, которые учатся под теплыми фонарями; у каждого видно таймер и задачу"
  shot_caption: "все здесь учатся прямо сейчас. дождь шумит, лофи играет."
  cards_title: "комната для учебы, которая никогда не закрывается"
  cards:
    - title: "реальные люди, прямо сейчас"
      text: "каждый персонаж, которого ты видишь, — реальный человек в сессии фокуса. видно его таймер, сколько у него помодоро и чем он занят."
    - title: "без камеры и звонков"
      text: "никто не смотрит на тебя через вебку. это тихая компания, как в библиотеке, только вставать из-за стола не нужно."
    - title: "учись с друзьями"
      text: "добавляй друзей, смотри, кто онлайн и над чем работает, и ходите друг к другу в гости, чтобы фокусироваться бок о бок."
    - title: "комната под любое настроение"
      text: "деревня, центр, бар, магазин и штаб, и в каждом своя компания. смени сервер, чтобы найти другую."
  steps_title: "как учиться вместе с другими в pixeldoro"
  steps:
    - title: "выбери комнату"
      text: "открой pixeldoro в браузере или в приложении и заходи в любую комнату. в каждой кто-то уже фокусируется."
    - title: "скажи, над чем работаешь"
      text: "отметь сессию тегом (экзамены, код, чтение) и запусти помодоро. все рядом видят твой помодоро, а ты — их."
    - title: "фокусируйся вместе со всеми"
      text: "когда таймер зазвенит, отдыхайте вместе: прогуляйся, загляни к друзьям, потрать заработанные монеты."
  prose_title: "почему учиться рядом с другими проще"
  prose:
    - "ролики study with me выстрелили по простой причине: начать и не бросить легче, когда рядом кто-то тоже работает. по той же причине помогают библиотека или кофейня. психологи называют это социальной фасилитацией, а люди с сдвг часто называют <a href=\"{adhd-focus-app}\">body doubling</a>."
    - "видео работает в одну сторону и записано заранее. а в pixeldoro люди вокруг фокусируются прямо сейчас и тоже тебя видят. этой капли ответственности часто хватает, чтобы перестать листать ленту и запустить следующий <a href=\"{pomodoro-timer}\">помодоро</a>."
  faq:
    - q: "что такое study with me?"
      a: "study with me — это видео или стрим, где человек учится, а ты учишься вместе с ним. pixeldoro делает это вживую и в обе стороны: люди вокруг учатся прямо сейчас и тоже тебя видят."
    - q: "нужна ли камера или микрофон?"
      a: "нет. ты пиксельный персонаж с таймером и задачей над головой. тебя никто не видит и не слышит."
    - q: "можно ли учиться вместе с друзьями?"
      a: "да. добавляй друзей, смотри, где они и на чем сосредоточены, и ходите друг к другу в гости, чтобы учиться вместе. а еще в лобби можно сменить сервер."
    - q: "там всегда кто-то онлайн?"
      a: "в pixeldoro фокусируются люди со всего мира круглые сутки, так что комнаты редко пустуют."
    - q: "это бесплатно?"
      a: "да. таймер, мир, другие игроки, друзья и радио — все бесплатно, без рекламы и без подписки. необязательный набор поддержки с разовой оплатой дает бонусные монеты и премиум-предметы."
  more: "еще гайды: <a href=\"{pomodoro-timer}\">помодоро таймер</a> · <a href=\"{adhd-focus-app}\">приложение для фокуса при сдвг</a> · <a href=\"{home}\">главная pixeldoro</a>"
