# The adhd-focus-app page, English. Other languages mirror the text keys under "text"; "layout" is read from this file only.
# {windows}, {linux}, {home} and the other {page} placeholders become links to the same language's pages.
layout:
  kind: "guide"
  shot: "coins"
  icons:
    - "radio"
    - "tomato"
    - "folder"
    - "stats"
  quotes:
    - text: "“Top tier for neurodivergents”"
      store: "mac_app_store"
    - text: "“This app has helped me build a less resistant, if not outright positive, relationship with my tasks.”"
      store: "app_store"
text:
  title: "A focus app for ADHD: body doubling and rewards | Pixeldoro"
  description: "A free focus app for ADHD brains: body doubling with real people, coins for every session, short timers and a story to come back to. No camera, no ads."
  crumb: "adhd focus app"
  eyebrow: "pixeldoro guide"
  h1: "a focus app for adhd brains"
  lead: "plain timers are easy to ignore. pixeldoro turns focus into a game you share with other people: real people focusing around you help you start, every session pays out right away, and a story gives you a reason to come back tomorrow."
  facts:
    - "free · no ads"
    - "no subscription"
    - "iphone · mac · android · windows · linux · browser · discord"
  shot_alt: "Reward screen after a finished focus session: focus unlocked some loot, 30 coins, claim"
  shot_caption: "every pomodoro pays out, right away."
  cards_title: "made for brains that tune out a timer"
  cards:
    - title: "body doubling built in"
      text: "real people focusing around you make it easier to start. no camera, no call, no booking a session."
    - title: "a reward right away"
      text: "every pomodoro earns coins. spend them on furniture, rooms, outfits and pets."
    - title: "short sessions count"
      text: "a 15/3 preset for days when 25 minutes is too much, and a stopwatch for when hyperfocus kicks in."
    - title: "a reason to come back"
      text: "story, daily and weekly quests, a weekly community challenge and stats that keep stacking up."
  steps_title: "how to get started when starting is the hard part"
  steps:
    - title: "just open it"
      text: "you don't need a plan. open pixeldoro and sit down in a room where people are already working."
    - title: "pick one small thing"
      text: "tag it and start a short session. 15 minutes is a real pomodoro too."
    - title: "collect your coins"
      text: "claim your reward, take the break, and see if you want one more round."
  prose_title: "what is body doubling?"
  prose:
    - "body doubling means working while someone else is around. a lot of people with adhd find it much easier to start and stay on task when another person is there, even if that person is busy with their own work."
    - "pixeldoro gives you that whenever you need it. the people in each room are real and focusing right now, with their timer and their task showing. you get the company without a camera, a schedule or a stranger watching you. more on that in <a href=\"{study-with-me}\">study with me</a>."
    - "pixeldoro isn't a medical tool or a treatment for adhd. it's a cozier way to get going."
  quotes_title: "from the reviews"
  faq:
    - q: "is pixeldoro good for adhd?"
      a: "it's built for brains that tune out a plain timer. it rewards you just for showing up, other people focusing around you help you start, and the story gives you a reason to come back. it isn't a medical tool, just a cozier way to get going."
    - q: "what is body doubling?"
      a: "working next to someone else so it's easier to start and keep going. in pixeldoro the people around you are real and focusing right now, with no camera or call."
    - q: "what if i can't focus for 25 minutes?"
      a: "use the 15/3 preset or set your own length. a short session still earns coins and counts toward quests."
    - q: "does it block distracting apps?"
      a: "not yet. focus tags let you label each session and your stats split your time by tag. app blocking is on the list."
    - q: "is it free?"
      a: "yes. no ads, no subscription. an optional one-time supporter pack adds bonus coins and premium items."
  more: "more guides: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{pomodoro-timer}\">pomodoro timer</a> · <a href=\"{home}\">pixeldoro home</a>"
