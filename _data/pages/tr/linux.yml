# linux sayfası, Türkçe. Anahtarlar en/linux.yml'deki "text" ile aynı.
text:
  title: "Linux için pomodoro sayacı, ücretsiz ve cozy | Pixeldoro"
  description: "Linux için Pixeldoro: gerçek insanlarla ders çalıştığın cozy piksel dünyada ücretsiz pomodoro sayacı. Lofi radyo ve istatistikli yerel x86_64 sürüm."
  crumb: "linux"
  eyebrow: "linux için pixeldoro"
  h1: "linux'ta çalışan sıcacık bir pomodoro zamanlayıcı"
  lead: "pixeldoro, piksel art bir dünyanın içinde ücretsiz bir pomodoro zamanlayıcı; burada şu an ders çalışan gerçek insanların yanında odaklanırsın. linux sürümü yerel bir derleme: arşivden çıkar, çalıştır; zamanlayıcı ve lofi radyo kendi penceresinde çalışmaya devam eder."
  button: "linux için indir"
  note: "ücretsiz · 64-bit x86_64 · .tar.gz"
  others: "ya da <a href=\"https://play.pixeldoro.io/web-beta\">tarayıcında</a> oyna, veya <a href=\"{windows}\">windows</a> · <a href=\"https://play.pixeldoro.io/macos\">mac</a> için indir"
  on_computer: "linux bilgisayarın mı var? indirmek için bu sayfayı orada aç"
  facts:
    - "ücretsiz · reklam yok"
    - "yerel x86_64 sürüm"
    - "her cihazda tek hesap"
  shot_alt: "Üç evcil kedi ve ziyarete gelen iki arkadaşla dekore edilmiş bir ev; her birinin pomodoro sayısı ve ne çalıştığı görünüyor"
  shot_caption: "arkadaşlarını evine çağır. kediler burada yaşıyor."
  cards_title: "neden linux uygulaması"
  cards:
    - title: "yerel bir sürüm"
      text: "gerçek bir linux sürümü, bir kılıfa sarılmış web sayfası değil. sisteme hiçbir şey kurulmaz: her şey tek bir klasörde durur."
    - title: "içinde lofi radyo"
      text: "altı lofi + chill istasyon, müzik için ayrı bir sekmeye gerek yok. sen odaklanırken yağmur yağar, sis çöker."
    - title: "gerçek insanlar, şu an"
      text: "odadaki her karakter, odak seansındaki gerçek bir insan; zamanlayıcısı ve görevi başının üstünde."
    - title: "ilerlemen her yerde"
      text: "e-postanla giriş yap; odan, jetonların ve istatistiklerin telefonuna, dizüstüne ve tarayıcıya seninle gelir."
  steps_title: "pixeldoro linux'a nasıl kurulur"
  steps:
    - title: "indir"
      text: "pixeldoro'yu .tar.gz dosyası olarak almak için indirme düğmesine tıkla."
    - title: "arşivden çıkar"
      text: "dosya yöneticinden ya da <code>tar -xzf pixeldoro-*.tar.gz</code> ile istediğin yere çıkar. elinde bir <code>pixeldoro</code> klasörü olacak."
    - title: "çalıştır"
      text: "klasörü aç ve <code>pixeldoro.x86_64</code> dosyasını çalıştır: çift tıkla ya da terminalde <code>./pixeldoro.x86_64</code> yaz. başka cihazlarda da oynuyorsan e-postanla giriş yap."
  prose_title: "uygulama mı, tarayıcı mı?"
  prose:
    - "pixeldoro her tarayıcıda da çalışır, kurulum gerekmez. linux uygulaması her gün bilgisayar başında odaklananlar için: kendi penceresi var, diğer sekmelerinle birlikte yanlışlıkla kapanmaz, üstelik tarayıcılar bakmadığın sekmeleri yavaşlatır."
    - "teknikte yeni misin? <a href=\"{pomodoro-timer}\">pomodoro zamanlayıcı rehberini</a> oku ya da <a href=\"{study-with-me}\">başkalarının yanında ders çalışmanın</a> başlamana nasıl yardım ettiğine bak."
  faq:
    - q: "pixeldoro linux'ta ücretsiz mi?"
      a: "evet. zamanlayıcı, dünya, diğer oyuncular, arkadaşlar ve radyo tamamen ücretsiz; reklam yok, abonelik yok. istersen tek seferlik bir destekçi paketi bonus jeton ve premium eşyalar ekler."
    - q: "pixeldoro hangi linux dağıtımlarında çalışır?"
      a: "opengl 3.2 ya da vulkan grafik desteği olan 64-bit x86_64 masaüstü linux. pixeldoro unity ile yapıldı; unity resmi olarak ubuntu 20.04 ve 22.04'ü destekliyor. senin dağıtımında açılmazsa <a href=\"mailto:hello@pixeldoro.io\">hello@pixeldoro.io</a> adresine yaz."
    - q: "flatpak, snap ya da appimage var mı?"
      a: "henüz yok. düz bir .tar.gz sürümü: arşivden çıkar ve çalıştır."
    - q: "arm'da çalışıyor mu?"
      a: "hayır, linux sürümü sadece x86_64. arm bir cihazdaysan onun yerine <a href=\"https://play.pixeldoro.io/web-beta\">tarayıcıda</a> oyna."
    - q: "pixeldoro nasıl güncellenir?"
      a: "bu sayfadan en son sürümü indir ve eski klasörün yerine koy."
    - q: "telefonumda aynı hesabı kullanabilir miyim?"
      a: "evet. iphone, android, mac ya da tarayıcıda aynı e-postayla giriş yap; ilerlemen, odan ve jetonların seninle gelir."
    - q: "windows ya da mac sürümü var mı?"
      a: "evet. bir <a href=\"{windows}\">windows uygulaması</a> var, mac sürümü de <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>'da."
  more: "dahası: <a href=\"{windows}\">windows için pixeldoro</a> · <a href=\"{pomodoro-timer}\">pomodoro zamanlayıcı</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">pixeldoro ana sayfa</a>"
