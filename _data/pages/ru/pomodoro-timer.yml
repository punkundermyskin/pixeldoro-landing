# Страница pomodoro-timer, русский. Ключи повторяют text из en/pomodoro-timer.yml.
text:
  title: "Эстетичный помодоро таймер: пиксель-арт и лофи | Pixeldoro"
  description: "Бесплатный эстетичный помодоро таймер в уютном пиксельном мире: 25/5, 45/15 или свое время, секундомер, лофи-радио, теги фокуса и статистика. Любое устройство."
  crumb: "помодоро таймер"
  eyebrow: "гайд pixeldoro"
  h1: "эстетичный помодоро-таймер в пиксельном мире"
  lead: "pixeldoro — бесплатный помодоро-таймер внутри уютного пиксельного городка. выбери пресет или задай свой, включи лофи-радио и смотри на дождь, пока работаешь. каждый помодоро приносит монеты, а часы копятся в статистике с разбивкой по задачам."
  facts:
    - "бесплатно · без рекламы"
    - "без подписки"
    - "iphone · mac · android · windows · linux · браузер · discord"
  shot_alt: "Экран таймера фокуса: пресеты 25/5, 45/15, 15/3, секундомер и свой вариант, таймер на 25:00 и цветные теги фокуса вроде экзаменов по математике, английского и физики"
  shot_caption: "выбери, над чем работаешь, и запусти помодоро."
  cards_title: "все, что нужно от помодоро-таймера"
  cards:
    - title: "пресеты или свое время"
      text: "25/5, 45/15, 15/3 или любая длина, какая хочешь. секундомер до 8 часов для долгой глубокой работы."
    - title: "встроенное лофи-радио"
      text: "шесть станций с лофи и спокойной музыкой, никаких плейлистов. пока ты в фокусе, накатывают дождь и туман."
    - title: "теги фокуса"
      text: "подписывай каждую сессию: экзамены, код, чтение. когда время вышло, звенит настоящий будильник, а когда перерыв закончился, приходит напоминание."
    - title: "статистика, которая растет"
      text: "смотри, куда уходят часы, с разбивкой по тегам, неделя за неделей. а еще каждая сессия приносит монеты для твоей комнаты."
  steps_title: "как пользоваться помодоро-таймером"
  steps:
    - title: "выбери длину"
      text: "25/5 — классика. 45/15 подходит для долгих учебных блоков, а 15/3 — чтобы раскачаться в вялый день."
    - title: "поставь тег и запускай"
      text: "выбери, над чем работаешь, и жми старт. все рядом видят твой таймер и задачу."
    - title: "отдохни"
      text: "когда зазвенит будильник, встань, потянись, погуляй по городу. pixeldoro напомнит, когда пора возвращаться к делам."
  prose_title: "что такое техника помодоро?"
  prose:
    - "техника помодоро делит работу на короткие блоки фокуса с перерывами между ними. классика — 25 минут фокуса и 5 минут перерыва, а после четырех кругов перерыв подлиннее. ее назвали в честь кухонного таймера в форме помидора, поэтому и маскот pixeldoro — помидор."
    - "она работает, потому что короткий блок легко начать, а перерыв, который вот-вот наступит, помогает не бросить. если 25 минут кажутся долгими, начни с меньшего. а если ты в потоке, включай секундомер и продолжай."
    - "нужен только таймер? <a href=\"{mini}\">pixeldoro mini</a> — минималистичная версия: таймер, пиксельные фоны, лофи и статистика. хочешь компанию, пока фокусируешься? тогда тебе сюда: <a href=\"{study-with-me}\">учись со мной</a>."
  faq:
    - q: "какое время помодоро лучше всего?"
      a: "классика — 25 минут фокуса и 5 минут перерыва. для глубокой работы многие выбирают 45/15 или 50/10, а в дни, когда мало сил, 15/3. попробуй несколько вариантов и оставь тот, что подходит."
    - q: "можно ли настроить свое время таймера?"
      a: "да. кроме пресетов 25/5, 45/15 и 15/3 можно задать свою длину или включить секундомер до 8 часов."
    - q: "таймер сообщит, когда сессия закончится?"
      a: "да. когда сессия фокуса заканчивается, pixeldoro звенит настоящим будильником, а когда перерыв подходит к концу, напоминает об этом."
    - q: "помодоро таймер бесплатный?"
      a: "да. таймер, радио, статистика и весь мир — бесплатно, без рекламы и без подписки."
    - q: "есть версия попроще?"
      a: "pixeldoro mini — это только таймер: пиксельные фоны, лофи и статистика, на iphone и android."
  more: "еще гайды: <a href=\"{study-with-me}\">учись со мной</a> · <a href=\"{adhd-focus-app}\">приложение для фокуса при сдвг</a> · <a href=\"{home}\">главная pixeldoro</a>"
