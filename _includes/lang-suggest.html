    <script>
        // Language: the first browser language we have a page for decides. If it isn't this page, offer it in a bar, once.
        // Picking a language or closing the bar stops the offer for good on this browser.
        (function () {
            var here = {{ page.lang | jsonify }};
            var pages = {
                {%- for l in site.data.languages %}
                {{ l.code | jsonify }}: { path: {{ l.path | append: include.file | jsonify }}, text: {{ site.data.i18n[l.code].nav.suggest | jsonify }}, lang: {{ l.html | jsonify }} }{% unless forloop.last %},{% endunless %}
                {%- endfor %}
            };
            var bar = document.querySelector('.lang-suggest');
            var KEY = 'pixeldoro-lang-chosen';

            function remember() { try { localStorage.setItem(KEY, '1'); } catch (e) {} }
            document.querySelectorAll('.lang-pop a, .footer-langs a').forEach(function (a) { a.addEventListener('click', remember); });
            bar.querySelector('button').addEventListener('click', function () { bar.hidden = true; remember(); });

            try { if (localStorage.getItem(KEY)) return; } catch (e) {}
            var wanted = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
            for (var i = 0; i < wanted.length; i++) {
                var w = String(wanted[i]).toLowerCase();
                var code = /^pt\b/.test(w) ? 'pt-br' : /^in\b/.test(w) ? 'id' : w.split('-')[0];
                if (!pages[code]) continue;
                if (code === here) return;
                var link = bar.querySelector('a');
                link.href = pages[code].path;
                link.textContent = pages[code].text;
                link.lang = pages[code].lang;
                link.addEventListener('click', remember);
                bar.hidden = false;
                return;
            }
        })();
    </script>
