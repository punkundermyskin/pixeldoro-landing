# La pagina linux, italiano. Rispecchia le chiavi "text" di en/linux.yml.
text:
  title: "Timer pomodoro per Linux, gratis e cozy | Pixeldoro"
  description: "Pixeldoro per Linux: timer pomodoro gratis in un mondo cozy in pixel art dove studi accanto a persone vere. Build nativa x86_64 con radio lofi e statistiche."
  crumb: "linux"
  eyebrow: "pixeldoro per linux"
  h1: "un timer pomodoro cozy che gira su linux"
  lead: "pixeldoro è un timer pomodoro gratuito dentro un mondo in pixel art, dove ti concentri accanto a persone vere che stanno studiando proprio ora. la versione per linux è una build nativa: la estrai, la avvii, e il timer e la radio lofi vanno avanti nella loro finestra."
  button: "scarica per linux"
  note: "gratis · 64 bit x86_64 · .tar.gz"
  others: "oppure gioca <a href=\"https://play.pixeldoro.io/web-beta\">nel browser</a>, o scaricalo per <a href=\"{windows}\">windows</a> · <a href=\"https://play.pixeldoro.io/macos\">mac</a>"
  on_computer: "hai un computer linux? apri questa pagina da lì per scaricarlo"
  facts:
    - "gratis · senza pubblicità"
    - "build nativa x86_64"
    - "un solo account su ogni dispositivo"
  shot_alt: "Una casa arredata con tre gatti e due amici in visita, ognuno con il proprio numero di pomodori e quello che sta studiando"
  shot_caption: "invita gli amici da te. i gatti abitano qui."
  cards_title: "perché scaricare l'app per linux"
  cards:
    - title: "una build nativa"
      text: "una vera build per linux, non una pagina web impacchettata. non si installa niente nel sistema: sta tutto in una cartella."
    - title: "radio lofi integrata"
      text: "sei stazioni lofi + chill, così non ti serve un'altra scheda con la musica. mentre ti concentri arrivano pioggia e nebbia."
    - title: "persone vere, proprio ora"
      text: "ogni personaggio nella stanza è una persona vera in una sessione di focus, con il suo timer e la sua attività sopra la testa."
    - title: "i tuoi progressi ovunque"
      text: "accedi con la tua email: stanza, monete e statistiche ti seguono sul telefono, sul portatile e nel browser."
  steps_title: "come installare pixeldoro su linux"
  steps:
    - title: "scaricalo"
      text: "clicca sul pulsante di download per scaricare pixeldoro come file .tar.gz."
    - title: "estrailo"
      text: "estrailo dove vuoi, dal file manager o con <code>tar -xzf pixeldoro-*.tar.gz</code>. ti ritrovi una cartella <code>pixeldoro</code>."
    - title: "avvialo"
      text: "apri la cartella e avvia <code>pixeldoro.x86_64</code>: con un doppio clic, o con <code>./pixeldoro.x86_64</code> da terminale. accedi con la tua email se giochi anche su altri dispositivi."
  prose_title: "meglio l'app o il browser?"
  prose:
    - "pixeldoro funziona anche in qualsiasi browser, senza installare niente. l'app per linux è per chi si concentra al computer tutti i giorni: ha la sua finestra, non si chiude insieme alle altre schede, e i browser rallentano le schede che non stai guardando."
    - "non conosci la tecnica? leggi la <a href=\"{pomodoro-timer}\">guida al timer pomodoro</a>, o scopri come <a href=\"{study-with-me}\">studiare accanto ad altre persone</a> ti aiuta a iniziare."
  faq:
    - q: "pixeldoro è gratis su linux?"
      a: "sì. il timer, il mondo, gli altri giocatori, gli amici e la radio sono tutti gratis, senza pubblicità e senza abbonamento. un pacchetto supporter facoltativo, a pagamento unico, aggiunge monete bonus e oggetti premium."
    - q: "su quali distro funziona?"
      a: "linux desktop a 64 bit x86_64 con grafica opengl 3.2 o vulkan. pixeldoro è fatto con unity, che supporta ufficialmente ubuntu 20.04 e 22.04. se sulla tua distro non parte, scrivi a <a href=\"mailto:hello@pixeldoro.io\">hello@pixeldoro.io</a>."
    - q: "c'è un flatpak, uno snap o un appimage?"
      a: "non ancora. è una semplice build .tar.gz: la estrai e la avvii."
    - q: "funziona su arm?"
      a: "no, la build per linux è solo x86_64. su un computer arm, gioca <a href=\"https://play.pixeldoro.io/web-beta\">nel browser</a>."
    - q: "come si aggiorna?"
      a: "scarica l'ultima build da questa pagina e sostituisci la vecchia cartella."
    - q: "posso usare lo stesso account sul telefono?"
      a: "sì. accedi con la stessa email su iphone, android, mac o nel browser e progressi, stanza e monete vengono con te."
    - q: "c'è una versione per windows o mac?"
      a: "sì. c'è una <a href=\"{windows}\">versione per windows</a>, e per mac è sul <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>."
  more: "altro: <a href=\"{windows}\">pixeldoro per windows</a> · <a href=\"{pomodoro-timer}\">timer pomodoro</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">home di pixeldoro</a>"
