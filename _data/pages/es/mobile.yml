# Página mobile, español de Latinoamérica.
text:
  title: "Pixeldoro en el celular"
  headline: "ahora también estudia en tu celular"
  shot_alt: "Pixeldoro en un celular: el campo lleno de gente estudiando, con el botón para iniciar el temporizador arriba"
  reasons:
    - title: "estudia donde sea"
      text: "el bus, el café, la biblioteca, la cama"
    - title: "todo se sincroniza"
      text: "misma cuenta, mismas monedas, mismo mundo"
    - title: "100 monedas en tu primer pomo"
      text: "solo por probarlo"
