# Página linux, español de Latinoamérica. Refleja las claves "text" de en/linux.yml.
text:
  title: "Temporizador pomodoro gratis para Linux | Pixeldoro"
  description: "Pixeldoro para Linux: temporizador pomodoro gratis en un mundo pixel acogedor donde estudias con gente real. Versión nativa x86_64, radio lofi y estadísticas."
  crumb: "linux"
  eyebrow: "pixeldoro para linux"
  h1: "un temporizador pomodoro acogedor que funciona en linux"
  lead: "pixeldoro es un temporizador pomodoro gratis dentro de un mundo de pixel art, donde te concentras junto a personas reales que están estudiando ahora mismo. la versión para linux es nativa: extráela, ejecútala, y el temporizador y la radio lofi siguen sonando en su propia ventana."
  button: "descargar para linux"
  note: "gratis · 64 bits x86_64 · .tar.gz"
  others: "o juega <a href=\"https://play.pixeldoro.io/web-beta\">en tu navegador</a>, o descárgalo para <a href=\"{windows}\">windows</a> · <a href=\"https://play.pixeldoro.io/macos\">mac</a>"
  on_computer: "¿estás en una computadora con linux? abre esta página ahí para descargarlo"
  facts:
    - "gratis · sin anuncios"
    - "versión nativa x86_64"
    - "una cuenta en todos tus dispositivos"
  shot_alt: "Una casa decorada con tres gatos como mascotas y dos amigos de visita, cada uno con su número de pomodoros y lo que está estudiando"
  shot_caption: "invita a tus amigos a casa. los gatos viven aquí."
  cards_title: "por qué usar la app de linux"
  cards:
    - title: "una versión nativa"
      text: "una versión para linux de verdad, no una página web metida en un contenedor. no se instala nada en todo el sistema: todo vive en una sola carpeta."
    - title: "radio lofi integrada"
      text: "seis estaciones de lofi + chill, así que no necesitas otra pestaña con música. mientras te concentras, llegan la lluvia y la neblina."
    - title: "personas reales, ahora mismo"
      text: "cada personaje en la sala es una persona real en una sesión de enfoque, con su temporizador y su tarea sobre la cabeza."
    - title: "tu progreso en todas partes"
      text: "inicia sesión con tu email y tu cuarto, tus monedas y tus estadísticas te siguen a tu celular, tu laptop y el navegador."
  steps_title: "cómo instalar pixeldoro en linux"
  steps:
    - title: "descárgalo"
      text: "haz clic en el botón de descarga para bajar pixeldoro como archivo .tar.gz."
    - title: "extráelo"
      text: "extráelo donde quieras, desde tu gestor de archivos o con <code>tar -xzf pixeldoro-*.tar.gz</code>. te queda una carpeta <code>pixeldoro</code>."
    - title: "ejecútalo"
      text: "abre la carpeta y ejecuta <code>pixeldoro.x86_64</code>: dale doble clic, o corre <code>./pixeldoro.x86_64</code> en una terminal. inicia sesión con tu email si también juegas en otros dispositivos."
  prose_title: "¿la app o el navegador?"
  prose:
    - "pixeldoro también funciona en cualquier navegador, sin instalar nada. la app de linux es para cuando te concentras en tu computadora todos los días: tiene su propia ventana, no se cierra junto con tus otras pestañas, y los navegadores frenan las pestañas que no estás viendo."
    - "¿no conoces la técnica? lee la <a href=\"{pomodoro-timer}\">guía del temporizador pomodoro</a>, o mira cómo <a href=\"{study-with-me}\">estudiar junto a otras personas</a> te ayuda a empezar."
  faq:
    - q: "¿pixeldoro es gratis en linux?"
      a: "sí. el temporizador, el mundo, los demás jugadores, los amigos y la radio son gratis, sin anuncios y sin suscripción. un paquete de patrocinador opcional de pago único agrega monedas extra y objetos premium."
    - q: "¿en qué distros funciona?"
      a: "linux de escritorio de 64 bits x86_64 con gráficos opengl 3.2 o vulkan. pixeldoro está hecho con unity, que tiene soporte oficial para ubuntu 20.04 y 22.04. si no arranca en tu distro, escribe a <a href=\"mailto:hello@pixeldoro.io\">hello@pixeldoro.io</a>."
    - q: "¿hay flatpak, snap o appimage?"
      a: "todavía no. es un .tar.gz simple: extráelo y ejecútalo."
    - q: "¿funciona en arm?"
      a: "no, la versión para linux es solo x86_64. en una máquina arm, mejor juega <a href=\"https://play.pixeldoro.io/web-beta\">en el navegador</a>."
    - q: "¿cómo lo actualizo?"
      a: "descarga la versión más reciente desde esta página y reemplaza la carpeta anterior."
    - q: "¿puedo usar la misma cuenta en mi celular?"
      a: "sí. inicia sesión con el mismo email en iphone, android, mac o el navegador, y tu progreso, tu cuarto y tus monedas te acompañan."
    - q: "¿hay versión para windows o mac?"
      a: "sí. hay una <a href=\"{windows}\">app para windows</a>, y la de mac está en el <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>."
  more: "más: <a href=\"{windows}\">pixeldoro para windows</a> · <a href=\"{pomodoro-timer}\">temporizador pomodoro</a> · <a href=\"{study-with-me}\">estudia conmigo</a> · <a href=\"{home}\">inicio de pixeldoro</a>"
