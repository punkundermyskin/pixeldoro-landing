# The pomodoro-timer page, English. Other languages mirror the text keys under "text"; "layout" is read from this file only.
# {windows}, {linux}, {home} and the other {page} placeholders become links to the same language's pages.
layout:
  kind: "guide"
  shot: "start-timer"
  icons:
    - "tomato"
    - "radio"
    - "folder"
    - "stats"
text:
  title: "Aesthetic pomodoro timer with pixel art and lofi | Pixeldoro"
  description: "A free aesthetic pomodoro timer in a cozy pixel art world: 25/5, 45/15 or custom sessions, a stopwatch, lofi radio, focus tags and stats. Any device."
  crumb: "pomodoro timer"
  eyebrow: "pixeldoro guide"
  h1: "an aesthetic pomodoro timer in a pixel art world"
  lead: "pixeldoro is a free pomodoro timer inside a cozy pixel town. pick a preset or set your own, put on the lofi radio and watch the rain while you work. every pomodoro earns coins, and your hours add up in stats split by what you worked on."
  facts:
    - "free · no ads"
    - "no subscription"
    - "iphone · mac · android · windows · linux · browser · discord"
  shot_alt: "Focus timer screen: 25/5, 45/15, 15/3, stopwatch and custom presets, a 25:00 timer and colored focus tags like math exams, english and physics"
  shot_caption: "pick what you're working on and start a pomodoro."
  cards_title: "everything a pomodoro timer needs"
  cards:
    - title: "presets or your own"
      text: "25/5, 45/15, 15/3 or any length you like. a stopwatch of up to 8 hours for long deep work."
    - title: "lofi radio built in"
      text: "six lofi and chill stations, no playlist to manage. rain and fog roll in while you focus."
    - title: "focus tags"
      text: "label each session: exams, coding, reading. a real alarm rings when it's done, and a nudge when the break is over."
    - title: "stats that add up"
      text: "see where your hours go, split by tag, week after week. every session also earns coins for your room."
  steps_title: "how to use the pomodoro timer"
  steps:
    - title: "choose a length"
      text: "25/5 is the classic. 45/15 suits long study blocks, and 15/3 is good for warming up on a slow day."
    - title: "tag it and start"
      text: "pick what you're working on and press start. everyone nearby sees your timer and your task."
    - title: "take the break"
      text: "when the alarm rings, stand up, stretch, look around town. pixeldoro reminds you when it's time to get back to it."
  prose_title: "what is the pomodoro technique?"
  prose:
    - "the pomodoro technique splits work into short, focused blocks with breaks in between. the classic version is 25 minutes of focus and a 5 minute break, with a longer break after four rounds. it was named after a tomato-shaped kitchen timer, which is why pixeldoro's mascot is a tomato."
    - "it works because a short block is easy to start, and a break that's always coming makes it easier to stay. if 25 minutes feels long, start shorter. if you're in the zone, use the stopwatch and keep going."
    - "just want the timer? <a href=\"{mini}\">pixeldoro mini</a> is the minimal version: a timer, pixel art backgrounds, lofi music and stats. want company while you focus? see <a href=\"{study-with-me}\">study with me</a>."
  faq:
    - q: "what is the best pomodoro length?"
      a: "25 minutes of focus and a 5 minute break is the classic. many people prefer 45/15 or 50/10 for deep work, and 15/3 on low-energy days. try a few and keep what works."
    - q: "can i set my own timer length?"
      a: "yes. along with the 25/5, 45/15 and 15/3 presets you can set a custom length, or use the stopwatch for up to 8 hours."
    - q: "will it tell me when the session ends?"
      a: "yes. pixeldoro rings a real alarm when your focus session ends and reminds you when your break is over."
    - q: "is the pomodoro timer free?"
      a: "yes. the timer, radio, stats and the whole world are free, with no ads and no subscription."
    - q: "is there a simpler version?"
      a: "pixeldoro mini is just the timer: pixel art backgrounds, lofi music and stats, on iphone and android."
  more: "more guides: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{adhd-focus-app}\">adhd focus app</a> · <a href=\"{home}\">pixeldoro home</a>"
