# windows sayfası, Türkçe. Anahtarlar en/windows.yml'deki "text" ile aynı.
text:
  title: "Windows için ücretsiz pomodoro sayacı | Pixeldoro"
  description: "Windows 10 ve 11 için Pixeldoro'yu indir: gerçek insanlarla ders çalıştığın cozy piksel dünyada ücretsiz pomodoro sayacı. Lofi radyo, istatistik, reklam yok."
  crumb: "windows"
  eyebrow: "windows için pixeldoro"
  h1: "windows bilgisayarın için sıcacık bir pomodoro zamanlayıcı"
  lead: "pixeldoro, piksel art bir dünyanın içinde ücretsiz bir pomodoro zamanlayıcı; burada şu an ders çalışan gerçek insanların yanında odaklanırsın. windows'ta kendi penceresi var, yani sen başka uygulamalarda çalışırken zamanlayıcı ve lofi radyo çalışmaya devam eder."
  button: "windows için indir"
  note: "ücretsiz · windows 10 ve 11 · 64-bit"
  others: "ya da <a href=\"https://play.pixeldoro.io/web-beta\">tarayıcında</a> oyna, veya <a href=\"https://play.pixeldoro.io/macos\">mac</a> · <a href=\"{linux}\">linux</a> için indir"
  on_computer: "windows bilgisayarın mı var? indirmek için bu sayfayı orada aç"
  facts:
    - "ücretsiz · reklam yok"
    - "windows 10 + 11"
    - "her cihazda tek hesap"
  shot_alt: "Topluluk panelindeki arkadaş listesi: her arkadaşın avatarı, neye odaklandığı, hangi odada olduğu ve pomodoro sayısı; yanında ders çalışan insanlarla dolu bir kafe"
  shot_caption: "arkadaşlarının neye ve nerede odaklandığını gör."
  cards_title: "neden windows uygulaması"
  cards:
    - title: "arka planda çalışmaya devam eder"
      text: "küçült ya da işine dön. zamanlayıcı ve radyo çalmaya devam eder, uygulama bir alt+tab uzağında."
    - title: "içinde lofi radyo"
      text: "altı lofi + chill istasyon, müzik için ayrı bir sekmeye gerek yok. sen odaklanırken yağmur yağar, sis çöker."
    - title: "gerçek insanlar, şu an"
      text: "odadaki her karakter, odak seansındaki gerçek bir insan; zamanlayıcısı ve görevi başının üstünde."
    - title: "ilerlemen her yerde"
      text: "e-postanla giriş yap; odan, jetonların ve istatistiklerin telefonuna, mac'ine ve tarayıcıya seninle gelir."
  steps_title: "pixeldoro windows'a nasıl kurulur"
  steps:
    - title: "kurulum dosyasını indir"
      text: "pixeldoro kurulum dosyasını almak için indirme düğmesine tıkla."
    - title: "çalıştır"
      text: "dosyayı aç ve kurulum adımlarını izle. windows “Windows kişisel bilgisayarınızı korudu” derse önce <b>ek bilgi</b>, sonra <b>yine de çalıştır</b> düğmesine tıkla."
    - title: "giriş yap ve odaklan"
      text: "pixeldoro'yu aç, başka cihazlarda da oynuyorsan e-postanla giriş yap, bir oda seç ve bir pomodoro başlat."
  prose_title: "uygulama mı, tarayıcı mı?"
  prose:
    - "pixeldoro her tarayıcıda da çalışır, kurulum gerekmez. windows uygulaması her gün bilgisayar başında odaklananlar için: kendi penceresi ve görev çubuğu simgesi var, diğer sekmelerinle birlikte yanlışlıkla kapanmaz, üstelik tarayıcılar bakmadığın sekmeleri yavaşlatır."
    - "teknikte yeni misin? <a href=\"{pomodoro-timer}\">pomodoro zamanlayıcı rehberini</a> oku ya da <a href=\"{study-with-me}\">başkalarının yanında ders çalışmanın</a> başlamana nasıl yardım ettiğine bak."
  faq:
    - q: "pixeldoro windows'ta ücretsiz mi?"
      a: "evet. zamanlayıcı, dünya, diğer oyuncular, arkadaşlar ve radyo tamamen ücretsiz; reklam yok, abonelik yok. istersen tek seferlik bir destekçi paketi bonus jeton ve premium eşyalar ekler."
    - q: "pixeldoro hangi windows sürümlerinde çalışır?"
      a: "64-bit windows 10 ve windows 11."
    - q: "windows “kişisel bilgisayarınızı korudu” uyarısı neden çıkıyor?"
      a: "bu bir smartscreen uyarısı. ücretli kod imzalama sertifikası olmayan küçük geliştiricilerin uygulamalarında çıkar. önce <b>ek bilgi</b>, sonra <b>yine de çalıştır</b> düğmesine tıkla."
    - q: "küçültünce zamanlayıcı çalışmaya devam ediyor mu?"
      a: "evet. pencere küçültülmüşken ya da diğer uygulamaların arkasındayken zamanlayıcı ve radyo çalışmaya devam eder."
    - q: "pixeldoro nasıl güncellenir?"
      a: "bu sayfadan en son kurulum dosyasını indir ve çalıştır."
    - q: "telefonumda aynı hesabı kullanabilir miyim?"
      a: "evet. iphone, android, mac ya da tarayıcıda aynı e-postayla giriş yap; ilerlemen, odan ve jetonların seninle gelir."
    - q: "mac ya da linux sürümü var mı?"
      a: "evet. mac sürümü <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>'da, bir de <a href=\"{linux}\">linux sürümü</a> var."
  more: "dahası: <a href=\"{linux}\">linux için pixeldoro</a> · <a href=\"{pomodoro-timer}\">pomodoro zamanlayıcı</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">pixeldoro ana sayfa</a>"
