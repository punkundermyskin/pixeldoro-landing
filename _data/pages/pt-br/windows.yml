# A página windows, português do Brasil. Mesmas chaves de "text" do en/windows.yml.
text:
  title: "Pomodoro para Windows: timer grátis no PC | Pixeldoro"
  description: "Baixe o Pixeldoro para Windows 10 e 11: um timer pomodoro grátis num mundo cozy em pixel art, com gente real estudando. Rádio lofi, estatísticas, sem anúncios."
  crumb: "windows"
  eyebrow: "pixeldoro para windows"
  h1: "um timer pomodoro cozy para o seu pc com windows"
  lead: "o pixeldoro é um timer pomodoro grátis dentro de um mundo em pixel art, onde você foca ao lado de gente de verdade que está estudando agora. no windows ele ganha uma janela só dele, então o timer e a rádio lofi continuam rolando enquanto você trabalha em outros apps."
  button: "baixar para windows"
  note: "grátis · windows 10 e 11 · 64 bits"
  others: "ou jogue <a href=\"https://play.pixeldoro.io/web-beta\">no navegador</a>, ou baixe para <a href=\"https://play.pixeldoro.io/macos\">mac</a> · <a href=\"{linux}\">linux</a>"
  on_computer: "tem um pc com windows? abra esta página nele pra baixar"
  facts:
    - "grátis · sem anúncios"
    - "windows 10 + 11"
    - "uma conta em todos os dispositivos"
  shot_alt: "Lista de amigos na comunidade: o avatar de cada amigo, no que está focando, em qual sala está e seu número de pomodoros, ao lado de um café cheio de gente estudando"
  shot_caption: "veja no que seus amigos estão focando, e onde."
  cards_title: "por que baixar o app para windows"
  cards:
    - title: "continua rodando em segundo plano"
      text: "minimize ou volte pro seu trabalho. o timer e a rádio continuam rolando, e o app fica a um alt+tab de distância."
    - title: "rádio lofi integrada"
      text: "seis estações lofi + chill, então não precisa de outra aba tocando música. chuva e neblina chegam enquanto você foca."
    - title: "gente de verdade, agora mesmo"
      text: "cada personagem na sala é uma pessoa real numa sessão de foco, com o timer e a tarefa em cima da cabeça."
    - title: "seu progresso em todo lugar"
      text: "entre com seu e-mail e seu quarto, suas moedas e suas estatísticas te acompanham no celular, no mac e no navegador."
  steps_title: "como instalar o pixeldoro no windows"
  steps:
    - title: "baixe o instalador"
      text: "clique no botão de download pra baixar o instalador do pixeldoro."
    - title: "execute"
      text: "abra o arquivo e siga o instalador. se o windows disser “o windows protegeu o computador”, clique em <b>mais informações</b> e depois em <b>executar assim mesmo</b>."
    - title: "entre e foque"
      text: "abra o pixeldoro, entre com seu e-mail se você joga em outros dispositivos também, escolha uma sala e comece um pomodoro."
  prose_title: "app ou navegador?"
  prose:
    - "o pixeldoro também roda em qualquer navegador, sem instalar nada. o app para windows é pra quem foca no pc todo dia: ele tem janela própria e ícone na barra de tarefas, não fecha junto com as outras abas, e os navegadores deixam lentas as abas que você não está olhando."
    - "novo na técnica? leia o <a href=\"{pomodoro-timer}\">guia do timer pomodoro</a>, ou veja como <a href=\"{study-with-me}\">estudar ao lado de outras pessoas</a> te ajuda a começar."
  faq:
    - q: "o pixeldoro é grátis no windows?"
      a: "sim. o timer, o mundo, os outros jogadores, os amigos e a rádio são todos grátis, sem anúncios e sem assinatura. um pacote de apoiador opcional, com pagamento único, dá moedas bônus e itens premium."
    - q: "em quais versões do windows ele roda?"
      a: "windows 10 e windows 11, 64 bits."
    - q: "por que o windows diz que protegeu o computador?"
      a: "é o smartscreen. ele aparece em apps de desenvolvedores pequenos que não têm um certificado de assinatura de código pago. clique em <b>mais informações</b> e depois em <b>executar assim mesmo</b>."
    - q: "o timer continua rodando se eu minimizar?"
      a: "sim. o timer e a rádio continuam rolando com a janela minimizada ou atrás de outros apps."
    - q: "como atualizar o pixeldoro?"
      a: "baixe o instalador mais recente nesta página e execute."
    - q: "dá pra usar a mesma conta no celular?"
      a: "sim. entre com o mesmo e-mail no iphone, android, mac ou no navegador e seu progresso, seu quarto e suas moedas vão junto."
    - q: "tem versão para mac ou linux?"
      a: "sim. o mac está na <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>, e tem uma <a href=\"{linux}\">versão para linux</a> também."
  more: "mais: <a href=\"{linux}\">pixeldoro para linux</a> · <a href=\"{pomodoro-timer}\">timer pomodoro</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">página inicial do pixeldoro</a>"
