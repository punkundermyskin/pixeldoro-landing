text:
  title: "DEHB için odaklanma uygulaması ve body doubling | Pixeldoro"
  description: "DEHB'li beyinler için ücretsiz odaklanma uygulaması: gerçek insanlarla body doubling, her seansa jeton, kısa seanslar ve bir hikâye. Kamerasız, reklamsız."
  crumb: "dehb odak uygulaması"
  eyebrow: "pixeldoro rehberi"
  h1: "dehb'li beyinler için bir odaklanma uygulaması"
  lead: "sıradan zamanlayıcıları görmezden gelmek kolay. pixeldoro odaklanmayı başkalarıyla paylaştığın bir oyuna çeviriyor: etrafında odaklanan gerçek insanlar başlamana yardım eder, her seans karşılığını hemen verir, hikâye de yarın geri dönmen için bir sebep olur."
  facts:
    - "ücretsiz · reklam yok"
    - "abonelik yok"
    - "iphone · mac · android · windows · linux · tarayıcı · discord"
  shot_alt: "Biten bir odak seansının ardından ödül ekranı: odağın biraz ganimet getirdi, 30 jeton, al"
  shot_caption: "her pomodoro karşılığını hemen verir."
  cards_title: "zamanlayıcıyı duymazdan gelen beyinler için"
  cards:
    - title: "içinde body doubling var"
      text: "etrafında odaklanan gerçek insanlar başlamayı kolaylaştırır. kamera yok, görüntülü arama yok, randevu yok."
    - title: "anında ödül"
      text: "her pomodoro jeton kazandırır. onları mobilyaya, odalara, kıyafetlere ve evcil hayvanlara harca."
    - title: "kısa seanslar da sayılır"
      text: "25 dakikanın fazla geldiği günler için 15/3 hazır ayarı, hiperodak devreye girdiğinde de kronometre."
    - title: "geri dönmek için bir sebep"
      text: "hikâye, günlük ve haftalık görevler, haftalık topluluk meydan okuması ve birikmeye devam eden istatistikler."
  steps_title: "başlamak en zor kısımsa nasıl başlanır"
  steps:
    - title: "sadece aç"
      text: "bir plana ihtiyacın yok. pixeldoro'yu aç ve insanların zaten çalıştığı bir odaya otur."
    - title: "küçük bir şey seç"
      text: "etiketle ve kısa bir seans başlat. 15 dakika da gerçek bir pomodoro."
    - title: "jetonlarını topla"
      text: "ödülünü al, molanı ver, bir tur daha isteyip istemediğine bak."
  prose_title: "body doubling nedir?"
  prose:
    - "body doubling, yanında başka biri varken çalışmak demek. dehb'si olan birçok kişi, o kişi kendi işiyle meşgul olsa bile, yanında biri varken başlamayı ve işte kalmayı çok daha kolay buluyor."
    - "pixeldoro bunu ne zaman ihtiyacın olursa sana veriyor. her odadaki insanlar gerçek ve şu an odaklanıyor; zamanlayıcıları ve görevleri görünüyor. kamera, program ya da seni izleyen bir yabancı olmadan o arkadaşlığı yaşıyorsun. devamı <a href=\"{study-with-me}\">study with me</a> sayfasında."
    - "pixeldoro tıbbi bir araç ya da dehb tedavisi değil. sadece işe koyulmanın daha sıcacık bir yolu."
  quotes_title: "yorumlardan"
  faq:
    - q: "pixeldoro dehb için iyi mi?"
      a: "sıradan bir zamanlayıcıdan hemen kopan beyinler için yapıldı. sırf geldiğin için seni ödüllendirir, etrafında odaklanan diğer insanlar başlamana yardım eder, hikâye de geri dönmen için bir sebep verir. tıbbi bir araç değil, sadece işe koyulmanın daha sıcacık bir yolu."
    - q: "body doubling nedir?"
      a: "başlamak ve devam etmek kolaylaşsın diye başka birinin yanında çalışmak. pixeldoro'da etrafındaki insanlar gerçek ve şu an odaklanıyor; kamera ya da görüntülü arama yok."
    - q: "25 dakika odaklanamıyorsam ne yapmalıyım?"
      a: "15/3 hazır ayarını kullan ya da kendi süreni belirle. kısa bir seans da jeton kazandırır ve görevlere sayılır."
    - q: "dikkat dağıtan uygulamaları engelliyor mu?"
      a: "henüz değil. odak etiketleriyle her seansı etiketleyebilirsin, istatistiklerin de zamanını etikete göre ayırır. uygulama engelleme listemizde."
    - q: "ücretsiz mi?"
      a: "evet. reklam yok, abonelik yok. istersen tek seferlik bir destekçi paketi bonus jeton ve premium eşyalar ekler."
  more: "diğer rehberler: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{pomodoro-timer}\">pomodoro zamanlayıcı</a> · <a href=\"{home}\">pixeldoro ana sayfa</a>"
