# La pagina windows, italiano. Rispecchia le chiavi "text" di en/windows.yml.
text:
  title: "Timer pomodoro gratis per PC Windows | Pixeldoro"
  description: "Scarica Pixeldoro per Windows 10 e 11: timer pomodoro gratis in un mondo in pixel art dove studi con persone vere. Radio lofi, statistiche, zero pubblicità."
  crumb: "windows"
  eyebrow: "pixeldoro per windows"
  h1: "un timer pomodoro cozy per il tuo pc windows"
  lead: "pixeldoro è un timer pomodoro gratuito dentro un mondo in pixel art, dove ti concentri accanto a persone vere che stanno studiando proprio ora. su windows ha la sua finestra, così il timer e la radio lofi vanno avanti mentre lavori in altre app."
  button: "scarica per windows"
  note: "gratis · windows 10 e 11 · 64 bit"
  others: "oppure gioca <a href=\"https://play.pixeldoro.io/web-beta\">nel browser</a>, o scaricalo per <a href=\"https://play.pixeldoro.io/macos\">mac</a> · <a href=\"{linux}\">linux</a>"
  on_computer: "hai un pc windows? apri questa pagina da lì per scaricarlo"
  facts:
    - "gratis · senza pubblicità"
    - "windows 10 + 11"
    - "un solo account su ogni dispositivo"
  shot_alt: "Lista degli amici nella community: l'avatar di ogni amico, su cosa si sta concentrando, in quale stanza si trova e quanti pomodori ha fatto, accanto a un caffè pieno di gente che studia"
  shot_caption: "guarda su cosa si concentrano i tuoi amici, e dove."
  cards_title: "perché scaricare l'app per windows"
  cards:
    - title: "resta attiva in background"
      text: "riducila a icona o passa al tuo lavoro. il timer e la radio vanno avanti, e l'app è a un alt+tab di distanza."
    - title: "radio lofi integrata"
      text: "sei stazioni lofi + chill, così non ti serve un'altra scheda con la musica. mentre ti concentri arrivano pioggia e nebbia."
    - title: "persone vere, proprio ora"
      text: "ogni personaggio nella stanza è una persona vera in una sessione di focus, con il suo timer e la sua attività sopra la testa."
    - title: "i tuoi progressi ovunque"
      text: "accedi con la tua email: stanza, monete e statistiche ti seguono sul telefono, sul mac e nel browser."
  steps_title: "come installare pixeldoro su windows"
  steps:
    - title: "scarica l'installer"
      text: "clicca sul pulsante di download per scaricare il file di installazione di pixeldoro."
    - title: "avvialo"
      text: "apri il file e segui l'installazione. se windows dice “PC protetto da Windows”, clicca <b>ulteriori informazioni</b>, poi <b>esegui comunque</b>."
    - title: "accedi e concentrati"
      text: "apri pixeldoro, accedi con la tua email se giochi anche su altri dispositivi, scegli una stanza e avvia un pomodoro."
  prose_title: "meglio l'app o il browser?"
  prose:
    - "pixeldoro funziona anche in qualsiasi browser, senza installare niente. l'app per windows è per chi si concentra al pc tutti i giorni: ha la sua finestra e la sua icona sulla barra delle applicazioni, non si chiude insieme alle altre schede, e i browser rallentano le schede che non stai guardando."
    - "non conosci la tecnica? leggi la <a href=\"{pomodoro-timer}\">guida al timer pomodoro</a>, o scopri come <a href=\"{study-with-me}\">studiare accanto ad altre persone</a> ti aiuta a iniziare."
  faq:
    - q: "pixeldoro è gratis su windows?"
      a: "sì. il timer, il mondo, gli altri giocatori, gli amici e la radio sono tutti gratis, senza pubblicità e senza abbonamento. un pacchetto supporter facoltativo, a pagamento unico, aggiunge monete bonus e oggetti premium."
    - q: "su quali versioni di windows funziona?"
      a: "windows 10 e windows 11 a 64 bit."
    - q: "perché windows dice che ha protetto il mio pc?"
      a: "è smartscreen. compare con le app dei piccoli sviluppatori che non hanno un certificato di firma del codice a pagamento. clicca <b>ulteriori informazioni</b>, poi <b>esegui comunque</b>."
    - q: "il timer va avanti se riduco a icona la finestra?"
      a: "sì. il timer e la radio vanno avanti anche quando la finestra è ridotta a icona o dietro altre app."
    - q: "come si aggiorna?"
      a: "scarica l'ultimo installer da questa pagina e avvialo."
    - q: "posso usare lo stesso account sul telefono?"
      a: "sì. accedi con la stessa email su iphone, android, mac o nel browser e progressi, stanza e monete vengono con te."
    - q: "c'è una versione per mac o linux?"
      a: "sì. per mac è sul <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>, e c'è anche una <a href=\"{linux}\">versione per linux</a>."
  more: "altro: <a href=\"{linux}\">pixeldoro per linux</a> · <a href=\"{pomodoro-timer}\">timer pomodoro</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">home di pixeldoro</a>"
