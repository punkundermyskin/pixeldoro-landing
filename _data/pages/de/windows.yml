# Die windows-Seite, Deutsch. Spiegelt die Schlüssel unter "text" aus en/windows.yml.
text:
  title: "Kostenloser Pomodoro Timer für Windows PC | Pixeldoro"
  description: "Pixeldoro für Windows 10 & 11: kostenloser Pomodoro Timer in einer cozy Pixel-Welt, in der du neben echten Menschen lernst. Lofi-Radio, Statistik, ohne Werbung."
  crumb: "windows"
  eyebrow: "pixeldoro für windows"
  h1: "ein gemütlicher pomodoro-timer für deinen windows-pc"
  lead: "pixeldoro ist ein kostenloser pomodoro-timer in einer pixel-art-welt, in der du dich neben echten menschen fokussierst, die genau jetzt lernen. unter windows bekommt es sein eigenes fenster, timer und lofi-radio laufen also weiter, während du in anderen apps arbeitest."
  button: "für windows herunterladen"
  note: "kostenlos · windows 10 und 11 · 64-bit"
  others: "oder spiel <a href=\"https://play.pixeldoro.io/web-beta\">im browser</a>, oder hol es dir für <a href=\"https://play.pixeldoro.io/macos\">mac</a> · <a href=\"{linux}\">linux</a>"
  on_computer: "du hast einen windows-computer? mach diese seite dort auf, um es herunterzuladen"
  facts:
    - "kostenlos · ohne werbung"
    - "windows 10 + 11"
    - "ein konto auf jedem gerät"
  shot_alt: "Freundesliste im Treffpunkt: der Avatar jedes Freundes, worauf er sich gerade fokussiert, in welchem Raum er ist und seine Pomodoro-Zahl, daneben ein Café voller lernender Leute"
  shot_caption: "sieh, worauf sich deine freunde gerade fokussieren und wo."
  cards_title: "warum die windows-app"
  cards:
    - title: "läuft im hintergrund weiter"
      text: "minimier es oder wechsel zu deiner arbeit. timer und radio laufen weiter, und die app ist nur ein alt+tab entfernt."
    - title: "lofi-radio eingebaut"
      text: "sechs lofi- und chill-sender, du brauchst also keinen extra tab für musik. regen und nebel ziehen auf, während du dich fokussierst."
    - title: "echte menschen, genau jetzt"
      text: "jede figur im raum ist ein echter mensch in einer fokus-session, mit timer und aufgabe über dem kopf."
    - title: "dein fortschritt überall"
      text: "melde dich mit deiner e-mail an, und dein zimmer, deine münzen und deine statistik begleiten dich aufs handy, auf den mac und in den browser."
  steps_title: "so installierst du pixeldoro unter windows"
  steps:
    - title: "lad den installer herunter"
      text: "klick auf den download-button, um die setup-datei von pixeldoro zu bekommen."
    - title: "führ ihn aus"
      text: "öffne die datei und folg dem installer. wenn windows „der computer wurde durch windows geschützt“ anzeigt, klick auf <b>weitere informationen</b> und dann auf <b>trotzdem ausführen</b>."
    - title: "anmelden und fokussieren"
      text: "öffne pixeldoro, melde dich mit deiner e-mail an, falls du auch auf anderen geräten spielst, such dir einen raum aus und starte einen pomodoro."
  prose_title: "app oder browser?"
  prose:
    - "pixeldoro läuft auch in jedem browser, ohne installation. die windows-app ist für dich, wenn du jeden tag am pc lernst oder arbeitest: sie hat ihr eigenes fenster und taskleisten-symbol, wird nicht mit deinen anderen tabs zugemacht, und browser bremsen tabs aus, die du gerade nicht anschaust."
    - "neu bei der technik? lies den <a href=\"{pomodoro-timer}\">ratgeber zum pomodoro-timer</a>, oder schau, wie dir <a href=\"{study-with-me}\">lernen neben anderen</a> beim anfangen hilft."
  faq:
    - q: "ist pixeldoro für windows kostenlos?"
      a: "ja. timer, welt, andere spieler, freunde und radio sind komplett kostenlos, ohne werbung und ohne abo. ein optionales supporter-paket als einmalkauf bringt extra-münzen und premium-items."
    - q: "auf welchen windows-versionen läuft pixeldoro?"
      a: "windows 10 und windows 11, jeweils 64-bit."
    - q: "windows sagt „der computer wurde durch windows geschützt“, was tun?"
      a: "das ist smartscreen. die meldung erscheint bei apps von kleinen entwicklern ohne kostenpflichtiges code-signing-zertifikat. klick auf <b>weitere informationen</b> und dann auf <b>trotzdem ausführen</b>."
    - q: "läuft der timer weiter, wenn ich das fenster minimiere?"
      a: "ja. timer und radio laufen weiter, während das fenster minimiert ist oder hinter anderen apps liegt."
    - q: "wie aktualisiere ich pixeldoro?"
      a: "lad den neuesten installer von dieser seite herunter und führ ihn aus."
    - q: "kann ich dasselbe konto auf dem handy nutzen?"
      a: "ja. melde dich mit derselben e-mail auf iphone, android, mac oder im browser an, und dein fortschritt, dein zimmer und deine münzen kommen mit."
    - q: "gibt es eine version für mac oder linux?"
      a: "ja. für mac gibt es pixeldoro im <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>, und es gibt auch eine <a href=\"{linux}\">linux-version</a>."
  more: "mehr: <a href=\"{linux}\">pixeldoro für linux</a> · <a href=\"{pomodoro-timer}\">pomodoro-timer</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">pixeldoro-startseite</a>"
