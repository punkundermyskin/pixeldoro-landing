# La pagina pomodoro-timer, italiano. Rispecchia le chiavi "text" di en/pomodoro-timer.yml.
text:
  title: "Timer pomodoro aesthetic con pixel art e lofi | Pixeldoro"
  description: "Timer pomodoro aesthetic e gratis in un mondo cozy in pixel art: sessioni 25/5, 45/15 o personalizzate, cronometro, radio lofi, tag e statistiche. Ovunque."
  crumb: "timer pomodoro"
  eyebrow: "guida pixeldoro"
  h1: "un timer pomodoro aesthetic in un mondo in pixel art"
  lead: "pixeldoro è un timer pomodoro gratuito dentro una cittadina cozy in pixel art. scegli un preset o impostane uno tuo, metti la radio lofi e guarda la pioggia mentre lavori. ogni pomodoro ti fa guadagnare monete, e le tue ore si sommano nelle statistiche, divise per quello su cui hai lavorato."
  facts:
    - "gratis · senza pubblicità"
    - "senza abbonamento"
    - "iphone · mac · android · windows · linux · browser · discord"
  shot_alt: "Schermata del timer: preset 25/5, 45/15, 15/3, cronometro e personalizzato, un timer da 25:00 e tag di focus colorati come esami di matematica, inglese e fisica"
  shot_caption: "scegli su cosa lavori e avvia un pomodoro."
  cards_title: "tutto quello che serve a un timer pomodoro"
  cards:
    - title: "preset o su misura"
      text: "25/5, 45/15, 15/3 o la durata che vuoi. un cronometro fino a 8 ore per le sessioni lunghe di lavoro profondo."
    - title: "radio lofi integrata"
      text: "sei stazioni lofi e chill, nessuna playlist da gestire. mentre ti concentri arrivano pioggia e nebbia."
    - title: "tag di focus"
      text: "dai un'etichetta a ogni sessione: esami, coding, lettura. quando hai finito suona una vera sveglia, e un promemoria ti avvisa quando la pausa è finita."
    - title: "statistiche che crescono"
      text: "scopri dove vanno le tue ore, divise per tag, settimana dopo settimana. ogni sessione ti fa guadagnare anche monete per la tua stanza."
  steps_title: "come usare il timer pomodoro"
  steps:
    - title: "scegli la durata"
      text: "25/5 è il classico. 45/15 va bene per i blocchi di studio lunghi, e 15/3 è perfetto per scaldarti nelle giornate fiacche."
    - title: "dagli un tag e parti"
      text: "scegli su cosa lavori e premi avvia. chi ti sta vicino vede il tuo timer e la tua attività."
    - title: "fai la pausa"
      text: "quando suona la sveglia, alzati, sgranchisciti, fai un giro per la città. pixeldoro ti avvisa quando è ora di rimetterti sotto."
  prose_title: "cos'è la tecnica del pomodoro?"
  prose:
    - "la tecnica del pomodoro divide il lavoro in blocchi brevi e concentrati, con delle pause in mezzo. la versione classica prevede 25 minuti di focus e 5 minuti di pausa, con una pausa più lunga dopo quattro giri. prende il nome da un timer da cucina a forma di pomodoro, ed è per questo che la mascotte di pixeldoro è un pomodoro."
    - "funziona perché un blocco breve è facile da iniziare, e sapere che la pausa sta arrivando ti aiuta a restare. se 25 minuti ti sembrano tanti, parti con meno. se sei in pieno flow, usa il cronometro e vai avanti."
    - "vuoi solo il timer? <a href=\"{mini}\">pixeldoro mini</a> è la versione minimal: un timer, sfondi in pixel art, musica lofi e statistiche. vuoi un po' di compagnia mentre ti concentri? dai un'occhiata a <a href=\"{study-with-me}\">study with me</a>."
  faq:
    - q: "qual è la durata migliore per un pomodoro?"
      a: "25 minuti di focus e 5 di pausa è il classico. tanti preferiscono 45/15 o 50/10 per il lavoro profondo, e 15/3 nei giorni con poca energia. provane qualcuno e tieni quello che funziona."
    - q: "posso impostare la durata del timer?"
      a: "sì. oltre ai preset 25/5, 45/15 e 15/3 puoi impostare una durata personalizzata, o usare il cronometro fino a 8 ore."
    - q: "mi avvisa quando finisce la sessione?"
      a: "sì. pixeldoro suona una vera sveglia quando finisce la tua sessione di focus e ti avvisa quando la pausa è finita."
    - q: "il timer pomodoro è gratis?"
      a: "sì. il timer, la radio, le statistiche e tutto il mondo sono gratis, senza pubblicità e senza abbonamento."
    - q: "c'è una versione più semplice?"
      a: "pixeldoro mini è solo il timer: sfondi in pixel art, musica lofi e statistiche, su iphone e android."
  more: "altre guide: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{adhd-focus-app}\">app per l'adhd</a> · <a href=\"{home}\">home di pixeldoro</a>"
