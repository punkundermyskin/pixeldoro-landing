# The windows page, English. Other languages mirror the text keys under "text"; "layout" is read from this file only.
# {windows}, {linux}, {home} and the other {page} placeholders become links to the same language's pages.
layout:
  kind: "download"
  shot: "friends"
  icons:
    - "tomato"
    - "radio"
    - "folder"
    - "stats"
  download: "https://github.com/pixeldoro/desktop/releases/latest/download/pixeldoro-setup.exe"
text:
  title: "Free pomodoro timer for Windows PC | Pixeldoro"
  description: "Download Pixeldoro for Windows 10 and 11: a free pomodoro timer in a cozy pixel world where you study next to real people. Lofi radio, stats, no ads."
  crumb: "windows"
  eyebrow: "pixeldoro for windows"
  h1: "a cozy pomodoro timer for your windows pc"
  lead: "pixeldoro is a free pomodoro timer inside a pixel art world, where you focus next to real people who are studying right now. on windows it gets its own window, so the timer and the lofi radio keep going while you work in other apps."
  button: "download for windows"
  note: "free · windows 10 and 11 · 64-bit"
  others: "or play <a href=\"https://play.pixeldoro.io/web-beta\">in your browser</a>, or get it for <a href=\"https://play.pixeldoro.io/macos\">mac</a> · <a href=\"{linux}\">linux</a>"
  on_computer: "on a windows computer? open this page there to download"
  facts:
    - "free · no ads"
    - "windows 10 + 11"
    - "one account on every device"
  shot_alt: "Social hub friends list: each friend's avatar, what they're focusing on, which room they're in and their pomodoro count, next to a cafe full of people studying"
  shot_caption: "see what your friends are focusing on, and where."
  cards_title: "why get the windows app"
  cards:
    - title: "keeps running in the background"
      text: "minimize it or switch to your work. the timer and the radio keep going, and the app is one alt+tab away."
    - title: "lofi radio built in"
      text: "six lofi + chill stations, so there's no other tab playing music. rain and fog roll in while you focus."
    - title: "real people, right now"
      text: "every character in the room is a real person in a focus session, with their timer and task above their head."
    - title: "your progress everywhere"
      text: "sign in with your email and your room, coins and stats follow you to your phone, your mac and the browser."
  steps_title: "how to install pixeldoro on windows"
  steps:
    - title: "download the installer"
      text: "click the download button to get the pixeldoro setup file."
    - title: "run it"
      text: "open the file and follow the installer. if windows says “windows protected your pc”, click <b>more info</b>, then <b>run anyway</b>."
    - title: "sign in and focus"
      text: "open pixeldoro, sign in with your email if you play on other devices too, pick a room and start a pomodoro."
  prose_title: "the app or the browser?"
  prose:
    - "pixeldoro also runs in any browser, nothing to install. the windows app is for when you focus at your pc every day: it has its own window and taskbar icon, it won't get closed with your other tabs, and browsers slow down tabs you aren't looking at."
    - "new to the technique? read the <a href=\"{pomodoro-timer}\">pomodoro timer guide</a>, or see how <a href=\"{study-with-me}\">studying next to other people</a> helps you start."
  faq:
    - q: "is pixeldoro free on windows?"
      a: "yes. the timer, the world, other players, friends and radio are all free, with no ads and no subscription. an optional one-time supporter pack adds bonus coins and premium items."
    - q: "which versions of windows does it run on?"
      a: "64-bit windows 10 and windows 11."
    - q: "why does windows say it protected my pc?"
      a: "that's smartscreen. it shows up for apps from small developers that don't have a paid code-signing certificate. click <b>more info</b>, then <b>run anyway</b>."
    - q: "does the timer keep running when i minimize it?"
      a: "yes. the timer and the radio keep going while the window is minimized or behind other apps."
    - q: "how do i update it?"
      a: "download the latest installer from this page and run it."
    - q: "can i use the same account on my phone?"
      a: "yes. sign in with the same email on iphone, android, mac or the browser and your progress, room and coins come with you."
    - q: "is there a mac or linux version?"
      a: "yes. mac is on the <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>, and there's a <a href=\"{linux}\">linux build</a> too."
  more: "more: <a href=\"{linux}\">pixeldoro for linux</a> · <a href=\"{pomodoro-timer}\">pomodoro timer</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">pixeldoro home</a>"
