# Página adhd-focus-app, español de Latinoamérica. Refleja las claves "text" de en/adhd-focus-app.yml.
text:
  title: "App para concentrarse con TDAH y body doubling | Pixeldoro"
  description: "App de enfoque gratis para cerebros con TDAH: body doubling con personas reales, monedas por sesión, temporizadores cortos y una historia. Sin cámara ni anuncios."
  crumb: "app de enfoque para tdah"
  eyebrow: "guía de pixeldoro"
  h1: "una app de enfoque para cerebros con tdah"
  lead: "los temporizadores comunes son fáciles de ignorar. pixeldoro convierte la concentración en un juego que compartes con otras personas: gente real concentrada a tu alrededor te ayuda a arrancar, cada sesión te paga al instante y una historia te da una razón para volver mañana."
  facts:
    - "gratis · sin anuncios"
    - "sin suscripción"
    - "iphone · mac · android · windows · linux · navegador · discord"
  shot_alt: "Pantalla de recompensa al terminar una sesión de enfoque: tu enfoque desbloqueó un botín, 30 monedas, reclamar"
  shot_caption: "cada pomodoro te paga, al instante."
  cards_title: "hecha para cerebros que se desconectan con un temporizador"
  cards:
    - title: "body doubling integrado"
      text: "personas reales concentradas a tu alrededor hacen que sea más fácil empezar. sin cámara, sin llamada, sin agendar sesiones."
    - title: "una recompensa al instante"
      text: "cada pomodoro te da monedas. gástalas en muebles, salas, atuendos y mascotas."
    - title: "las sesiones cortas cuentan"
      text: "un ajuste de 15/3 para los días en que 25 minutos es demasiado, y un cronómetro para cuando te agarra el hiperfoco."
    - title: "una razón para volver"
      text: "misiones de historia, diarias y semanales, un reto semanal de la comunidad y estadísticas que no paran de sumar."
  steps_title: "cómo arrancar cuando lo difícil es arrancar"
  steps:
    - title: "solo ábrelo"
      text: "no necesitas un plan. abre pixeldoro y siéntate en una sala donde la gente ya está trabajando."
    - title: "elige una cosa pequeña"
      text: "etiquétala y empieza una sesión corta. 15 minutos también es un pomodoro de verdad."
    - title: "junta tus monedas"
      text: "reclama tu recompensa, toma el descanso y fíjate si quieres otra ronda."
  prose_title: "¿qué es el body doubling?"
  prose:
    - "body doubling significa trabajar mientras hay alguien más cerca. a mucha gente con tdah le cuesta mucho menos empezar y no perder el hilo cuando hay otra persona ahí, aunque esa persona esté ocupada con lo suyo."
    - "pixeldoro te da eso cuando lo necesites. la gente de cada sala es real y se está concentrando ahora mismo, con su temporizador y su tarea a la vista. tienes la compañía sin cámara, sin horarios y sin un desconocido mirándote. más sobre eso en <a href=\"{study-with-me}\">estudia conmigo</a>."
    - "pixeldoro no es una herramienta médica ni un tratamiento para el tdah. es una forma más acogedora de arrancar."
  quotes_title: "de las reseñas"
  faq:
    - q: "¿pixeldoro sirve para el tdah?"
      a: "está hecho para cerebros que se desconectan con un temporizador común. te recompensa solo por aparecer, ver a otras personas concentradas a tu alrededor te ayuda a empezar y la historia te da una razón para volver. no es una herramienta médica, solo una forma más acogedora de arrancar."
    - q: "¿qué es el body doubling?"
      a: "trabajar junto a otra persona para que sea más fácil empezar y seguir. en pixeldoro, la gente a tu alrededor es real y se está concentrando ahora mismo, sin cámara ni llamada."
    - q: "¿y si no puedo concentrarme 25 minutos?"
      a: "usa el ajuste de 15/3 o pon tu propia duración. una sesión corta también te da monedas y cuenta para las misiones."
    - q: "¿bloquea apps que distraen?"
      a: "todavía no. las etiquetas de enfoque te dejan nombrar cada sesión y tus estadísticas dividen tu tiempo por etiqueta. el bloqueo de apps está en la lista."
    - q: "¿es gratis?"
      a: "sí. sin anuncios, sin suscripción. un paquete de patrocinador opcional de pago único agrega monedas extra y objetos premium."
  more: "más guías: <a href=\"{study-with-me}\">estudia conmigo</a> · <a href=\"{pomodoro-timer}\">temporizador pomodoro</a> · <a href=\"{home}\">inicio de pixeldoro</a>"
