# Halaman pomodoro-timer, bahasa Indonesia. Key mengikuti text di en/pomodoro-timer.yml.
text:
  title: "Timer pomodoro aesthetic, pixel art dan lofi | Pixeldoro"
  description: "Timer pomodoro aesthetic gratis di dunia pixel art yang cozy: sesi 25/5, 45/15 atau kustom, stopwatch, radio lofi, tag fokus, dan statistik. Di semua perangkat."
  crumb: "timer pomodoro"
  eyebrow: "panduan pixeldoro"
  h1: "timer pomodoro aesthetic di dunia pixel art"
  lead: "pixeldoro adalah timer pomodoro gratis di dalam kota pixel yang cozy. pilih preset atau atur sendiri, nyalakan radio lofi, dan nikmati hujan sambil kerja. tiap pomodoro dapat koin, dan jam-jammu terkumpul di statistik yang dibagi sesuai apa yang kamu kerjakan."
  facts:
    - "gratis · tanpa iklan"
    - "tanpa langganan"
    - "iphone · mac · android · windows · linux · browser · discord"
  shot_alt: "Layar timer fokus: preset 25/5, 45/15, 15/3, stopwatch, dan kustom, timer 25:00, serta tag fokus berwarna seperti ujian matematika, bahasa inggris, dan fisika"
  shot_caption: "pilih apa yang mau kamu kerjakan, lalu mulai pomodoro."
  cards_title: "semua yang kamu butuhkan dari timer pomodoro"
  cards:
    - title: "preset atau atur sendiri"
      text: "25/5, 45/15, 15/3, atau durasi berapa pun yang kamu mau. stopwatch hingga 8 jam untuk deep work yang panjang."
    - title: "radio lofi bawaan"
      text: "enam stasiun lofi dan chill, tanpa perlu ngurus playlist. hujan dan kabut datang saat kamu fokus."
    - title: "tag fokus"
      text: "beri label tiap sesi: ujian, coding, membaca. alarm beneran berbunyi saat sesi selesai, dan ada pengingat saat istirahat habis."
    - title: "statistik yang terus bertambah"
      text: "lihat ke mana jam-jammu habis, dibagi per tag, minggu demi minggu. tiap sesi juga memberimu koin untuk kamarmu."
  steps_title: "cara pakai timer pomodoro"
  steps:
    - title: "pilih durasi"
      text: "25/5 itu yang klasik. 45/15 cocok untuk blok belajar yang panjang, dan 15/3 pas buat pemanasan di hari yang lagi lesu."
    - title: "kasih tag, lalu mulai"
      text: "pilih apa yang mau kamu kerjakan, lalu tekan mulai. semua orang di sekitarmu bisa lihat timer dan tugasmu."
    - title: "istirahat dulu"
      text: "saat alarm berbunyi, berdiri, peregangan, lihat-lihat kota. pixeldoro akan mengingatkanmu saat waktunya kembali fokus."
  prose_title: "apa itu teknik pomodoro?"
  prose:
    - "teknik pomodoro membagi pekerjaan menjadi blok-blok pendek yang fokus, dengan istirahat di antaranya. versi klasiknya 25 menit fokus dan 5 menit istirahat, dengan istirahat yang lebih panjang setelah empat putaran. namanya diambil dari timer dapur berbentuk tomat, itulah kenapa maskot pixeldoro adalah tomat."
    - "teknik ini ampuh karena blok yang pendek gampang dimulai, dan istirahat yang selalu menunggu bikin kamu lebih mudah bertahan. kalau 25 menit terasa lama, mulai dengan yang lebih pendek. kalau lagi asyik-asyiknya, pakai stopwatch dan lanjut terus."
    - "cuma mau timernya? <a href=\"{mini}\">pixeldoro mini</a> adalah versi minimalnya: timer, latar pixel art, musik lofi, dan statistik. mau ditemani orang lain saat fokus? lihat <a href=\"{study-with-me}\">study with me</a>."
  faq:
    - q: "durasi pomodoro yang paling efektif berapa menit?"
      a: "25 menit fokus dan 5 menit istirahat adalah yang klasik. banyak orang lebih suka 45/15 atau 50/10 untuk deep work, dan 15/3 di hari yang energinya lagi rendah. coba beberapa, lalu pakai yang paling cocok."
    - q: "bisa atur durasi timer sendiri?"
      a: "bisa. selain preset 25/5, 45/15, dan 15/3, kamu bisa atur durasi kustom, atau pakai stopwatch hingga 8 jam."
    - q: "apakah ada alarm saat sesi selesai?"
      a: "ada. pixeldoro membunyikan alarm beneran saat sesi fokusmu selesai dan mengingatkanmu saat istirahatmu habis."
    - q: "apakah timer pomodoro ini gratis?"
      a: "iya. timer, radio, statistik, dan seluruh dunianya gratis, tanpa iklan dan tanpa langganan."
    - q: "ada versi yang lebih simpel?"
      a: "pixeldoro mini isinya cuma timer: latar pixel art, musik lofi, dan statistik, di iphone dan android."
  more: "panduan lainnya: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{adhd-focus-app}\">aplikasi fokus adhd</a> · <a href=\"{home}\">beranda pixeldoro</a>"
