# A página adhd-focus-app, português do Brasil. Mesmas chaves de "text" do en/adhd-focus-app.yml.
text:
  title: "App de foco para TDAH: body doubling e recompensas | Pixeldoro"
  description: "Um app de foco grátis para quem tem TDAH: body doubling com gente real, moedas a cada sessão, timers curtos e uma história pra voltar. Sem câmera, sem anúncios."
  crumb: "app de foco para tdah"
  eyebrow: "guia pixeldoro"
  h1: "um app de foco para cérebros com tdah"
  lead: "timer comum é fácil de ignorar. o pixeldoro transforma o foco num jogo que você divide com outras pessoas: gente de verdade focando ao seu redor te ajuda a começar, cada sessão dá recompensa na hora e uma história te dá um motivo pra voltar amanhã."
  facts:
    - "grátis · sem anúncios"
    - "sem assinatura"
    - "iphone · mac · android · windows · linux · navegador · discord"
  shot_alt: "Tela de recompensa depois de uma sessão de foco concluída: seu foco rendeu uns prêmios, 30 moedas, resgatar"
  shot_caption: "cada pomodoro dá recompensa, na hora."
  cards_title: "feito para cérebros que ignoram um timer"
  cards:
    - title: "body doubling integrado"
      text: "gente de verdade focando ao seu redor deixa mais fácil começar. sem câmera, sem chamada, sem agendar sessão."
    - title: "recompensa na hora"
      text: "cada pomodoro rende moedas. gaste em móveis, cômodos, roupas e pets."
    - title: "sessão curta também conta"
      text: "um preset 15/3 pros dias em que 25 minutos é demais, e um cronômetro pra quando o hiperfoco bater."
    - title: "um motivo pra voltar"
      text: "história, missões diárias e semanais, um desafio semanal da comunidade e estatísticas que não param de crescer."
  steps_title: "como começar quando começar é a parte difícil"
  steps:
    - title: "só abra"
      text: "você não precisa de um plano. abra o pixeldoro e sente numa sala onde a galera já está trabalhando."
    - title: "escolha uma coisinha"
      text: "coloque uma tag e comece uma sessão curta. 15 minutos também é um pomodoro de verdade."
    - title: "pegue suas moedas"
      text: "resgate sua recompensa, faça a pausa e veja se bate vontade de mais uma rodada."
  prose_title: "o que é body doubling?"
  prose:
    - "body doubling é trabalhar com outra pessoa por perto. muita gente com tdah acha bem mais fácil começar e manter o foco quando tem alguém ali, mesmo que essa pessoa esteja ocupada com as próprias coisas."
    - "o pixeldoro te dá isso sempre que você precisar. as pessoas em cada sala são reais e estão focando agora, com o timer e a tarefa à mostra. você tem a companhia sem câmera, sem horário marcado e sem um desconhecido te olhando. mais sobre isso em <a href=\"{study-with-me}\">study with me</a>."
    - "o pixeldoro não é uma ferramenta médica nem um tratamento para tdah. é só um jeito mais aconchegante de começar."
  quotes_title: "das avaliações"
  faq:
    - q: "pixeldoro é bom para tdah?"
      a: "ele foi feito para cérebros que ignoram um timer comum. ele te recompensa só por marcar presença, outras pessoas focando ao seu redor ajudam você a começar e a história te dá um motivo para voltar. não é uma ferramenta médica, só um jeito mais aconchegante de começar."
    - q: "o que é body doubling?"
      a: "é trabalhar ao lado de outra pessoa pra ficar mais fácil começar e continuar. no pixeldoro as pessoas ao seu redor são reais e estão focando agora, sem câmera nem chamada."
    - q: "e se eu não consigo focar por 25 minutos?"
      a: "use o preset 15/3 ou defina seu próprio tempo. uma sessão curta também rende moedas e conta para as missões."
    - q: "ele bloqueia apps que distraem?"
      a: "ainda não. as tags de foco deixam você marcar cada sessão e suas estatísticas dividem seu tempo por tag. o bloqueio de apps está nos planos."
    - q: "é grátis?"
      a: "sim. sem anúncios, sem assinatura. um pacote de apoiador opcional, com pagamento único, dá moedas bônus e itens premium."
  more: "mais guias: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{pomodoro-timer}\">timer pomodoro</a> · <a href=\"{home}\">página inicial do pixeldoro</a>"
