# Die pomodoro-timer-Seite, Deutsch. Spiegelt die Schlüssel unter "text" aus en/pomodoro-timer.yml.
text:
  title: "Aesthetic Pomodoro Timer mit Pixel Art & Lofi | Pixeldoro"
  description: "Kostenloser Aesthetic Pomodoro Timer in einer cozy Pixel-Welt: 25/5, 45/15 oder eigene Zeiten, Stoppuhr, Lofi-Radio, Fokus-Tags und Statistik. Auf jedem Gerät."
  crumb: "pomodoro-timer"
  eyebrow: "pixeldoro-ratgeber"
  h1: "ein aesthetic pomodoro-timer in einer pixel-art-welt"
  lead: "pixeldoro ist ein kostenloser pomodoro-timer in einer gemütlichen pixel-stadt. nimm eine vorlage oder stell deine eigene zeit ein, mach das lofi-radio an und schau dem regen zu, während du arbeitest. jeder pomodoro bringt münzen, und deine stunden summieren sich in der statistik, aufgeteilt danach, woran du gearbeitet hast."
  facts:
    - "kostenlos · ohne werbung"
    - "ohne abo"
    - "iphone · mac · android · windows · linux · browser · discord"
  shot_alt: "Fokus-Timer-Bildschirm: Vorlagen für 25/5, 45/15, 15/3, Stoppuhr und eigene Zeiten, ein Timer auf 25:00 und farbige Fokus-Tags wie Matheprüfungen, Englisch und Physik"
  shot_caption: "wähl, woran du arbeitest, und starte einen pomodoro."
  cards_title: "alles, was ein pomodoro-timer braucht"
  cards:
    - title: "vorlagen oder deine eigene zeit"
      text: "25/5, 45/15, 15/3 oder jede länge, die du willst. eine stoppuhr mit bis zu 8 stunden für lange deep-work-phasen."
    - title: "lofi-radio eingebaut"
      text: "sechs lofi- und chill-sender, keine playlist, um die du dich kümmern musst. regen und nebel ziehen auf, während du dich fokussierst."
    - title: "fokus-tags"
      text: "benenn jede session: prüfungen, coding, lesen. ein richtiger wecker klingelt, wenn sie vorbei ist, und ein kleiner stups, wenn die pause rum ist."
    - title: "statistik, die sich summiert"
      text: "sieh, wohin deine stunden fließen, aufgeteilt nach tag, woche für woche. jede session bringt außerdem münzen für dein zimmer."
  steps_title: "so benutzt du den pomodoro-timer"
  steps:
    - title: "wähl eine länge"
      text: "25/5 ist der klassiker. 45/15 passt zu langen lernblöcken, und 15/3 ist gut zum warmwerden an zähen tagen."
    - title: "tag setzen und los"
      text: "wähl, woran du arbeitest, und drück auf start. alle in der nähe sehen deinen timer und deine aufgabe."
    - title: "mach die pause"
      text: "wenn der wecker klingelt: aufstehen, strecken, dich in der stadt umschauen. pixeldoro erinnert dich, wenn es zeit ist, weiterzumachen."
  prose_title: "was ist die pomodoro-technik?"
  prose:
    - "die pomodoro-technik teilt arbeit in kurze, fokussierte blöcke mit pausen dazwischen. die klassische version: 25 minuten fokus und 5 minuten pause, nach vier runden eine längere pause. benannt ist sie nach einem küchenwecker in tomatenform, deshalb ist das maskottchen von pixeldoro eine tomate."
    - "sie funktioniert, weil ein kurzer block leicht anzufangen ist und eine pause, die sowieso gleich kommt, das dranbleiben leichter macht. wenn sich 25 minuten lang anfühlen, fang kürzer an. wenn du gerade voll drin bist, nimm die stoppuhr und mach weiter."
    - "du willst nur den timer? <a href=\"{mini}\">pixeldoro mini</a> ist die minimalistische version: ein timer, pixel-art-hintergründe, lofi-musik und statistik. du willst gesellschaft beim fokussieren? schau bei <a href=\"{study-with-me}\">study with me</a> vorbei."
  faq:
    - q: "welche pomodoro-länge ist am besten?"
      a: "25 minuten fokus und 5 minuten pause sind der klassiker. viele nehmen für deep work lieber 45/15 oder 50/10 und an tagen mit wenig energie 15/3. probier ein paar aus und bleib bei dem, was klappt."
    - q: "kann ich die timer-länge selbst einstellen?"
      a: "ja. neben den vorlagen 25/5, 45/15 und 15/3 kannst du eine eigene länge einstellen oder die stoppuhr für bis zu 8 stunden nutzen."
    - q: "sagt mir der timer, wenn die session vorbei ist?"
      a: "ja. pixeldoro klingelt mit einem richtigen wecker, wenn deine fokus-session endet, und erinnert dich, wenn deine pause vorbei ist."
    - q: "ist der pomodoro-timer kostenlos?"
      a: "ja. timer, radio, statistik und die ganze welt sind kostenlos, ohne werbung und ohne abo."
    - q: "gibt es eine einfachere version?"
      a: "pixeldoro mini ist nur der timer: pixel-art-hintergründe, lofi-musik und statistik, auf iphone und android."
  more: "mehr ratgeber: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{adhd-focus-app}\">adhs-fokus-app</a> · <a href=\"{home}\">pixeldoro-startseite</a>"
