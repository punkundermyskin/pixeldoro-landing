# Halaman windows, bahasa Indonesia. Key mengikuti text di en/windows.yml.
text:
  title: "Timer pomodoro gratis untuk PC Windows | Pixeldoro"
  description: "Download Pixeldoro untuk Windows 10 dan 11: timer pomodoro gratis di dunia pixel yang cozy, belajar bareng orang sungguhan. Radio lofi, statistik, tanpa iklan."
  crumb: "windows"
  eyebrow: "pixeldoro untuk windows"
  h1: "timer pomodoro cozy untuk pc windows-mu"
  lead: "pixeldoro adalah timer pomodoro gratis di dalam dunia pixel art, tempat kamu fokus di samping orang sungguhan yang lagi belajar saat ini. di windows, pixeldoro punya jendelanya sendiri, jadi timer dan radio lofi tetap jalan saat kamu kerja di aplikasi lain."
  button: "download untuk windows"
  note: "gratis · windows 10 dan 11 · 64-bit"
  others: "atau main <a href=\"https://play.pixeldoro.io/web-beta\">di browser</a>, atau download untuk <a href=\"https://play.pixeldoro.io/macos\">mac</a> · <a href=\"{linux}\">linux</a>"
  on_computer: "pakai komputer windows? buka halaman ini di sana untuk download"
  facts:
    - "gratis · tanpa iklan"
    - "windows 10 + 11"
    - "satu akun di semua perangkat"
  shot_alt: "Daftar teman di hub sosial: avatar tiap teman, apa yang sedang mereka fokuskan, ruangan tempat mereka berada, dan jumlah pomodoronya, di samping kafe yang penuh orang belajar"
  shot_caption: "lihat temanmu lagi fokus ke apa, dan di mana."
  cards_title: "kenapa pakai aplikasi windows"
  cards:
    - title: "tetap jalan di background"
      text: "minimize atau pindah ke kerjaanmu. timer dan radio tetap jalan, dan aplikasinya tinggal satu alt+tab saja."
    - title: "radio lofi bawaan"
      text: "enam stasiun lofi + chill, jadi tidak perlu tab lain buat putar musik. hujan dan kabut datang saat kamu fokus."
    - title: "orang sungguhan, saat ini juga"
      text: "setiap karakter di ruangan adalah orang sungguhan yang sedang dalam sesi fokus, dengan timer dan tugasnya di atas kepala."
    - title: "progresmu ikut ke mana-mana"
      text: "masuk dengan emailmu, dan kamar, koin, serta statistikmu ikut ke hp-mu, mac-mu, dan browser."
  steps_title: "cara install pixeldoro di windows"
  steps:
    - title: "download installer-nya"
      text: "klik tombol download untuk mendapatkan file setup pixeldoro."
    - title: "jalankan"
      text: "buka file-nya dan ikuti installer-nya. kalau windows bilang “Windows melindungi PC Anda”, klik <b>info selengkapnya</b>, lalu <b>tetap jalankan</b>."
    - title: "masuk dan fokus"
      text: "buka pixeldoro, masuk dengan emailmu kalau kamu juga main di perangkat lain, pilih ruangan, lalu mulai pomodoro."
  prose_title: "aplikasi atau browser?"
  prose:
    - "pixeldoro juga bisa jalan di browser apa pun, tanpa perlu install. aplikasi windows cocok kalau kamu fokus di depan pc setiap hari: ada jendela dan ikon taskbar sendiri, tidak ikut tertutup bareng tab-tab lain, dan browser suka memperlambat tab yang sedang tidak kamu lihat."
    - "baru kenal tekniknya? baca <a href=\"{pomodoro-timer}\">panduan timer pomodoro</a>, atau lihat bagaimana <a href=\"{study-with-me}\">belajar bareng orang lain</a> membantumu mulai."
  faq:
    - q: "apakah pixeldoro gratis di windows?"
      a: "iya. timer, dunianya, pemain lain, teman, dan radio semuanya gratis, tanpa iklan dan tanpa langganan. ada paket supporter opsional yang cukup dibeli sekali untuk bonus koin dan item premium."
    - q: "pixeldoro bisa jalan di windows versi berapa?"
      a: "windows 10 dan windows 11 64-bit."
    - q: "kenapa muncul “Windows melindungi PC Anda” saat install?"
      a: "itu smartscreen. peringatan ini muncul untuk aplikasi dari developer kecil yang tidak punya sertifikat code-signing berbayar. klik <b>info selengkapnya</b>, lalu <b>tetap jalankan</b>."
    - q: "apakah timer tetap jalan saat di-minimize?"
      a: "iya. timer dan radio tetap jalan saat jendelanya di-minimize atau tertutup aplikasi lain."
    - q: "cara update pixeldoro gimana?"
      a: "download installer terbaru dari halaman ini, lalu jalankan."
    - q: "bisa pakai akun yang sama di hp?"
      a: "bisa. masuk dengan email yang sama di iphone, android, mac, atau browser, dan progres, kamar, serta koinmu akan ikut."
    - q: "ada versi mac atau linux?"
      a: "ada. versi mac tersedia di <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>, dan ada juga <a href=\"{linux}\">versi linux</a>."
  more: "lainnya: <a href=\"{linux}\">pixeldoro untuk linux</a> · <a href=\"{pomodoro-timer}\">timer pomodoro</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">beranda pixeldoro</a>"
