# Страница windows, русский. Ключи повторяют text из en/windows.yml.
text:
  title: "Помодоро таймер для Windows: скачать бесплатно | Pixeldoro"
  description: "Скачай Pixeldoro для Windows 10 и 11: бесплатный помодоро таймер в пиксельном мире, где ты учишься рядом с реальными людьми. Лофи, статистика, без рекламы."
  crumb: "windows"
  eyebrow: "pixeldoro для windows"
  h1: "уютный помодоро-таймер для твоего пк на windows"
  lead: "pixeldoro — бесплатный помодоро-таймер внутри пиксельного мира, где ты фокусируешься рядом с реальными людьми, которые учатся прямо сейчас. на windows у него свое окно, так что таймер и лофи-радио не останавливаются, пока ты работаешь в других приложениях."
  button: "скачать для windows"
  note: "бесплатно · windows 10 и 11 · 64-бит"
  others: "или играй <a href=\"https://play.pixeldoro.io/web-beta\">в браузере</a>, или скачай для <a href=\"https://play.pixeldoro.io/macos\">mac</a> · <a href=\"{linux}\">linux</a>"
  on_computer: "скачать можно на компьютере с windows: открой эту страницу там"
  facts:
    - "бесплатно · без рекламы"
    - "windows 10 + 11"
    - "один аккаунт на всех устройствах"
  shot_alt: "Список друзей в сообществе: аватар каждого друга, на чем он сосредоточен, в какой он комнате и сколько у него помодоро, а рядом кафе, полное людей за учебой"
  shot_caption: "смотри, на чем сосредоточены друзья и где они сейчас."
  cards_title: "зачем ставить приложение для windows"
  cards:
    - title: "работает в фоне"
      text: "сверни его или переключись на работу. таймер и радио не останавливаются, а приложение всегда в одном alt+tab."
    - title: "встроенное лофи-радио"
      text: "шесть станций с лофи и спокойной музыкой, так что не нужна еще одна вкладка с музыкой. пока ты в фокусе, накатывают дождь и туман."
    - title: "реальные люди, прямо сейчас"
      text: "каждый персонаж в комнате — реальный человек в сессии фокуса, с таймером и задачей над головой."
    - title: "прогресс везде с тобой"
      text: "войди через email, и твоя комната, монеты и статистика будут с тобой на телефоне, на mac и в браузере."
  steps_title: "как установить pixeldoro на windows"
  steps:
    - title: "скачай установщик"
      text: "нажми кнопку загрузки, чтобы скачать установочный файл pixeldoro."
    - title: "запусти его"
      text: "открой файл и следуй шагам установщика. если windows пишет «Система Windows защитила ваш компьютер», нажми <b>подробнее</b>, а потом <b>выполнить в любом случае</b>."
    - title: "войди и фокусируйся"
      text: "открой pixeldoro, войди через email, если играешь и на других устройствах, выбери комнату и запусти помодоро."
  prose_title: "приложение или браузер?"
  prose:
    - "pixeldoro работает и в любом браузере, ничего не нужно устанавливать. приложение для windows — для тех, кто фокусируется за пк каждый день: у него свое окно и значок на панели задач, его не закроешь вместе с другими вкладками, а еще браузеры притормаживают вкладки, на которые ты не смотришь."
    - "техника помодоро для тебя в новинку? почитай <a href=\"{pomodoro-timer}\">гайд по помодоро таймеру</a> или узнай, как <a href=\"{study-with-me}\">учеба рядом с другими людьми</a> помогает начать."
  faq:
    - q: "pixeldoro на windows бесплатный?"
      a: "да. таймер, мир, другие игроки, друзья и радио — все бесплатно, без рекламы и без подписки. необязательный набор поддержки с разовой оплатой дает бонусные монеты и премиум-предметы."
    - q: "на каких версиях windows он работает?"
      a: "на 64-битных windows 10 и windows 11."
    - q: "почему windows пишет «Система Windows защитила ваш компьютер»?"
      a: "это smartscreen. он появляется у приложений от небольших разработчиков, у которых нет платного сертификата подписи кода. нажми <b>подробнее</b>, а потом <b>выполнить в любом случае</b>."
    - q: "работает ли таймер, если свернуть окно?"
      a: "да. таймер и радио не останавливаются, когда окно свернуто или спрятано за другими приложениями."
    - q: "как обновить pixeldoro?"
      a: "скачай свежий установщик с этой страницы и запусти его."
    - q: "можно ли зайти в тот же аккаунт с телефона?"
      a: "да. войди с тем же email на iphone, android, mac или в браузере, и твой прогресс, комната и монеты будут с тобой."
    - q: "есть версия для mac или linux?"
      a: "да. версия для mac есть в <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>, а еще есть <a href=\"{linux}\">сборка для linux</a>."
  more: "еще: <a href=\"{linux}\">pixeldoro для linux</a> · <a href=\"{pomodoro-timer}\">помодоро таймер</a> · <a href=\"{study-with-me}\">учись со мной</a> · <a href=\"{home}\">главная pixeldoro</a>"
