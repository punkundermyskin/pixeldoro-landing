faq:
  title: "frequently asked questions"
  items:
    - q: "what is pixeldoro?"
      a: "pixeldoro is a free pomodoro timer inside a cozy pixel art world. you pick a spot, start a focus session and work next to real people doing the same. every session earns coins for your room, moves the story forward and adds to your stats. it has lofi radio built in and runs on iphone, ipad, mac, android, windows, linux, the browser and discord."
    - q: "is pixeldoro free?"
      a: "yes. the timer, the world, other players, friends, quests, pets and radio are all free, with no ads and no subscription. there's an optional one-time supporter pack: 25% more coins every session, a profile badge, premium skins, furniture, backgrounds and rooms, and a bonus quest."
    - q: "is it a game or a productivity app?"
      a: "both, but the timer comes first. the game only moves when you focus: finishing pomodoros earns coins, clears quests and unlocks new places. between sessions there's just enough to do to feel rewarding without pulling you off task."
    - q: "are the other people real?"
      a: "yes. every character walking around or sitting at a desk is a real player focusing right now. you can see their timer, how many pomodoros they've done and what they're working on."
    - q: "what is body doubling?"
      a: "body doubling means working next to someone else so it's easier to start and keep going. it's why studying in a library or a coffee shop works. pixeldoro gives you that feeling without a camera or a schedule: open it any time and there are people locked in around you."
    - q: "can i study with friends?"
      a: "yes. add friends, see who's online and what they're working on, and visit each other's houses to focus side by side. lobbies let you switch servers and find a different crowd."
    - q: "is it good for adhd?"
      a: "it's built for brains that tune out a plain timer. it rewards you just for showing up, other people focusing around you help you start, and the story gives you a reason to come back. it isn't a medical tool, just a cozier way to get going."
    - q: "is there a to-do list or app blocking?"
      a: "not yet. focus tags let you label each session (exams, coding, reading) and your stats split your time by tag. both are on the list."
    - q: "what can i play it on, and does my progress sync?"
      a: "iphone, ipad and mac on the app store, android on google play, windows and linux on pixeldoro.io, any browser at play.pixeldoro.io, and as an activity inside discord. sign in with your email and your progress, room and coins follow you to every device. it speaks 9 languages."

