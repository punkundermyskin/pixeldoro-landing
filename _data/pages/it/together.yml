  subline: "è lì dentro proprio ora, a sgobbare in solitaria. vai a fargli un po' di compagnia."
  shot_alt: "Lista degli amici nella community: l'avatar di ogni amico, su cosa si sta concentrando, in quale stanza si trova e quanti pomodori ha fatto, accanto a un caffè pieno di gente che studia"
  reasons:
    - title: "vi vedrete davvero"
      text: "il suo personaggino che va in giro e sgobba. proprio lì, accanto al tuo."
    - title: "focus in sincronia"
      text: "avvia un pomodoro e dacci dentro. niente call, niente pressione. vi tenete d'occhio a vicenda, ma in versione cozy."
