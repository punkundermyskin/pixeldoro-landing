faq:
  title: "häufige fragen"
  items:
    - q: "was ist pixeldoro?"
      a: "pixeldoro ist ein kostenloser pomodoro-timer in einer gemütlichen pixel-art-welt. du suchst dir einen platz, startest eine fokus-session und arbeitest neben echten menschen, die dasselbe tun. jede session bringt münzen für dein zimmer, bringt die geschichte voran und landet in deiner statistik. lofi-radio ist eingebaut, und es läuft auf iphone, ipad, mac, android, windows, linux, im browser und in discord."
    - q: "ist pixeldoro kostenlos?"
      a: "ja. timer, welt, andere spieler, freunde, quests, haustiere und radio sind komplett kostenlos, ohne werbung und ohne abo. es gibt ein optionales supporter-paket als einmalkauf: 25% mehr münzen bei jeder session, ein abzeichen im profil, premium-skins, möbel, hintergründe und räume und dazu eine bonusquest."
    - q: "ist das ein spiel oder eine produktivitäts-app?"
      a: "beides, aber der timer kommt zuerst. das spiel geht nur weiter, wenn du dich fokussierst: abgeschlossene pomodoros bringen münzen, erledigen quests und schalten neue orte frei. zwischen den sessions gibt's gerade genug zu tun, damit es sich lohnt, ohne dich von deiner aufgabe abzulenken."
    - q: "sind die anderen leute echt?"
      a: "ja. jede figur, die herumläuft oder am schreibtisch sitzt, ist ein echter spieler, der sich gerade fokussiert. du siehst seinen timer, wie viele pomodoros er schon geschafft hat und woran er arbeitet."
    - q: "was ist body doubling?"
      a: "body doubling heißt, neben jemand anderem zu arbeiten, damit es leichter fällt, anzufangen und dranzubleiben. deshalb klappt lernen in der bibliothek oder im café so gut. pixeldoro gibt dir dieses gefühl ohne kamera und ohne termin: mach es auf, wann du willst, und um dich herum sind leute voll im fokus."
    - q: "kann ich mit freunden lernen?"
      a: "ja. füg freunde hinzu, sieh, wer online ist und woran sie arbeiten, und besucht euch gegenseitig zu hause, um seite an seite zu lernen. über lobbys kannst du den server wechseln und andere leute finden."
    - q: "hilft es bei adhs?"
      a: "es ist für köpfe gemacht, die bei einem normalen timer abschalten. es belohnt dich schon fürs dabeisein, andere leute, die sich um dich herum fokussieren, helfen dir beim anfangen, und die geschichte gibt dir einen grund wiederzukommen. es ist kein medizinisches hilfsmittel, nur ein gemütlicherer weg, in die gänge zu kommen."
    - q: "gibt es eine to-do-liste oder einen app-blocker?"
      a: "noch nicht. mit fokus-tags kannst du jede session benennen (prüfungen, coding, lesen), und deine statistik teilt deine zeit nach tag auf. beides steht auf der liste."
    - q: "worauf kann ich es spielen, und wird mein fortschritt synchronisiert?"
      a: "iphone, ipad und mac über den app store, android über google play, windows und linux über pixeldoro.io, jeder browser unter play.pixeldoro.io und als aktivität in discord. melde dich mit deiner e-mail an, und dein fortschritt, dein zimmer und deine münzen begleiten dich auf jedes gerät. es spricht 9 sprachen."

outro:
  title: "bereit, loszulegen?"
  lead: "kostenlos auf jedem gerät. genau jetzt sind leute im fokus."

