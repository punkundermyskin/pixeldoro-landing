# feedback sayfası, Türkçe.
text:
  title: "geliştiriciden bir not — pixeldoro"
  hello: "selam 👋"
  intro: "ben punk — pixeldoro'yu yapan kişi."
  sorry: "şöyle ki, hediye kartlarım bitti haha. kusura bakma."
  offer: "ama elimde daha iyi bir şey var — pixeldoro'da <b>ömür boyu premium</b>. sonsuza dek. benimle kısa bir görüşme yaparsan ya da dürüst düşüncelerini bana e-postayla yollarsan hepsi senin. ikisi de olur."
  reads: "geri bildirimin, sırada ne yapacağıma resmen karar veriyor. her şeyi okuyorum."
  thanks: "teşekkürler 🙏"
  call: "→ görüşme ayarla"
  email: "→ geri bildirim gönder"
