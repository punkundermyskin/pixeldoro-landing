<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixeldoro on Mobile</title>
    <link rel="icon" sizes="32x32" href="images/favicon.ico">
    <link rel="shortcut icon" href="images/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
        }

        .headline {
            font-size: 32px;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 30px;
            max-width: 600px;
        }

        .screenshot {
            width: 220px;
            margin-bottom: 30px;
        }

        .screenshot-placeholder {
            width: 100%;
            aspect-ratio: 9 / 16;
            background-color: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0.5;
        }

        .reasons {
            display: flex;
            gap: 40px;
            margin-bottom: 36px;
            max-width: 700px;
        }

        .reason {
            flex: 1;
            text-align: center;
        }

        .reason-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .reason-desc {
            font-size: 13px;
            opacity: 0.7;
            line-height: 1.4;
        }

        .downloads {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .download-badge {
            height: 52px;
            transition: all 0.25s ease;
        }

        .download-badge:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 16px;
                overflow: auto;
                justify-content: flex-start;
                padding-top: 40px;
            }

            html, body {
                height: auto;
                overflow: auto;
            }

            .headline {
                font-size: 24px;
                margin-bottom: 24px;
            }

            .screenshot {
                width: 180px;
                margin-bottom: 24px;
            }

            .reasons {
                flex-direction: column;
                gap: 16px;
                margin-bottom: 28px;
            }

            .downloads {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <h1 class="headline">you already study on your computer.<br>take it with you.</h1>

    <div class="screenshot">
        <div class="screenshot-placeholder">[mobile app screenshot]</div>
    </div>

    <div class="reasons">
        <div class="reason">
            <div class="reason-title">study anywhere</div>
            <div class="reason-desc">bus, cafe, library, bed</div>
        </div>
        <div class="reason">
            <div class="reason-title">everything syncs</div>
            <div class="reason-desc">same account, same coins, same world</div>
        </div>
        <div class="reason">
            <div class="reason-title">100 coins on your first pomo</div>
            <div class="reason-desc">just for trying it</div>
        </div>
    </div>

    <div class="downloads">
        <a href="https://play.pixeldoro.io/dl-ios">
            <img src="images/app_store_badge.png" alt="Download on the App Store" class="download-badge">
        </a>
        <a href="https://play.pixeldoro.io/dl-android">
            <img src="images/google_play_badge.png" alt="Get it on Google Play" class="download-badge">
        </a>
    </div>
</body>
</html>
