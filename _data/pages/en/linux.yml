# The linux page, English. Other languages mirror the text keys under "text"; "layout" is read from this file only.
# {windows}, {linux}, {home} and the other {page} placeholders become links to the same language's pages.
layout:
  kind: "download"
  shot: "home-pets"
  icons:
    - "tomato"
    - "radio"
    - "folder"
    - "stats"
  download: "https://github.com/pixeldoro/desktop/releases/latest/download/pixeldoro-linux.tar.gz"
text:
  title: "Pomodoro timer for Linux, free and cozy | Pixeldoro"
  description: "Pixeldoro for Linux: a free pomodoro timer in a cozy pixel world where you study next to real people. A native x86_64 build with lofi radio and stats."
  crumb: "linux"
  eyebrow: "pixeldoro for linux"
  h1: "a cozy pomodoro timer that runs on linux"
  lead: "pixeldoro is a free pomodoro timer inside a pixel art world, where you focus next to real people who are studying right now. the linux version is a native build: extract it, run it, and the timer and lofi radio keep going in their own window."
  button: "download for linux"
  note: "free · 64-bit x86_64 · .tar.gz"
  others: "or play <a href=\"https://play.pixeldoro.io/web-beta\">in your browser</a>, or get it for <a href=\"{windows}\">windows</a> · <a href=\"https://play.pixeldoro.io/macos\">mac</a>"
  on_computer: "on a linux computer? open this page there to download"
  facts:
    - "free · no ads"
    - "native x86_64 build"
    - "one account on every device"
  shot_alt: "A decorated home with three pet cats and two friends visiting, each showing their pomodoro count and what they're studying"
  shot_caption: "have friends over. the cats live here."
  cards_title: "why get the linux app"
  cards:
    - title: "a native build"
      text: "a real linux build, not a web page in a wrapper. nothing gets installed system-wide: it all lives in one folder."
    - title: "lofi radio built in"
      text: "six lofi + chill stations, so there's no other tab playing music. rain and fog roll in while you focus."
    - title: "real people, right now"
      text: "every character in the room is a real person in a focus session, with their timer and task above their head."
    - title: "your progress everywhere"
      text: "sign in with your email and your room, coins and stats follow you to your phone, your laptop and the browser."
  steps_title: "how to install pixeldoro on linux"
  steps:
    - title: "download it"
      text: "click the download button to get pixeldoro as a .tar.gz file."
    - title: "extract it"
      text: "extract it anywhere, from your file manager or with <code>tar -xzf pixeldoro-*.tar.gz</code>. you get a <code>pixeldoro</code> folder."
    - title: "run it"
      text: "open the folder and run <code>pixeldoro.x86_64</code>: double-click it, or <code>./pixeldoro.x86_64</code> in a terminal. sign in with your email if you play on other devices too."
  prose_title: "the app or the browser?"
  prose:
    - "pixeldoro also runs in any browser, nothing to install. the linux app is for when you focus at your computer every day: it has its own window, it won't get closed with your other tabs, and browsers slow down tabs you aren't looking at."
    - "new to the technique? read the <a href=\"{pomodoro-timer}\">pomodoro timer guide</a>, or see how <a href=\"{study-with-me}\">studying next to other people</a> helps you start."
  faq:
    - q: "is pixeldoro free on linux?"
      a: "yes. the timer, the world, other players, friends and radio are all free, with no ads and no subscription. an optional one-time supporter pack adds bonus coins and premium items."
    - q: "which distros does it run on?"
      a: "64-bit x86_64 desktop linux with opengl 3.2 or vulkan graphics. pixeldoro is built with unity, which officially supports ubuntu 20.04 and 22.04. if it won't start on your distro, email <a href=\"mailto:hello@pixeldoro.io\">hello@pixeldoro.io</a>."
    - q: "is there a flatpak, snap or appimage?"
      a: "not yet. it's a plain .tar.gz build: extract it and run it."
    - q: "does it run on arm?"
      a: "no, the linux build is x86_64 only. on an arm machine, play <a href=\"https://play.pixeldoro.io/web-beta\">in the browser</a> instead."
    - q: "how do i update it?"
      a: "download the latest build from this page and replace the old folder."
    - q: "can i use the same account on my phone?"
      a: "yes. sign in with the same email on iphone, android, mac or the browser and your progress, room and coins come with you."
    - q: "is there a windows or mac version?"
      a: "yes. there's a <a href=\"{windows}\">windows app</a>, and mac is on the <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>."
  more: "more: <a href=\"{windows}\">pixeldoro for windows</a> · <a href=\"{pomodoro-timer}\">pomodoro timer</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">pixeldoro home</a>"
