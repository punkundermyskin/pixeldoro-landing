text:
  title: "ADHS Fokus App: Body Doubling und Belohnungen | Pixeldoro"
  description: "Kostenlose Fokus App für ADHS-Köpfe: Body Doubling mit echten Menschen, Münzen für jede Session, kurze Timer und eine Story. Ohne Kamera, ohne Werbung."
  crumb: "adhs-fokus-app"
  eyebrow: "pixeldoro-ratgeber"
  h1: "eine fokus-app für adhs-köpfe"
  lead: "einen normalen timer ignoriert man leicht. pixeldoro macht aus fokus ein spiel, das du mit anderen teilst: echte menschen, die sich um dich herum fokussieren, helfen dir beim anfangen, jede session zahlt sich sofort aus, und eine geschichte gibt dir einen grund, morgen wiederzukommen."
  facts:
    - "kostenlos · ohne werbung"
    - "ohne abo"
    - "iphone · mac · android · windows · linux · browser · discord"
  shot_alt: "Belohnungsbildschirm nach einer abgeschlossenen Fokus-Session: dein Fokus bringt Beute, 30 Münzen, Abholen"
  shot_caption: "jeder pomodoro zahlt sich aus, sofort."
  cards_title: "für köpfe, die bei einem timer abschalten"
  cards:
    - title: "body doubling eingebaut"
      text: "echte menschen, die sich um dich herum fokussieren, machen das anfangen leichter. keine kamera, kein call, nichts zu buchen."
    - title: "sofort eine belohnung"
      text: "jeder pomodoro bringt münzen. gib sie für möbel, räume, outfits und haustiere aus."
    - title: "kurze sessions zählen"
      text: "eine 15/3-vorlage für tage, an denen 25 minuten zu viel sind, und eine stoppuhr für den moment, wenn der hyperfokus einsetzt."
    - title: "ein grund wiederzukommen"
      text: "story-, tages- und wochenquests, eine wöchentliche community-challenge und eine statistik, die immer weiter wächst."
  steps_title: "so kommst du rein, wenn das anfangen das schwerste ist"
  steps:
    - title: "mach es einfach auf"
      text: "du brauchst keinen plan. mach pixeldoro auf und setz dich in einen raum, in dem schon leute arbeiten."
    - title: "nimm dir eine kleine sache vor"
      text: "gib ihr einen tag und starte eine kurze session. 15 minuten sind auch ein richtiger pomodoro."
    - title: "sammel deine münzen"
      text: "hol dir deine belohnung ab, mach pause und schau, ob du noch eine runde willst."
  prose_title: "was ist body doubling?"
  prose:
    - "body doubling heißt, zu arbeiten, während jemand anderes da ist. vielen menschen mit adhs fällt es viel leichter, anzufangen und bei der sache zu bleiben, wenn noch jemand da ist, selbst wenn diese person mit ihrem eigenen kram beschäftigt ist."
    - "pixeldoro gibt dir das, wann immer du es brauchst. die leute in jedem raum sind echt und genau jetzt im fokus, timer und aufgabe sind sichtbar. du bekommst die gesellschaft ohne kamera, ohne termin und ohne fremde, die dir zuschauen. mehr dazu bei <a href=\"{study-with-me}\">study with me</a>."
    - "pixeldoro ist kein medizinisches hilfsmittel und keine behandlung für adhs. nur ein gemütlicherer weg, in die gänge zu kommen."
  quotes_title: "aus den bewertungen"
  faq:
    - q: "ist pixeldoro gut bei adhs?"
      a: "es ist für köpfe gemacht, die bei einem normalen timer abschalten. es belohnt dich schon fürs dabeisein, andere leute, die sich um dich herum fokussieren, helfen dir beim anfangen, und die geschichte gibt dir einen grund wiederzukommen. es ist kein medizinisches hilfsmittel, nur ein gemütlicherer weg, in die gänge zu kommen."
    - q: "was ist body doubling?"
      a: "neben jemand anderem arbeiten, damit es leichter fällt, anzufangen und dranzubleiben. in pixeldoro sind die leute um dich herum echt und genau jetzt im fokus, ohne kamera und ohne call."
    - q: "was, wenn ich mich keine 25 minuten konzentrieren kann?"
      a: "nimm die 15/3-vorlage oder stell deine eigene länge ein. auch eine kurze session bringt münzen und zählt für quests."
    - q: "blockiert pixeldoro ablenkende apps?"
      a: "noch nicht. mit fokus-tags kannst du jede session benennen, und deine statistik teilt deine zeit nach tag auf. ein app-blocker steht auf der liste."
    - q: "ist pixeldoro kostenlos?"
      a: "ja. ohne werbung, ohne abo. ein optionales supporter-paket als einmalkauf bringt extra-münzen und premium-items."
  more: "mehr ratgeber: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{pomodoro-timer}\">pomodoro-timer</a> · <a href=\"{home}\">pixeldoro-startseite</a>"
