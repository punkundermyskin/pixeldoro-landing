# La page linux, en français. Mêmes clés que le "text" de en/linux.yml.
text:
  title: "Minuteur pomodoro pour Linux, gratuit et cosy | Pixeldoro"
  description: "Pixeldoro pour Linux: un minuteur pomodoro gratuit dans un monde pixel cosy où tu étudies avec de vraies personnes. Version native x86_64, radio lofi et stats."
  crumb: "linux"
  eyebrow: "pixeldoro pour linux"
  h1: "un minuteur pomodoro cosy qui tourne sous linux"
  lead: "pixeldoro est un minuteur pomodoro gratuit dans un monde en pixel art, où tu te concentres à côté de vraies personnes qui étudient en ce moment même. la version linux est native: extrais-la, lance-la, et le minuteur et la radio lofi tournent dans leur propre fenêtre."
  button: "télécharger pour linux"
  note: "gratuit · 64 bits x86_64 · .tar.gz"
  others: "ou joue <a href=\"https://play.pixeldoro.io/web-beta\">dans ton navigateur</a>, ou installe-le sur <a href=\"{windows}\">windows</a> · <a href=\"https://play.pixeldoro.io/macos\">mac</a>"
  on_computer: "sur un ordi linux? ouvre cette page dessus pour le télécharger"
  facts:
    - "gratuit · sans pub"
    - "version native x86_64"
    - "un seul compte sur tous tes appareils"
  shot_alt: "Une maison décorée avec trois chats et deux amis en visite, chacun affichant son nombre de pomodoros et ce qu'il étudie"
  shot_caption: "reçois tes amis. les chats, eux, vivent ici."
  cards_title: "pourquoi prendre l'appli linux"
  cards:
    - title: "une version native"
      text: "une vraie version linux, pas une page web déguisée en appli. rien ne s'installe sur tout le système: tout tient dans un seul dossier."
    - title: "radio lofi intégrée"
      text: "six stations lofi + chill, donc pas besoin d'un autre onglet pour la musique. la pluie et le brouillard s'installent pendant que tu te concentres."
    - title: "de vraies personnes, en ce moment"
      text: "chaque personnage de la salle est une vraie personne en pleine session de focus, avec son minuteur et sa tâche au-dessus de la tête."
    - title: "ta progression partout"
      text: "connecte-toi avec ton email, et ta chambre, tes pièces et tes stats te suivent sur ton téléphone, ton ordi portable et dans le navigateur."
  steps_title: "comment installer pixeldoro sur linux"
  steps:
    - title: "télécharge-le"
      text: "clique sur le bouton de téléchargement pour récupérer pixeldoro en fichier .tar.gz."
    - title: "extrais-le"
      text: "extrais-le où tu veux, depuis ton gestionnaire de fichiers ou avec <code>tar -xzf pixeldoro-*.tar.gz</code>. tu obtiens un dossier <code>pixeldoro</code>."
    - title: "lance-le"
      text: "ouvre le dossier et lance <code>pixeldoro.x86_64</code>: double-clique dessus, ou tape <code>./pixeldoro.x86_64</code> dans un terminal. connecte-toi avec ton email si tu joues aussi sur d'autres appareils."
  prose_title: "l'appli ou le navigateur?"
  prose:
    - "pixeldoro tourne aussi dans n'importe quel navigateur, rien à installer. l'appli linux, c'est pour quand tu te concentres sur ton ordi tous les jours: elle a sa propre fenêtre, elle ne se ferme pas avec tes autres onglets, et les navigateurs ralentissent les onglets que tu ne regardes pas."
    - "tu découvres la technique? lis le <a href=\"{pomodoro-timer}\">guide du minuteur pomodoro</a>, ou vois comment <a href=\"{study-with-me}\">étudier à côté d'autres personnes</a> t'aide à te lancer."
  faq:
    - q: "pixeldoro est gratuit sur linux?"
      a: "oui. le minuteur, le monde, les autres joueurs, les amis et la radio sont gratuits, sans pub et sans abonnement. un pack de soutien optionnel, en achat unique, ajoute des pièces bonus et des objets premium."
    - q: "pixeldoro marche sur quelles distributions linux?"
      a: "linux de bureau 64 bits x86_64, avec une carte graphique compatible opengl 3.2 ou vulkan. pixeldoro est fait avec unity, qui supporte officiellement ubuntu 20.04 et 22.04. si ça ne se lance pas sur ta distro, écris à <a href=\"mailto:hello@pixeldoro.io\">hello@pixeldoro.io</a>."
    - q: "il existe un flatpak, un snap ou une appimage?"
      a: "pas encore. c'est une simple archive .tar.gz: extrais-la et lance-la."
    - q: "ça marche sur arm?"
      a: "non, la version linux est uniquement en x86_64. sur une machine arm, joue plutôt <a href=\"https://play.pixeldoro.io/web-beta\">dans le navigateur</a>."
    - q: "comment mettre à jour pixeldoro?"
      a: "télécharge la dernière version depuis cette page et remplace l'ancien dossier."
    - q: "je peux utiliser le même compte sur mon téléphone?"
      a: "oui. connecte-toi avec le même email sur iphone, android, mac ou dans le navigateur, et ta progression, ta chambre et tes pièces te suivent."
    - q: "il y a une version windows ou mac?"
      a: "oui. il y a une <a href=\"{windows}\">appli windows</a>, et la version mac est sur le <a href=\"https://play.pixeldoro.io/macos\">mac app store</a>."
  more: "à voir aussi: <a href=\"{windows}\">pixeldoro pour windows</a> · <a href=\"{pomodoro-timer}\">minuteur pomodoro</a> · <a href=\"{study-with-me}\">study with me</a> · <a href=\"{home}\">accueil pixeldoro</a>"
