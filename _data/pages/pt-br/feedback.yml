# A página feedback, português do Brasil.
text:
  title: "um recado do dev — pixeldoro"
  hello: "eaí 👋"
  intro: "aqui é o punk — a pessoa que tá fazendo o pixeldoro."
  sorry: "então. acabaram meus gift cards kkkk. foi mal."
  offer: "mas tenho uma coisa melhor — <b>premium vitalício</b> no pixeldoro. pra sempre. é todo seu se você topar uma call rapidinha comigo, ou só me mandar por e-mail o que você achou de verdade. qualquer um dos dois serve."
  reads: "seu feedback literalmente decide o que eu vou fazer em seguida. eu leio tudo."
  thanks: "valeu demais 🙏"
  call: "→ marcar uma call"
  email: "→ mandar feedback"
