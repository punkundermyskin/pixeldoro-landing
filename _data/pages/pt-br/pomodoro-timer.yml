# A página pomodoro-timer, português do Brasil. Mesmas chaves de "text" do en/pomodoro-timer.yml.
text:
  title: "Timer pomodoro aesthetic com pixel art e lofi | Pixeldoro"
  description: "Timer pomodoro aesthetic e grátis num mundo cozy em pixel art: 25/5, 45/15 ou personalizado, cronômetro, rádio lofi, tags e estatísticas. Em qualquer aparelho."
  crumb: "timer pomodoro"
  eyebrow: "guia pixeldoro"
  h1: "um timer pomodoro aesthetic num mundo em pixel art"
  lead: "o pixeldoro é um timer pomodoro grátis dentro de uma cidadezinha cozy em pixel art. escolha um preset ou crie o seu, ligue a rádio lofi e veja a chuva cair enquanto trabalha. cada pomodoro rende moedas, e suas horas vão se somando nas estatísticas, divididas pelo que você fez."
  facts:
    - "grátis · sem anúncios"
    - "sem assinatura"
    - "iphone · mac · android · windows · linux · navegador · discord"
  shot_alt: "Tela do timer de foco: opções 25/5, 45/15, 15/3, cronômetro e personalizado, um timer de 25:00 e tags de foco coloridas como provas de matemática, inglês e física"
  shot_caption: "escolha no que você vai focar e comece um pomodoro."
  cards_title: "tudo que um timer pomodoro precisa"
  cards:
    - title: "presets ou do seu jeito"
      text: "25/5, 45/15, 15/3 ou o tempo que você quiser. um cronômetro de até 8 horas pra sessões longas de foco profundo."
    - title: "rádio lofi integrada"
      text: "seis estações lofi e chill, sem playlist pra organizar. chuva e neblina chegam enquanto você foca."
    - title: "tags de foco"
      text: "marque cada sessão: provas, programação, leitura. um alarme de verdade toca quando acaba, e um lembrete te avisa quando a pausa termina."
    - title: "estatísticas que se acumulam"
      text: "veja para onde vão suas horas, divididas por tag, semana após semana. cada sessão também rende moedas pro seu quarto."
  steps_title: "como usar o timer pomodoro"
  steps:
    - title: "escolha um tempo"
      text: "25/5 é o clássico. 45/15 combina com blocos longos de estudo, e 15/3 é bom pra esquentar num dia mais devagar."
    - title: "coloque uma tag e comece"
      text: "escolha no que você vai trabalhar e aperte começar. todo mundo por perto vê seu timer e sua tarefa."
    - title: "faça a pausa"
      text: "quando o alarme tocar, levante, alongue, dê uma volta pela cidade. o pixeldoro te avisa quando é hora de voltar."
  prose_title: "o que é a técnica pomodoro?"
  prose:
    - "a técnica pomodoro divide o trabalho em blocos curtos de foco com pausas no meio. a versão clássica é 25 minutos de foco e 5 de pausa, com uma pausa mais longa depois de quatro rodadas. o nome vem de um timer de cozinha em forma de tomate, e é por isso que o mascote do pixeldoro é um tomate."
    - "funciona porque um bloco curto é fácil de começar, e saber que a pausa está chegando ajuda a continuar. se 25 minutos parecer muito, comece com menos. se você estiver no flow, use o cronômetro e siga em frente."
    - "só quer o timer? o <a href=\"{mini}\">pixeldoro mini</a> é a versão minimalista: timer, fundos em pixel art, música lofi e estatísticas. quer companhia enquanto foca? veja o <a href=\"{study-with-me}\">study with me</a>."
  faq:
    - q: "qual o melhor tempo de pomodoro?"
      a: "25 minutos de foco e 5 de pausa é o clássico. muita gente prefere 45/15 ou 50/10 pra foco profundo, e 15/3 nos dias de pouca energia. teste alguns e fique com o que funcionar."
    - q: "dá pra personalizar o tempo do timer?"
      a: "sim. além dos presets 25/5, 45/15 e 15/3, você pode definir um tempo personalizado ou usar o cronômetro por até 8 horas."
    - q: "ele avisa quando a sessão termina?"
      a: "sim. o pixeldoro toca um alarme de verdade quando sua sessão de foco termina e te avisa quando a pausa acaba."
    - q: "o timer pomodoro é grátis?"
      a: "sim. o timer, a rádio, as estatísticas e o mundo inteiro são grátis, sem anúncios e sem assinatura."
    - q: "tem uma versão mais simples?"
      a: "o pixeldoro mini é só o timer: fundos em pixel art, música lofi e estatísticas, no iphone e no android."
  more: "mais guias: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{adhd-focus-app}\">app de foco para tdah</a> · <a href=\"{home}\">página inicial do pixeldoro</a>"
