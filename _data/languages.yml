# Home page languages, in the app's order. Each one has a page at `path` built from _layouts/home.html.
# hreflang: what Google accepts (no "es-419", so Spanish is plain "es"); html: the page's lang attribute.
# hl: Google Play's listing language. Badges: English keeps its PNGs, the rest use Apple's and Google's own artwork.
- code: en
  name: english
  path: /
  hreflang: en
  html: en
  og: en_US
  hl: en
  app_store_badge: /images/app_store_badge.png
  app_store_size: [558, 165]
  google_play_badge: /images/google_play_badge.png
- code: es
  name: español
  path: /es/
  hreflang: es
  html: es-419
  og: es_LA
  hl: es-419
  app_store_badge: /images/badges/app-store-es.svg
  app_store_size: [120, 40]
  google_play_badge: /images/badges/google-play-es.png
