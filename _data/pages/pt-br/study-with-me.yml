# A página study-with-me, português do Brasil. Mesmas chaves de "text" do en/study-with-me.yml.
text:
  title: "Estude comigo online, ao vivo, com gente real | Pixeldoro"
  description: "Uma sala de estudo virtual ao vivo: estude ao lado de gente real focando agora. Body doubling sem câmera nem microfone, com timer pomodoro e rádio lofi."
  crumb: "study with me"
  eyebrow: "guia pixeldoro"
  h1: "estude comigo, ao vivo, com gente de verdade"
  lead: "o pixeldoro é uma sala de estudo virtual grátis que é uma cidadezinha cozy em pixel art. é só abrir e você já está estudando ao lado de gente de verdade que está focando agora, cada um com um timer e a tarefa em cima da cabeça. sem câmera, sem microfone, sem horário marcado."
  facts:
    - "grátis · sem anúncios"
    - "sem câmera nem microfone"
    - "iphone · mac · android · windows · linux · navegador · discord"
  shot_alt: "Um pomodoro rolando à noite na chuva, ao lado de um grupo de usuários estudando sob luminárias quentinhas, cada um mostrando seu timer e sua tarefa"
  shot_caption: "todo mundo aqui está estudando agora. chuvinha e lofi ligados."
  cards_title: "uma sala de estudo que nunca fecha"
  cards:
    - title: "gente de verdade, agora mesmo"
      text: "cada personagem que você vê é uma pessoa real numa sessão de foco. dá pra ver o timer, quantos pomodoros ela já fez e no que está trabalhando."
    - title: "sem câmera, sem chamada"
      text: "ninguém fica te olhando pela webcam. é a companhia silenciosa de uma biblioteca, sem sair da sua mesa."
    - title: "estude com amigos"
      text: "adicione amigos, veja quem está online e no que estão trabalhando, e visitem a casa um do outro pra focar lado a lado."
    - title: "uma sala pra cada vibe"
      text: "o campo, o centro, o bar, a loja e o qg, cada um com sua galera. troque de servidor pra encontrar outra."
  steps_title: "como estudar com outras pessoas no pixeldoro"
  steps:
    - title: "escolha uma sala"
      text: "abra o pixeldoro no navegador ou no app e entre em qualquer sala. tem gente focando em todas."
    - title: "diga no que você está trabalhando"
      text: "coloque uma tag na sessão (provas, programação, leitura) e comece um pomodoro. todo mundo por perto vê a sua, e você vê a deles."
    - title: "foque com a galera"
      text: "quando o timer tocar, façam a pausa juntos: dê uma volta, veja como estão os amigos, gaste as moedas que você ganhou."
  prose_title: "por que estudar com outras pessoas funciona"
  prose:
    - "os vídeos de study with me bombaram por um motivo simples: é mais fácil começar e continuar quando tem mais alguém trabalhando também. é o mesmo motivo pelo qual uma biblioteca ou uma cafeteria ajuda. psicólogos chamam isso de facilitação social; muita gente com tdah chama de <a href=\"{adhd-focus-app}\">body doubling</a>."
    - "um vídeo é de mão única e já vem gravado. no pixeldoro as pessoas ao seu redor estão focando agora, e elas te veem também. esse pouquinho de compromisso muitas vezes já basta pra parar de rolar o feed e começar o próximo <a href=\"{pomodoro-timer}\">pomodoro</a>."
  faq:
    - q: "o que é study with me?"
      a: "study with me (estude comigo) é um vídeo ou uma live de alguém estudando, pra você estudar junto. o pixeldoro faz isso ao vivo e nos dois sentidos: as pessoas ao seu redor estão estudando agora, e elas te veem também."
    - q: "precisa de câmera ou microfone?"
      a: "não. você é um personagem em pixel art com um timer e uma tarefa em cima da cabeça. ninguém te vê nem te ouve."
    - q: "dá pra estudar com amigos?"
      a: "sim. adicione amigos, veja onde estão e no que estão focando, e visitem a casa um do outro pra estudar juntos. nos lobbies dá pra trocar de servidor também."
    - q: "sempre tem alguém online?"
      a: "gente do mundo todo foca no pixeldoro a qualquer hora do dia, então as salas quase nunca ficam vazias."
    - q: "é grátis?"
      a: "sim. o timer, o mundo, os outros jogadores, os amigos e a rádio são todos grátis, sem anúncios e sem assinatura. um pacote de apoiador opcional, com pagamento único, dá moedas bônus e itens premium."
  more: "mais guias: <a href=\"{pomodoro-timer}\">timer pomodoro</a> · <a href=\"{adhd-focus-app}\">app de foco para tdah</a> · <a href=\"{home}\">página inicial do pixeldoro</a>"
