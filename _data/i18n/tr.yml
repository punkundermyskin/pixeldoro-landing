faq:
  title: "sıkça sorulan sorular"
  items:
    - q: "pixeldoro nedir?"
      a: "pixeldoro, sıcacık bir piksel art dünyanın içinde ücretsiz bir pomodoro zamanlayıcı. bir yer seçiyor, bir odak seansı başlatıyor ve aynısını yapan gerçek insanların yanında çalışıyorsun. her seans odan için jeton kazandırır, hikâyeyi ilerletir ve istatistiklerine eklenir. içinde lofi radyo var; iphone, ipad, mac, android, windows, linux, tarayıcı ve discord'da çalışır."
    - q: "pixeldoro ücretsiz mi?"
      a: "evet. zamanlayıcı, dünya, diğer oyuncular, arkadaşlar, görevler, evcil hayvanlar ve radyo tamamen ücretsiz; reklam yok, abonelik yok. istersen tek seferlik bir destekçi paketi de var: her seansta %25 daha fazla jeton, profil rozeti, premium görünümler, mobilyalar, arka planlar ve odalar, bir de bonus görev."
    - q: "bu bir oyun mu, verimlilik uygulaması mı?"
      a: "ikisi de, ama önce zamanlayıcı gelir. oyun sadece sen odaklandığında ilerler: pomodoro bitirdikçe jeton kazanır, görevleri tamamlar ve yeni yerlerin kilidini açarsın. seanslar arasında da seni işinden koparmadan tatmin edecek kadar yapacak şey var."
    - q: "diğer insanlar gerçek mi?"
      a: "evet. etrafta dolaşan ya da bir masada oturan her karakter, şu an odaklanan gerçek bir oyuncu. zamanlayıcısını, kaç pomodoro yaptığını ve ne üzerinde çalıştığını görebilirsin."
    - q: "body doubling nedir?"
      a: "body doubling, başlamayı ve devam etmeyi kolaylaştırmak için başka birinin yanında çalışmak demek. kütüphanede ya da kafede ders çalışmanın işe yaramasının sebebi de bu. pixeldoro sana bu hissi kamerasız ve randevusuz verir: istediğin an aç, etrafında işine gömülmüş insanlar var."
    - q: "arkadaşlarımla ders çalışabilir miyim?"
      a: "evet. arkadaş ekle, kimin çevrimiçi olduğunu ve ne üzerinde çalıştığını gör, yan yana odaklanmak için birbirinizin evine uğrayın. lobilerle sunucu değiştirip farklı bir kalabalık bulabilirsin."
    - q: "dehb için iyi mi?"
      a: "sıradan bir zamanlayıcıdan hemen kopan beyinler için yapıldı. sırf geldiğin için seni ödüllendirir, etrafında odaklanan diğer insanlar başlamana yardım eder, hikâye de geri dönmen için bir sebep verir. tıbbi bir araç değil, sadece işe koyulmanın daha sıcacık bir yolu."
    - q: "yapılacaklar listesi ya da uygulama engelleme var mı?"
      a: "henüz yok. odak etiketleriyle her seansı etiketleyebilirsin (sınavlar, kodlama, okuma), istatistiklerin de zamanını etikete göre ayırır. ikisi de yapılacaklar listemizde."
    - q: "hangi cihazlarda oynayabilirim, ilerlemem senkronize oluyor mu?"
      a: "app store'dan iphone, ipad ve mac'te, google play'den android'de, pixeldoro.io'dan windows ve linux'ta, play.pixeldoro.io adresinden her tarayıcıda ve discord içinde bir etkinlik olarak. e-postanla giriş yap; ilerlemen, odan ve jetonların her cihazda seninle gelir. 9 dil konuşuyor."

