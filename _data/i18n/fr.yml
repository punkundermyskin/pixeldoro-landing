faq:
  title: "questions fréquentes"
  items:
    - q: "c'est quoi, pixeldoro?"
      a: "pixeldoro est un minuteur pomodoro gratuit dans un monde cosy en pixel art. tu choisis un coin, tu lances une session de focus et tu bosses à côté de vraies personnes qui font pareil. chaque session te rapporte des pièces pour ta chambre, fait avancer l'histoire et gonfle tes stats. la radio lofi est intégrée, et ça tourne sur iphone, ipad, mac, android, windows, linux, dans le navigateur et sur discord."
    - q: "pixeldoro est gratuit?"
      a: "oui. le minuteur, le monde, les autres joueurs, les amis, les quêtes, les animaux et la radio sont gratuits, sans pub et sans abonnement. il existe un pack de soutien optionnel, en achat unique: 25% de pièces en plus à chaque session, un badge sur ton profil, des skins, meubles, décors et salles premium, et une quête bonus."
    - q: "c'est un jeu ou une appli de productivité?"
      a: "les deux, mais le minuteur passe en premier. le jeu n'avance que quand tu te concentres: terminer des pomodoros rapporte des pièces, valide des quêtes et débloque de nouveaux lieux. entre deux sessions, il y a juste assez à faire pour que ce soit gratifiant, sans te détourner de ta tâche."
    - q: "les autres joueurs sont de vraies personnes?"
      a: "oui. chaque personnage qui se balade ou qui est assis à un bureau est un vrai joueur en train de se concentrer en ce moment. tu vois son minuteur, combien de pomodoros il a faits et sur quoi il travaille."
    - q: "c'est quoi, le body doubling?"
      a: "le body doubling, c'est travailler à côté de quelqu'un pour avoir plus de facilité à commencer et à continuer. c'est pour ça qu'étudier à la bibliothèque ou dans un café marche si bien. pixeldoro te donne cette sensation sans caméra ni horaire: ouvre-le quand tu veux, et il y a des gens en mode focus autour de toi."
    - q: "je peux étudier avec mes amis?"
      a: "oui. ajoute des amis, vois qui est en ligne et sur quoi ils bossent, et allez les uns chez les autres pour vous concentrer côte à côte. tu peux aussi changer de serveur pour tomber sur d'autres gens."
    - q: "est-ce que ça aide avec un tdah?"
      a: "c'est pensé pour les cerveaux qui décrochent devant un minuteur classique. le simple fait de venir est récompensé, les autres qui se concentrent autour de toi t'aident à te lancer, et l'histoire te donne une raison de revenir. ce n'est pas un outil médical, juste une façon plus cosy de t'y mettre."
    - q: "il y a une to-do list ou un blocage d'applis?"
      a: "pas encore. les tags de focus te permettent d'étiqueter chaque session (examens, code, lecture) et tes stats répartissent ton temps par tag. les deux sont prévus."
    - q: "je peux jouer sur quoi, et ma progression est synchronisée?"
      a: "iphone, ipad et mac sur l'app store, android sur google play, windows et linux sur pixeldoro.io, n'importe quel navigateur sur play.pixeldoro.io, et en activité dans discord. connecte-toi avec ton email et ta progression, ta chambre et tes pièces te suivent sur tous tes appareils. pixeldoro parle 9 langues."

outro:
  title: "on passe en mode focus?"
  lead: "gratuit sur tous tes appareils. des gens se concentrent en ce moment même."

