# Halaman study-with-me, bahasa Indonesia. Key mengikuti text di en/study-with-me.yml.
text:
  title: "Study with me online bareng orang sungguhan | Pixeldoro"
  description: "Ruang belajar virtual live: belajar bareng orang sungguhan yang lagi fokus sekarang. Body doubling tanpa kamera atau mic, plus timer pomodoro dan radio lofi."
  crumb: "study with me"
  eyebrow: "panduan pixeldoro"
  h1: "study with me, live, bareng orang sungguhan"
  lead: "pixeldoro adalah ruang belajar virtual gratis dalam bentuk kota pixel yang cozy. buka, dan kamu langsung belajar di samping orang sungguhan yang lagi fokus saat ini, masing-masing dengan timer dan tugasnya terpampang di atas kepala. tanpa kamera, tanpa mic, tanpa jadwal."
  facts:
    - "gratis · tanpa iklan"
    - "tanpa kamera atau mic"
    - "iphone · mac · android · windows · linux · browser · discord"
  shot_alt: "Pomodoro berjalan di malam hari saat hujan, di samping sekelompok pengguna yang belajar di bawah lampu yang hangat, masing-masing menampilkan timer dan tugasnya"
  shot_caption: "semua orang di sini lagi belajar sekarang. hujan nyala, lofi nyala."
  cards_title: "ruang belajar yang tak pernah tutup"
  cards:
    - title: "orang sungguhan, saat ini juga"
      text: "setiap karakter yang kamu lihat adalah orang sungguhan yang sedang dalam sesi fokus. kamu bisa lihat timer mereka, jumlah pomodoronya, dan apa yang lagi mereka kerjakan."
    - title: "tanpa kamera, tanpa call"
      text: "tidak ada yang mengawasimu lewat webcam. rasanya seperti ditemani suasana tenang perpustakaan, tanpa harus meninggalkan mejamu."
    - title: "belajar bareng teman"
      text: "tambah teman, lihat siapa yang online dan apa yang sedang mereka kerjakan, lalu saling main ke rumah untuk fokus berdampingan."
    - title: "ruangan untuk setiap mood"
      text: "pedesaan, pusat kota, bar, toko, dan hq, masing-masing dengan keramaiannya sendiri. ganti server untuk menemukan keramaian yang lain."
  steps_title: "cara belajar bareng orang lain di pixeldoro"
  steps:
    - title: "pilih ruangan"
      text: "buka pixeldoro di browser atau di aplikasinya, lalu masuk ke ruangan mana pun. di setiap ruangan selalu ada orang yang lagi fokus."
    - title: "kasih tahu apa yang kamu kerjakan"
      text: "beri tag pada sesimu (ujian, coding, membaca), lalu mulai pomodoro. semua orang di sekitarmu bisa melihatnya, dan kamu juga bisa lihat punya mereka."
    - title: "fokus rame-rame"
      text: "saat timer berbunyi, istirahat bareng: jalan-jalan, cek teman, belanjakan koin yang kamu dapat."
  prose_title: "kenapa belajar bareng orang lain itu ampuh"
  prose:
    - "video study with me jadi populer karena alasan yang sederhana: lebih gampang untuk mulai dan terus jalan kalau ada orang lain yang juga sedang bekerja. alasannya sama dengan kenapa perpustakaan atau kafe membantu. psikolog menyebutnya fasilitasi sosial; orang dengan adhd sering menyebutnya <a href=\"{adhd-focus-app}\">body doubling</a>."
    - "video itu satu arah dan sudah direkam sebelumnya. di pixeldoro, orang-orang di sekitarmu sedang fokus saat ini juga, dan mereka juga bisa melihatmu. sedikit rasa tanggung jawab itu sering kali cukup untuk berhenti scrolling dan mulai <a href=\"{pomodoro-timer}\">pomodoro</a> berikutnya."
  faq:
    - q: "apa itu study with me?"
      a: "study with me adalah video atau siaran langsung seseorang yang sedang belajar, supaya kamu bisa ikut belajar bareng dia. pixeldoro membuatnya live dan dua arah: orang-orang di sekitarmu lagi belajar saat ini juga, dan mereka juga bisa melihatmu."
    - q: "apakah perlu kamera atau mikrofon?"
      a: "tidak. kamu adalah karakter pixel dengan timer dan tugas di atas kepala. tidak ada yang bisa melihat atau mendengarmu."
    - q: "bisa belajar bareng teman?"
      a: "bisa. tambah teman, lihat mereka ada di mana dan lagi fokus ke apa, lalu saling main ke rumah untuk belajar bareng. lewat lobi, kamu juga bisa ganti server."
    - q: "apakah selalu ada orang yang online?"
      a: "orang-orang dari seluruh dunia fokus di pixeldoro 24 jam nonstop, jadi ruangannya jarang sepi."
    - q: "apakah gratis?"
      a: "iya. timer, dunianya, pemain lain, teman, dan radio semuanya gratis, tanpa iklan dan tanpa langganan. ada paket supporter opsional yang cukup dibeli sekali untuk bonus koin dan item premium."
  more: "panduan lainnya: <a href=\"{pomodoro-timer}\">timer pomodoro</a> · <a href=\"{adhd-focus-app}\">aplikasi fokus adhd</a> · <a href=\"{home}\">beranda pixeldoro</a>"
