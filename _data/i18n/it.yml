faq:
  title: "domande frequenti"
  items:
    - q: "cos'è pixeldoro?"
      a: "pixeldoro è un timer pomodoro gratuito dentro un mondo cozy in pixel art. scegli un posto, avvii una sessione di focus e lavori accanto a persone vere che fanno lo stesso. ogni sessione ti fa guadagnare monete per la tua stanza, manda avanti la storia e si somma alle tue statistiche. ha una radio lofi integrata e funziona su iphone, ipad, mac, android, windows, linux, nel browser e su discord."
    - q: "pixeldoro è gratis?"
      a: "sì. il timer, il mondo, gli altri giocatori, gli amici, le missioni, gli animali e la radio sono tutti gratis, senza pubblicità e senza abbonamento. c'è un pacchetto supporter facoltativo, a pagamento unico: il 25% di monete in più a ogni sessione, un badge sul profilo, skin, mobili, sfondi e stanze premium, e una missione bonus."
    - q: "è un gioco o un'app di produttività?"
      a: "tutti e due, ma prima viene il timer. il gioco va avanti solo quando ti concentri: completando pomodori guadagni monete, porti a termine missioni e sblocchi nuovi posti. tra una sessione e l'altra c'è quanto basta da fare per sentirti gratificato, senza distrarti da quello che devi fare."
    - q: "le altre persone sono vere?"
      a: "sì. ogni personaggio che va in giro o è seduto a una scrivania è un giocatore vero che si sta concentrando in questo momento. puoi vedere il suo timer, quanti pomodori ha fatto e su cosa sta lavorando."
    - q: "cos'è il body doubling?"
      a: "body doubling vuol dire lavorare accanto a qualcun altro, così è più facile iniziare e andare avanti. è il motivo per cui studiare in biblioteca o al bar funziona. pixeldoro ti dà questa sensazione senza telecamera e senza orari: aprilo quando vuoi e intorno a te c'è gente concentrata."
    - q: "posso studiare con gli amici?"
      a: "sì. aggiungi amici, guarda chi è online e su cosa sta lavorando, e venitevi a trovare a casa per concentrarvi fianco a fianco. con le lobby puoi cambiare server e trovare altra gente."
    - q: "è adatto a chi ha l'adhd?"
      a: "è pensato per i cervelli che ignorano un timer normale. ti premia anche solo per esserci, le altre persone concentrate intorno a te ti aiutano a iniziare e la storia ti dà un motivo per tornare. non è uno strumento medico, solo un modo più cozy per partire."
    - q: "c'è una lista delle cose da fare o il blocco delle app?"
      a: "non ancora. con i tag di focus puoi etichettare ogni sessione (esami, coding, lettura) e le statistiche dividono il tuo tempo per tag. tutte e due le cose sono in programma."
    - q: "su cosa posso usarlo, e i progressi si sincronizzano?"
      a: "iphone, ipad e mac sull'app store, android su google play, windows e linux su pixeldoro.io, qualsiasi browser su play.pixeldoro.io, e come attività dentro discord. accedi con la tua email e progressi, stanza e monete ti seguono su ogni dispositivo. parla 9 lingue."

outro:
  title: "pronto a darci dentro?"
  lead: "gratis su ogni dispositivo. c'è gente che si sta concentrando proprio ora."

