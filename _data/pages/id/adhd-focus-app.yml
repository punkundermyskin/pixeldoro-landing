# Halaman adhd-focus-app, bahasa Indonesia. Key mengikuti text di en/adhd-focus-app.yml.
text:
  title: "Aplikasi fokus ADHD: body doubling dan hadiah | Pixeldoro"
  description: "Aplikasi fokus gratis untuk otak ADHD: body doubling bareng orang sungguhan, koin tiap sesi, timer pendek, dan cerita untuk kembali. Tanpa kamera, tanpa iklan."
  crumb: "aplikasi fokus adhd"
  eyebrow: "panduan pixeldoro"
  h1: "aplikasi fokus untuk otak adhd"
  lead: "timer biasa gampang dicuekin. pixeldoro mengubah fokus jadi game yang kamu mainkan bareng orang lain: orang sungguhan yang fokus di sekitarmu membantumu mulai, tiap sesi langsung kasih hadiah, dan ceritanya memberimu alasan untuk kembali besok."
  facts:
    - "gratis · tanpa iklan"
    - "tanpa langganan"
    - "iphone · mac · android · windows · linux · browser · discord"
  shot_alt: "Layar hadiah setelah sesi fokus selesai: fokusmu dapat jarahan, 30 koin, klaim"
  shot_caption: "tiap pomodoro ada hadiahnya, langsung."
  cards_title: "dibuat untuk otak yang gampang cuek sama timer"
  cards:
    - title: "body doubling bawaan"
      text: "orang sungguhan yang fokus di sekitarmu bikin kamu lebih gampang mulai. tanpa kamera, tanpa call, tanpa perlu booking sesi."
    - title: "hadiah langsung"
      text: "tiap pomodoro dapat koin. belanjakan untuk perabot, ruangan, outfit, dan hewan peliharaan."
    - title: "sesi pendek tetap dihitung"
      text: "preset 15/3 untuk hari-hari saat 25 menit terasa terlalu berat, dan stopwatch untuk saat hyperfocus datang."
    - title: "alasan untuk kembali"
      text: "misi cerita, harian, dan mingguan, tantangan komunitas mingguan, dan statistik yang terus menumpuk."
  steps_title: "cara mulai, saat memulai justru bagian paling susah"
  steps:
    - title: "buka aja dulu"
      text: "kamu tidak perlu rencana. buka pixeldoro dan duduk di ruangan yang orang-orangnya sudah mulai kerja."
    - title: "pilih satu hal kecil"
      text: "kasih tag, lalu mulai sesi pendek. 15 menit juga pomodoro beneran."
    - title: "ambil koinmu"
      text: "klaim hadiahmu, istirahat dulu, lalu lihat apakah kamu mau satu ronde lagi."
  prose_title: "apa itu body doubling?"
  prose:
    - "body doubling artinya bekerja saat ada orang lain di sekitarmu. banyak orang dengan adhd merasa jauh lebih gampang untuk mulai dan tetap fokus pada tugas kalau ada orang lain di situ, meskipun orang itu sibuk dengan kerjaannya sendiri."
    - "pixeldoro memberimu itu kapan pun kamu butuh. orang-orang di setiap ruangan itu nyata dan sedang fokus saat ini juga, dengan timer dan tugas mereka yang terlihat. kamu tetap ditemani, tanpa kamera, tanpa jadwal, dan tanpa orang asing yang memperhatikanmu. selengkapnya di <a href=\"{study-with-me}\">study with me</a>."
    - "pixeldoro bukan alat medis atau pengobatan untuk adhd. ini cuma cara yang lebih cozy untuk mulai bergerak."
  quotes_title: "dari ulasan pengguna"
  faq:
    - q: "apakah pixeldoro cocok untuk adhd?"
      a: "pixeldoro dibuat untuk otak yang gampang cuek sama timer biasa. kamu dapat hadiah cukup dengan muncul, orang lain yang fokus di sekitarmu membantumu mulai, dan ceritanya memberimu alasan untuk kembali. ini bukan alat medis, cuma cara yang lebih cozy untuk mulai bergerak."
    - q: "apa itu body doubling?"
      a: "bekerja di samping orang lain supaya lebih gampang untuk mulai dan terus jalan. di pixeldoro, orang-orang di sekitarmu nyata dan sedang fokus saat ini juga, tanpa kamera atau call."
    - q: "gimana kalau tidak bisa fokus selama 25 menit?"
      a: "pakai preset 15/3 atau atur durasimu sendiri. sesi pendek tetap dapat koin dan dihitung untuk misi."
    - q: "apakah bisa memblokir aplikasi yang mengganggu?"
      a: "belum. tag fokus bisa dipakai untuk memberi label tiap sesi, dan statistikmu membagi waktumu per tag. pemblokir aplikasi sudah masuk daftar rencana."
    - q: "apakah gratis?"
      a: "iya. tanpa iklan, tanpa langganan. ada paket supporter opsional yang cukup dibeli sekali untuk bonus koin dan item premium."
  more: "panduan lainnya: <a href=\"{study-with-me}\">study with me</a> · <a href=\"{pomodoro-timer}\">timer pomodoro</a> · <a href=\"{home}\">beranda pixeldoro</a>"
